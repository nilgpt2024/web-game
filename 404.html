<style>

  body {

  .wrap { position:relative; z-index:1; text-align:center; max-width:620px; }
  .logo { display:inline-flex; align-items:center; gap:10px; text-decoration:none; color:#fff; font-weight:800; font-size:22px; margin-bottom:36px; }
  .logo i { color:#a78bfa; font-size:24px; }
  .code { font-size:clamp(88px,20vw,150px); font-weight:800; line-height:1;

    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  h1 { font-size:clamp(22px,4vw,30px); font-weight:700; margin:12px 0 14px; }
  p { color:#a89fb5; font-size:16px; line-height:1.7; margin-bottom:32px; }
  .actions { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:13px 26px; border-radius:12px;
    font-size:15px; font-weight:600; text-decoration:none; transition:transform .15s,box-shadow .15s; }
  .btn-primary { background:linear-gradient(135deg,#7c3aed,#4f46e5); color:#fff; box-shadow:0 8px 24px rgba(124,58,237,.35); }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(124,58,237,.5); }
  .btn-ghost { background:rgba(255,255,255,.06); color:#e8e4ec; border:1px solid rgba(255,255,255,.12); }
  .btn-ghost:hover { background:rgba(255,255,255,.1); }
