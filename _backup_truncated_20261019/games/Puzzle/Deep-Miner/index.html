            padding: 12px 6px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid var(--border);
            transition: all 0.2s;
            cursor: pointer
        }

        .inv-slot:hover {
            border-color: var(--text-muted);
            background: var(--bg-hover);
            transform: translateY(-2px)
        }

        .inv-slot .slot-icon {
            font-size: 24px;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5))
        }

        .inv-slot .slot-count {
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5)
        }

        .inv-slot .slot-value {
            font-size: 10px;
            color: var(--warning);
            margin-top: 3px;
            font-weight: 600
        }

        .inv-empty {
            grid-column: 1/-1;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 24px;
            font-weight: 500
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2)
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4)
        }

        .btn-primary:disabled {
            background: var(--bg-hover);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff
        }

        .btn-danger:hover:not(:disabled) {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4)
        }

        #upgrades-list {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .upgrade-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-panel);
            padding: 14px;
            border-radius: 10px;
            border: 2px solid var(--border);
            transition: all 0.2s
        }

        .upgrade-card:hover {
            border-color: var(--text-muted);
            transform: translateX(4px)
        }

        .upgrade-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            border: 2px solid var(--border)
        }

        .upgrade-info {
            flex: 1;
            min-width: 0
        }

        .upgrade-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px
        }

        .upgrade-level {
            font-size: 11px;
            color: var(--accent);
            font-weight: 700;
            background: rgba(59, 130, 246, 0.1);
            padding: 2px 8px;
            border-radius: 6px
        }

        .upgrade-desc {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
            font-weight: 500
        }

        .upgrade-btn {
            padding: 10px 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3)
        }

        .upgrade-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--accent-hover), #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.5)
        }

        .upgrade-btn:disabled {
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none
        }

        .upgrade-btn.maxed {
            background: linear-gradient(135deg, var(--success), #059669);
            color: #fff;
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3)
        }

        .achievement {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-panel);
            padding: 14px;
            border-radius: 10px;
            border: 2px solid var(--border);
            margin-bottom: 10px;
            opacity: 0.5;
            transition: all 0.3s
        }

        .achievement.unlocked {
            opacity: 1;
            border-color: var(--warning);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2)
        }
