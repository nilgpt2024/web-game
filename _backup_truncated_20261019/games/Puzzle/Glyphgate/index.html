.modalbtns .btn{flex:1;min-width:130px;width:auto}
.legend{display:grid;grid-template-columns:auto repeat(3,1fr);gap:5px;align-items:center;justify-items:center;
  margin:10px 0 14px;padding:12px 14px;border:1px solid var(--edge);border-radius:12px;background:rgba(255,255,255,.02)}
.legend b{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);font-weight:600}
.legend i{font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);justify-self:end;padding-right:6px}
.demo{display:flex;gap:10px;align-items:center;margin:9px 0;padding:9px 11px;border:1px solid var(--edge);border-radius:10px;background:rgba(255,255,255,.02)}
.demo .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-left:auto;flex:none}
.demo.y .lab{color:var(--yes)} .demo.n .lab{color:var(--no)}

.gatemap{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-top:6px}
.gcard{border:1px solid var(--edge);border-radius:11px;padding:10px 12px;text-align:left;transition:.15s;background:rgba(255,255,255,.02)}
.gcard:hover:not(:disabled){border-color:var(--gold2);background:rgba(232,192,122,.06)}
.gcard:disabled{opacity:.34;cursor:not-allowed}
.gcard .n{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
.gcard .t{font-family:"Cormorant Garamond",serif;font-size:16.5px;font-weight:700;line-height:1.2;margin:1px 0 3px}
.gcard .s{font-size:11px;color:var(--yes)}
.gcard .s.none{color:var(--dim2)}
.toastwrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(190px + env(safe-area-inset-bottom));z-index:60;
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{padding:8px 15px;border-radius:99px;border:1px solid var(--edge2);background:rgba(24,20,38,.96);
  font-size:12.5px;color:var(--text);box-shadow:var(--shadow);animation:toastin .3s ease-out}
@keyframes toastin{0%{opacity:0;transform:translateY(9px)}100%{opacity:1;transform:none}}
.toast.gold{border-color:rgba(232,192,122,.55);color:var(--gold)}
.toast.bad{border-color:rgba(255,80,100,.5);color:#ffb3bc}

.sealwrap{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:rgba(6,5,12,.7);backdrop-filter:blur(3px)}
body.sealing .sealwrap{display:flex}
body.sealing #app{filter:saturate(.4)}
.sealbox{display:flex;flex-direction:column;align-items:center;gap:13px;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold2)}
.sealring{width:34px;height:34px;border-radius:50%;border:2px solid rgba(232,192,122,.2);border-top-color:var(--gold);
  animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sheetbtn{display:none}
.hidden{display:none !important}
.narrow{display:none}
.credit{margin:16px 0 0 !important;padding-top:13px;border-top:1px solid var(--edge);text-align:center;font-size:11.5px;color:var(--dim2) !important}
.credit a{color:var(--gold2);text-decoration:none}
.credit a:hover{color:var(--gold);text-decoration:underline}

/* ---------------------------------------------------------------- mobile */
@media (max-width:860px){
  main{flex-direction:column}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:76vh;z-index:40;
    border-left:none;border-top:1px solid var(--edge2);border-radius:18px 18px 0 0;
    transform:translateY(102%);transition:transform .3s cubic-bezier(.3,1,.4,1);box-shadow:0 -16px 40px rgba(0,0,0,.6)}
  .panel.open{transform:none}
  .panel-head{padding-top:16px;position:relative}
  .panel-head::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:4px;
    border-radius:2px;background:var(--edge2)}
  .panel-body{padding-bottom:26px}
  .sheetbtn{display:flex}
  .tray{flex-direction:column;align-items:stretch;gap:7px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .hall{display:none}
  .traymid{display:contents}
  .slots{order:1;gap:5px;padding:6px;min-height:52px;justify-content:center;max-width:520px;width:100%;margin:0 auto}
  .slot{width:36px;height:36px}
  .palette{order:2;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;width:100%;max-width:520px;margin:0 auto}
  .pg{width:auto;min-width:0;height:38px}
  .trayactions{order:3;display:flex;gap:6px;max-width:520px;width:100%;margin:0 auto}
  .tbtn{flex:1;text-align:center;padding:8px 4px;font-size:12.5px}
  .wide{display:none} .narrow{display:inline}
  .brand{display:none}
  .gate-id b{font-size:16px}
  #chipPar{display:none}
  .iconbtn{width:32px;height:32px;border-radius:8px}
  .iconbtn svg{width:15px;height:15px}
  header{padding:7px 11px;gap:9px}
  .chip{min-width:44px;padding:3px 6px}
  .chip b{font-size:14px}
  .modal{padding:20px 19px}
  .modal h1{font-size:27px}
  .toastwrap{bottom:calc(160px + env(safe-area-inset-bottom))}
  .g{width:22px;height:22px}
  .rowcard{padding:5px 7px;gap:5px}
  .col-head{padding:6px 10px;font-size:10px}
}
@media (max-width:400px){
  .slot{width:32px;height:32px}
  .pg{height:32px}
  .slots{gap:4px;padding:5px;min-height:46px}
  .g{width:20px;height:20px}
  .tbtn{padding:7px 3px;font-size:11.5px}
}
@media (min-width:620px) and (max-width:860px){
  .brand{display:block;font-size:18px} #chipPar{display:flex}
  .hall{display:flex;width:142px} .gateviz{width:104px;height:178px}
}
@media (max-width:1040px) and (min-width:861px){ .hall{width:132px} .gateviz{width:104px;height:178px} }
@media (max-height:640px) and (min-width:861px){ .gateviz{height:170px;width:100px} }
/* a phone cannot spare room for the arch, so the meter lives under the header instead */
.hmeter{display:none;height:3px;background:rgba(255,255,255,.06);flex:none}
.hmeter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6b5aa8,var(--yes));transition:width .5s cubic-bezier(.3,1,.4,1)}
@media (max-width:860px){ .hmeter{display:block} #parText{display:block} }
@media (min-width:861px){ #parText{display:none} }
