  <div id="app">

    <!-- Navigation -->

        </div>
        <div class="hud-item">
          <i class="fas fa-skull"></i>
          <div>
            <span class="hud-label" data-i18n="specific.MountBlade.kills">击杀</span>
            <span id="kills" class="hud-value">0</span>
          </div>
        </div>
        <div class="hud-item">
          <i class="fas fa-khanda"></i>
          <div>
            <span class="hud-label" data-i18n="specific.MountBlade.weapon">武器</span>
            <span id="weapon" class="hud-value">弓</span>
          </div>
        </div>
        <div class="hud-item">
          <i class="fas fa-users"></i>
          <div>
            <span class="hud-label" data-i18n="specific.MountBlade.allies">友军</span>
            <span id="allies" class="hud-value">0</span>
          </div>
        </div>
        <div class="hud-item">

        </div>

    </div>

    <div class="weapon-hint">

  <script>
    // 动态计算返回大厅与国际化脚本的路径（兼容 dev 入口与 dist 产物）
    (function () {
      const backBtn = document.getElementById('back-btn');
      const menuRestartBtn = document.getElementById('menu-restart-btn');
      const inDist = location.pathname.includes('/dist/');
      const depth = inDist ? 4 : 3;
      const hubPath = Array(depth).fill('..').join('/') + '/index.html';
      if (backBtn) backBtn.href = hubPath;
      if (menuRestartBtn) menuRestartBtn.href = hubPath;

      const i18nScript = document.createElement('script');
      i18nScript.src = Array(depth).fill('..').join('/') + '/game-i18n.js';
      i18nScript.onload = function () {
        if (typeof GameI18n !== 'undefined') {
          const gameI18n = new GameI18n();
          gameI18n.init();
        }
      };
      document.body.appendChild(i18nScript);
    })();
  </script>
