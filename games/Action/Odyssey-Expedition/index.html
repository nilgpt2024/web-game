      <div class="title-content">

          <div class="ctrl-row"><kbd>空格</kbd> 开始 / 暂停</div>

      </div>
    </div>

        <div class="hud-center">

        </div>
        <div class="hud-right">
          <span class="hud-ammo">⏱ <strong id="time">0</strong>s</span>
        </div>
      </div>
      <div class="hud-bottom">
        <span class="hud-hint" id="hud-hint">向右收集宝藏，避开礁石！</span>
      </div>
    </div>

    <!-- Game Over -->
