<script id="core">
// The rules, and nothing that draws or sounds. test/blockdrop.mjs runs this block in Node.
// Board: 10 wide, 40 tall, row 0 at the top; rows 20..39 are the visible well. SRS rotation
// with the guideline kick tables, a 7-bag from a seeded generator, hold, lock delay with move
// reset (15 resets per lowest row), guideline scoring with T-spins, back-to-back, combo and
// all-clear. The page drains `events` after every call and draws or plays what happened.
const BW = (() => {
    const W = 10, H = 40, TOP = 20, KINDS = 'IJLOSTZ';
    const BOX = {
        I: ['....', 'XXXX', '....', '....'],
        J: ['X..', 'XXX', '...'],
        L: ['..X', 'XXX', '...'],
        O: ['.XX.', '.XX.', '....'],
        S: ['.XX', 'XX.', '...'],
        T: ['.X.', 'XXX', '...'],
        Z: ['XX.', '.XX', '...'],
    };
    // Which cell of a piece carries the small inner square (index into its state-0 cells).
    const MARK = {I: 1, J: 2, L: 2, O: 2, S: 3, T: 2, Z: 2};
    // SHAPES[k][r] = cells [x, y] in the piece's box, for rotation states 0, R, 2, L.
    const SHAPES = {};
    for (const k of KINDS) {
        const rows = BOX[k], n = rows[0].length;
        let cells = [];
        rows.forEach((row, y) => [...row].forEach((ch, x) => ch === 'X' && cells.push([x, y])));
        const states = [cells];
        for (let r = 1; r < 4; r++) {
            // clockwise in a box of side n (O keeps its cells: it does not turn)
            cells = k === 'O' ? cells : cells.map(([x, y]) => [n - 1 - y, x]);
            states.push(cells);
        }
        SHAPES[k] = states;
    }
    // Guideline SRS kicks, written as the guideline prints them (y up); applied with y flipped.
    const K3 = {
        '0>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
        '1>0': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
        '1>2': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
        '2>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
        '2>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
        '3>2': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
        '3>0': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
        '0>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
    };
    const KI = {
        '0>1': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
        '1>0': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
        '1>2': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
        '2>1': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
        '2>3': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
        '3>2': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
        '3>0': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
        '0>3': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
    };
    // T corners in its 3x3 box, and the two that face where the T points, per state.
    const CORNERS = [[0, 0], [2, 0], [0, 2], [2, 2]];
    const FRONT = [[[0, 0], [2, 0]], [[2, 0], [2, 2]], [[0, 2], [2, 2]], [[0, 0], [0, 2]]];

    const LOCK_DELAY = 500, MAX_RESETS = 15, CLEAR_DELAY = 200, SOFT_FACTOR = 20, LINES_PER_LEVEL = 10;
    const LINE_POINTS = [0, 100, 300, 500, 800];
    const SPIN_POINTS = {full: [400, 800, 1200, 1600], mini: [100, 200, 400, 400]};
    const PC_POINTS = [0, 800, 1200, 1800, 2000];

    // Seconds per row from the guideline formula; at level 20 and above a piece falls instantly.
    function gravity(level) {
        if (level >= 20) return 0;
        return Math.pow(0.8 - (level - 1) * 0.007, level - 1);
    }
    // mulberry32: one 32-bit state, so a game can be saved and resumed mid-bag.
    function rand(state) {
        let a = (state + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return [((t ^ (t >>> 14)) >>> 0) / 4294967296, a];
    }
    function hashSeed(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
        return h | 0;
    }

    // A cell is 0 when empty, else kind index + 1 (1..7), + 8 when it carries the inner square,
    // + 16 * the piece's serial, so the page can tell one piece from its neighbour.
    const cellKind = v => KINDS[(v & 7) - 1];
    const cellMark = v => (v & 8) !== 0;
    const cellPiece = v => v >>> 4;

    function create(opt = {}) {
        const g = {
            board: new Array(W * H).fill(0),
            seed: opt.seed == null ? (Math.random() * 2 ** 32) | 0 : opt.seed | 0,
            rng: 0, queue: [], cur: null, hold: null, holdUsed: false,
            score: 0, lines: 0, level: opt.level || 1, startLevel: opt.level || 1,
            combo: -1, b2b: false, pieces: 0, serial: 0,
            timeLimit: opt.timeLimit || 0, elapsed: 0,
            over: false, overReason: null,
            are: 0, irs: 0, ihs: false, soft: false,
            fall: 0, lockTimer: 0, resets: 0, lowest: 0, grounded: false, lastRot: null,
            stats: {quads: 0, tspins: 0, maxCombo: 0, allClears: 0, b2bMax: 0, b2bRun: 0},
            events: [],
        };
        g.rng = g.seed;
        refill(g);
        g.started = false;
        return g;
    }
    function refill(g) {
        while (g.queue.length < 7) {
            const bag = KINDS.split('');
            for (let i = bag.length - 1; i > 0; i--) {
                const [r, s] = rand(g.rng);
                g.rng = s;
                const j = Math.floor(r * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
            g.queue.push(...bag);
        }
    }
    const cellsOf = (p, r = p.r, x = p.x, y = p.y) => SHAPES[p.k][r].map(([cx, cy]) => [x + cx, y + cy]);
    function fits(g, k, r, x, y) {
        for (const [cx, cy] of SHAPES[k][r]) {
            const bx = x + cx, by = y + cy;
            if (bx < 0 || bx >= W || by < 0 || by >= H) return false;
            if (g.board[by * W + bx]) return false;
        }
        return true;
    }
    const occupied = (g, x, y) => x < 0 || x >= W || y < 0 || y >= H || g.board[y * W + x] !== 0;
    const canFall = g => g.cur && fits(g, g.cur.k, g.cur.r, g.cur.x, g.cur.y + 1);

    function start(g) {
        if (g.started) return;
        g.started = true;
        spawn(g);
    }
    function spawn(g, kind) {
        const k = kind || g.queue.shift();
        if (!kind) refill(g);
        g.cur = {k, r: 0, x: 3, y: 18};
        g.holdUsed = kind ? g.holdUsed : false;
        g.lastRot = null;
        g.fall = 0; g.lockTimer = 0; g.resets = 0; g.grounded = false;
        if (g.irs) { // rotation pressed before the piece appeared
            const r = (4 + g.irs) % 4;
            if (fits(g, k, r, 3, 18)) g.cur.r = r;
            g.irs = 0;
        }
        if (!fits(g, k, g.cur.r, 3, 18)) {
            g.events.push({t: 'spawn', k});
            return gameOver(g, 'block');
        }
        if (fits(g, k, g.cur.r, 3, 19)) g.cur.y = 19;
        g.lowest = g.cur.y;
        g.events.push({t: 'spawn', k});
        if (g.ihs && !kind) { g.ihs = false; hold(g); return; }
        if (gravity(g.level) === 0) sink(g);
    }
    function sink(g) { // 20G: straight to the floor
        while (canFall(g)) g.cur.y++;
        newLowest(g);
    }
    function newLowest(g) {
        if (g.cur.y > g.lowest) { g.lowest = g.cur.y; g.resets = 0; g.lockTimer = 0; }
        if (!canFall(g)) {
            if (!g.grounded) g.events.push({t: 'land'});
            g.grounded = true;
        } else g.grounded = false;
    }
    function moved(g) { // move reset: a successful shift or turn buys back the lock delay
        if (g.resets < MAX_RESETS) {
            if (!canFall(g) || g.lockTimer > 0) { g.lockTimer = 0; g.resets++; }
        }
        if (gravity(g.level) === 0) sink(g); else newLowest(g);
    }
    function playable(g) { return g.started && !g.over && g.cur && g.are <= 0; }

    function move(g, dx) {
        if (!playable(g)) return false;
        const c = g.cur;
        if (!fits(g, c.k, c.r, c.x + dx, c.y)) { g.events.push({t: 'bump', dx}); return false; }
        c.x += dx;
        g.lastRot = null;
        g.events.push({t: 'move', dx});
        moved(g);
        return true;
    }
    function rotate(g, dir) {
        if (g.started && !g.over && g.are > 0) { g.irs = dir; return false; }
        if (!playable(g)) return false;
        const c = g.cur;
        if (c.k === 'O') { g.events.push({t: 'rotate', dir, kick: 0, k: 'O'}); return true; }
        const to = (c.r + dir + 4) % 4;
        const table = c.k === 'I' ? KI : K3;
        const kicks = table[c.r + '>' + to];
        for (let i = 0; i < kicks.length; i++) {
            const nx = c.x + kicks[i][0], ny = c.y - kicks[i][1];
            if (fits(g, c.k, to, nx, ny)) {
                c.x = nx; c.y = ny; c.r = to;
                g.lastRot = {kick: i};
                const spin = c.k === 'T' ? tspin(g) : null;
                g.events.push({t: 'rotate', dir, kick: i, k: c.k, spin});
                moved(g);
                return true;
            }
        }
        g.events.push({t: 'rotate-fail', dir});
        return false;
    }
    // Three-corner rule; a mini unless both corners the T faces are filled, or the turn used
    // the last kick (the one that makes a T-spin triple possible).
    function tspin(g) {
        const c = g.cur;
        if (c.k !== 'T' || !g.lastRot) return null;
        let n = 0;
        for (const [cx, cy] of CORNERS) if (occupied(g, c.x + cx, c.y + cy)) n++;
        if (n < 3) return null;
        const front = FRONT[c.r].filter(([cx, cy]) => occupied(g, c.x + cx, c.y + cy)).length;
        return front === 2 || g.lastRot.kick === 4 ? 'full' : 'mini';
    }
    function setSoft(g, on) { g.soft = !!on; }
    function hardDrop(g) {
        if (!playable(g)) return false;
        const from = g.cur.y;
        while (canFall(g)) g.cur.y++;
        const dist = g.cur.y - from;
        if (dist) g.lastRot = null;
        g.score += 2 * dist;
        lock(g, {hard: true, dist, from});
        return true;
    }
    // Soft drop straight to the floor without locking - a point a row, as a held soft drop scores -
    // so the piece can still be tucked or turned into a slot. Returns the rows it fell.
    function sink(g) {
        if (!playable(g)) return -1;
        const from = g.cur.y;

    function tick(g, ms) {

            if (g.elapsed >= g.timeLimit) { g.elapsed = g.timeLimit; return gameOver(g, 'time'); }
        } else g.elapsed += ms;

    // Everything a game is, as plain data: a game cut off by a closed tab resumes exactly.
    const SAVED = ['board', 'seed', 'rng', 'queue', 'cur', 'hold', 'holdUsed', 'score', 'lines', 'level',
        'startLevel', 'combo', 'b2b', 'pieces', 'serial', 'timeLimit', 'elapsed', 'over', 'overReason', 'are',
        'fall', 'lockTimer', 'resets', 'lowest', 'grounded', 'lastRot', 'stats', 'started'];

    }
    function load(o) {
        if (!o || o.v !== 1 || !Array.isArray(o.board) || o.board.length !== W * H) return null;
        const g = create({seed: o.seed});
        for (const k of SAVED) if (k in o) g[k] = JSON.parse(JSON.stringify(o[k]));
        g.events = [];
        g.irs = 0; g.ihs = false; g.soft = false;
        return g;
    }

    // A copy to try moves on: everything a game is, nothing shared with the original.
    function clone(g) {
        return {...g, board: g.board.slice(), queue: g.queue.slice(), cur: g.cur && {...g.cur},
            lastRot: g.lastRot && {...g.lastRot}, stats: {...g.stats}, events: []};
    }

    return {W, H, TOP, KINDS, SHAPES, MARK, LOCK_DELAY, MAX_RESETS, CLEAR_DELAY, LINES_PER_LEVEL,
        gravity, rand, hashSeed, create, start, move, rotate, hardDrop, hold, setSoft, sink, tick, ghostY,
        fits, cellsOf, cellKind, cellMark, cellPiece, save, load, clone, tspin};
})();
