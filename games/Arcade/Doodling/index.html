<style>
:root{
  --leather:#1f3530;--leather2:#182a26;--paper:#f5efe2;--print:#e4553a;--cream:#efe6d4;--ink:#3a2f26;
  --walnut:#5b3f2c;--board:#8b7a62;--glue:#5e2a20;
  --pw:300px;--ph:450px;--cs:46px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.45,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--leather2);overscroll-behavior:none}
body{font-family:Fraunces,Georgia,'Times New Roman',serif;color:var(--cream);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid #f3d9a8;outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* the desk: walnut under a leather blotter */
#desk{position:fixed;inset:0;background:#2b1c13 center/900px 180px}
#blotter{position:fixed;inset:0;background:var(--leather) center/300px 300px}
#blotter::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,250,230,.045) 45%,transparent 60%),radial-gradient(75% 55% at 45% 35%,rgba(255,236,190,.12),transparent 70%),radial-gradient(140% 100% at 50% 45%,transparent 40%,rgba(0,0,0,.45))}
.corner{display:none;position:absolute;width:120px;height:120px;z-index:1;background:#5a3a2a;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.corner svg{position:absolute;inset:0}
.corner.tl{left:0;top:0;clip-path:polygon(0 0,100% 0,0 100%)}
.corner.tr{right:0;top:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.corner.bl{left:0;bottom:0;clip-path:polygon(0 0,0 100%,100% 100%)}
.corner.br{right:0;bottom:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
.side #blotter{inset:14px 72px;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.4)}
.side #blotter::before{content:"";position:absolute;inset:10px;border:1.4px dashed rgba(220,235,210,.15);border-radius:8px;pointer-events:none}
.side .corner{display:block}

#app{position:fixed;inset:0;display:grid;grid-template-columns:100%;grid-template-rows:auto 1fr auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0;height:62px}
#stage{position:relative;min-height:0;min-width:0;display:grid;place-items:center;padding:16px 16px 10px}

/* the pad */
#pad{position:relative;width:var(--pw);height:var(--ph);transition:opacity .25s}
.board{position:absolute;left:0;right:0;top:-12px;bottom:-15px;border-radius:3px;background:var(--board) 0 0/256px;
  box-shadow:6px 26px 40px rgba(0,0,0,.45),1px 3px 3px rgba(0,0,0,.45),0 1px 0 rgba(0,0,0,.6)}
.edges{position:absolute;left:0;right:0;top:4px;bottom:-12px;border-radius:0 0 2px 2px;background:repeating-linear-gradient(#efe8d7 0 1px,#d3c8b1 1px 1.7px)}
.sheet{position:absolute;inset:0;overflow:hidden;background:var(--paper);box-shadow:0 1px 1px rgba(0,0,0,.12);touch-action:none;cursor:crosshair}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cLive.multiply{mix-blend-mode:multiply}
.glue{position:absolute;left:-1px;right:-1px;top:-10px;height:14px;border-radius:2px 2px 1px 1px;pointer-events:none;
  background:linear-gradient(#3e1a14,#5e2a20 35%,#8a4c3c 52%,#5e2a20 68%,#43201a);box-shadow:0 1px 1.5px rgba(60,20,10,.45)}
#curl{position:absolute;right:0;bottom:0;width:var(--cs);height:var(--cs);touch-action:none;cursor:grab;z-index:2}
#curl svg{position:absolute;right:0;bottom:0;overflow:visible;pointer-events:none}
#curl::before{content:"";position:absolute;inset:-14px -6px -6px -14px}   /* a thumb is bigger than the corner */
#curl:active{cursor:grabbing}
.fly{position:fixed;z-index:30;pointer-events:none;transform-origin:50% 0;filter:drop-shadow(0 1px 1px rgba(60,40,20,.35)) drop-shadow(0 14px 18px rgba(0,0,0,.3));
}

/* the tray */
#tray{position:relative;display:grid;grid-template-columns:44px minmax(0,330px) auto;justify-content:center;align-items:end;gap:0 4px;padding:10px 8px 0;
  border-radius:16px 16px 0 0;background:var(--walnut) 0 0/600px 120px;box-shadow:0 -10px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,220,180,.3)}
#tray::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(24px + env(safe-area-inset-bottom));z-index:2;pointer-events:none;
  background:inherit;background-position:0 40px;border-radius:6px 6px 0 0;filter:brightness(1.12);
  box-shadow:inset 0 1px 0 rgba(255,220,180,.35),inset 0 -1px 0 rgba(0,0,0,.3),0 -8px 14px rgba(0,0,0,.42)}
.acts{display:flex;flex-direction:column;gap:6px;align-self:center;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.act{width:44px;height:44px;display:grid;place-items:center;color:#f3e6cf;transition:opacity .2s,transform .15s}
.act svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.act:disabled{opacity:.3;cursor:default}
.act:active:not(:disabled){transform:scale(.88)}
.pens{display:flex;justify-content:space-around;height:148px;overflow:hidden;overflow:clip;padding-bottom:env(safe-area-inset-bottom);min-width:0}
.pen{position:relative;flex:0 1 50px;min-width:34px;height:150px;transform:translateY(44px);transition:transform .32s var(--spring)}
.pen svg{width:46px;height:150px;display:block;margin:0 auto;filter:drop-shadow(3px 4px 3px rgba(20,10,5,.4));transition:filter .3s}
.pen.on{transform:translateY(2px)}
.pen.on svg{filter:drop-shadow(5px 10px 6px rgba(20,10,5,.45))}
.pen:active:not(.on){transform:translateY(36px)}
.inks{display:grid;grid-template-columns:repeat(4,34px);grid-template-rows:repeat(2,42px);padding:0 2px calc(30px + env(safe-area-inset-bottom));align-self:end}
.inkb{position:relative;width:34px;height:42px;display:grid;place-items:center}
.well.mix{background:conic-gradient(from 20deg,#e24b3b,#e8a93a,#e4d84a,#5ba35b,#3f86c9,#6a52b0,#c4528f,#e24b3b);box-shadow:inset 0 0 0 2px rgba(0,0,0,.2),inset 0 2px 3px rgba(0,0,0,.3),0 0 0 3px rgba(30,18,10,.45),0 1px 0 3px rgba(255,220,180,.16)}
.well.mix::before{content:"+";position:absolute;inset:0;display:grid;place-items:center;font:600 18px/1 system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.mixer input{position:absolute;left:50%;top:50%;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none}
.well{width:28px;height:28px;border-radius:50%;background:var(--c);position:relative;transition:transform .25s var(--spring);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 72%,#000),inset 0 2px 3px rgba(0,0,0,.35),0 0 0 3px rgba(30,18,10,.45),0 1px 0 3px rgba(255,220,180,.16)}
.well::after{content:"";position:absolute;inset:3px;border-radius:50%;border-top:1.5px solid rgba(255,255,255,.2);transform:rotate(-30deg)}
.inkb.on .well{transform:scale(1.1)}
.ring{position:absolute;left:-1px;top:2px;width:38px;height:38px;pointer-events:none;overflow:visible}
.ring path{fill:none;stroke:#f1e4cc;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;transition:stroke-dashoffset .35s var(--ease)}
.inkb.on .ring path{stroke-dashoffset:0}

/* the sketchbook on the desk */
#bookBtn{display:flex;align-items:center;gap:10px;padding:10px 4px 2px 10px;min-height:48px;text-align:right}
/* the sketchbook itself: a closed cloth book, the last torn sheet tucked in at the top */
.sb{position:relative;display:block;width:40px;height:52px;flex:none}
.cover{position:absolute;inset:0;z-index:1;border-radius:2px 5px 5px 2px;
  background:linear-gradient(90deg,#24191560 0 12%,transparent 15%),linear-gradient(#4a3029,#3b2620);
  box-shadow:inset 3px 0 0 rgba(0,0,0,.25),inset -1px 0 0 rgba(255,220,190,.08),0 4px 10px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4);transition:transform .35s var(--spring)}
.cover::after{content:"";position:absolute;top:-1px;bottom:-1px;right:16%;width:2.5px;background:#1a110e;box-shadow:1px 0 0 rgba(255,255,255,.07)}
#bookNum{position:absolute;left:24%;right:30%;top:24%;padding:1px 0 2px;background:#e9e0cc;color:#4b4236;font:italic 600 10px/1.1 Fraunces,serif;text-align:center;border-radius:1px;box-shadow:0 0 0 .5px rgba(0,0,0,.2)}
#bookNum:empty{opacity:.55;height:8px}
.peek{position:absolute;left:14%;top:-26%;width:66%;height:80%;background:var(--paper);overflow:hidden;transform:rotate(-4deg);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .45s var(--spring),opacity .3s}
.peek canvas{display:block;width:100%;height:auto}
.sb.empty .peek{opacity:0;transform:translateY(40%) rotate(-4deg)}
.bump .cover{animation:bump .45s var(--spring)}
@keyframes bump{40%{transform:scale(1.1) rotate(-2deg)}}
.lbl{font:italic 500 14px/1.2 Fraunces,serif;color:rgba(239,230,212,.78)}
.lbl b{display:none}
.side .lbl b{display:inline}
.side .lbl{display:inline-block}

/* wide screens: the tray lies beside a landscape pad */
.side #app{inset:14px 72px;grid-template-columns:1fr 236px var(--pw) 1fr;grid-template-rows:1fr;column-gap:40px;padding:0}
.side #top{display:none}
.side #stage{grid-column:3;grid-row:1;padding:0}
.side #col{grid-column:2;grid-row:1;align-self:center;height:calc(var(--ph) + 20px);display:flex;flex-direction:column;justify-content:space-between;transform-origin:50% 50%;transform:scale(var(--k,1))}
#col{display:contents}
.side #tray{display:flex;flex-direction:column;align-items:stretch;border-radius:14px;padding:12px 12px 8px;gap:0;
  box-shadow:0 14px 26px rgba(0,0,0,.45),0 3px 5px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,220,180,.25),inset 0 -2px 0 rgba(0,0,0,.25)}
.side #tray::after{display:none}
.side .pens{order:1;flex-direction:column;height:auto;overflow:visible;padding:8px 0;border-radius:10px;background:rgba(0,0,0,.2);box-shadow:inset 0 3px 7px rgba(0,0,0,.5),0 1px 0 rgba(255,220,180,.14);gap:4px}
.side .pen{flex:none;width:100%;height:54px;transform:translateX(0)}
.side .pen svg{position:absolute;left:69px;top:-48px;transform:rotate(90deg);filter:drop-shadow(-4px 3px 2px rgba(20,10,5,.4))}
.side .pen.on{transform:translate(16px,-3px) rotate(-2.5deg)}
.side .pen.on svg{filter:drop-shadow(-12px 9px 7px rgba(20,10,5,.42))}
.side .pen:active:not(.on){transform:translateX(5px)}
.side .inks{order:2;align-self:stretch;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,44px);justify-items:center;padding:12px 0 2px;margin-top:10px;border-top:1px solid rgba(0,0,0,.35);box-shadow:inset 0 1px 0 rgba(255,255,240,.07)}
.side .inkb{width:auto}
.side .acts{order:3;flex-direction:row;justify-content:center;gap:40px;padding:4px 0 0}
.side .act svg{width:30px;height:30px}
.side #top2{display:flex;justify-content:center}
#top2{display:none}
.side #bookBtn{flex-direction:column-reverse;align-items:center;gap:12px;text-align:center;padding:30px 0 0}
.side .sb{width:116px;height:150px}
.side #bookNum{font-size:15px;padding:3px 0 4px}
.side #bookNum:empty{height:20px}
.side .lbl{display:inline-block;padding:4px 10px 5px;background:#efe6d2;color:#4b4236;border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.4);transform:rotate(-2deg);font-size:14px}
.side .lbl b{display:inline;margin-left:6px;color:#857a68;font-size:11px}

/* the sketchbook: an open book, the torn sheets taped in */
.overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;color:#3a3128;background:#e6dcc7 0 0/512px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.overlay::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 30%,transparent 50%,rgba(90,60,30,.18))}
#book{animation:open .34s var(--ease)}
@keyframes open{from{opacity:0;transform:translateY(18px) scale(.985)}}
.ohead{position:relative;display:flex;align-items:center;gap:6px;padding:12px 12px 8px 18px;border-bottom:1px solid rgba(90,70,40,.18)}
.ohead h2{font:italic 600 26px Fraunces,serif;letter-spacing:.005em;margin-right:auto;color:#3a3128}
.ohead h2 small{font:400 14px Fraunces,serif;color:#8a7c66;margin-left:10px;font-style:normal}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:#3a3128;flex:none}
.ibtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{background:rgba(60,40,20,.08)}
#grid{position:relative;flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:34px 22px;padding:30px max(22px,calc(50% - 560px)) 48px;align-content:start;-webkit-overflow-scrolling:touch}
.side #grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:44px 34px}
.card{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:#3a3128}
.card .pg{position:relative;width:100%;background:var(--paper);transform:rotate(var(--r));transition:transform .3s var(--spring);
  box-shadow:0 1px 2px rgba(60,40,20,.25),0 8px 18px rgba(60,40,20,.18)}
.card .pg canvas{display:block;width:100%;height:100%}
.card .pg::after{content:"";position:absolute;top:-9px;left:50%;width:46px;height:17px;margin-left:-23px;transform:rotate(var(--t));
  background:rgba(232,220,182,.78);box-shadow:0 1px 1px rgba(60,40,20,.12);
  -webkit-mask:linear-gradient(90deg,transparent,#000 3px calc(100% - 3px),transparent);mask:linear-gradient(90deg,transparent,#000 3px calc(100% - 3px),transparent)}
.card:hover .pg,.card:focus-visible .pg{transform:rotate(0) translateY(-3px)}
.card span{font:italic 500 15px Fraunces,serif;white-space:nowrap}
.card span b{font:400 12px Fraunces,serif;color:#8a7c66;font-style:normal;margin-left:6px}
#bookEmpty{position:relative;margin:auto;max-width:300px;text-align:center;font:italic 400 19px/1.5 Fraunces,serif;color:#7a6c57;padding:40px 20px}
#view{z-index:21}
#view .vstage{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:14px 18px}
#cView{display:block;background:var(--paper)}
#vSheet{filter:drop-shadow(0 1px 2px rgba(60,40,20,.3)) drop-shadow(0 14px 20px rgba(60,40,20,.2))}
#vnav{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px;padding:16px 16px 20px}
.vb{display:flex;align-items:center;gap:7px;min-height:44px;padding:0 12px;border-radius:22px;font:400 15px Fraunces,serif;color:#3a3128}
#vRemove{color:#8a7c66;font-size:14px}
.vb:not(.main):hover{background:rgba(58,49,40,.06)}
.vb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vb.main{background:#3a3128;color:#f3ead8;font-weight:500;padding:0 16px;box-shadow:0 2px 6px rgba(40,25,10,.3)}
.vb:active{transform:scale(.96)}
#vReplay{position:absolute;right:calc(50% - var(--vw,0px) / 2 + 12px);bottom:calc(50% - var(--vh,0px) / 2 + 12px);width:46px;height:46px;border-radius:50%;background:rgba(58,49,40,.8);color:#f3ead8;opacity:0;transition:opacity .3s;pointer-events:none}
#vReplay.show{opacity:1;pointer-events:auto}
#vReplay svg{width:18px;height:18px;fill:currentColor;margin-left:3px}
.zoom{position:fixed;z-index:25;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(60,40,20,.3)) drop-shadow(0 14px 20px rgba(60,40,20,.2))}
#toast{position:fixed;left:50%;bottom:calc(178px + env(safe-area-inset-bottom));z-index:40;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:22px;background:#3a3128;color:#f3ead8;font:500 14px Fraunces,serif;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:opacity .25s,transform .3s var(--ease);max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{font:600 14px Fraunces,serif;color:#f0b49f;padding:4px 6px}
.side #toast{bottom:40px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
#top #mute{opacity:.7}
#mute svg{width:22px;height:22px}
/* nib sizes: a small card that rises from the button */
#sizes{position:fixed;z-index:35;display:flex;align-items:center;gap:2px;padding:6px 8px;border-radius:14px;background:#3a2a1e;
  box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,220,180,.2);animation:rise .22s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.szb{position:relative;width:46px;height:46px;display:grid;place-items:center;border-radius:10px}
.szb i{display:block;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(255,240,220,.18)}
.szb.on{background:rgba(255,235,200,.14);box-shadow:inset 0 0 0 1.5px rgba(241,228,204,.7)}
#sizeBtn circle{fill:currentColor;stroke:none}
#topL{display:flex;gap:2px}
#top #setBtn{opacity:.7}
#setBtn svg{width:22px;height:22px}
.side .acts{justify-content:space-between;gap:0}
.side .act{width:40px}
/* the pad's settings: a card of the same paper as the sketchbook */
#prefs{position:fixed;inset:0;z-index:22;display:grid;place-items:center;padding:16px;background:rgba(12,18,16,.55);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.pcard{position:relative;width:min(440px,100%);max-height:100%;overflow:auto;border-radius:10px;color:#3a3128;background:#efe6d2;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:open .3s var(--ease)}
.pcard .ohead{position:sticky;top:0;background:#efe6d2;z-index:1}
.pbody{padding:6px 18px 22px}
.pbody h3{font:600 13px Fraunces,serif;letter-spacing:.06em;text-transform:uppercase;color:#8a7c66;margin:18px 0 10px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;font:400 13px Fraunces,serif;color:#5a4e3e;min-width:56px}
.opt i{width:52px;height:66px;border-radius:3px;background-color:var(--c);box-shadow:0 1px 2px rgba(60,40,20,.3),0 0 0 1px rgba(60,40,20,.12);transition:transform .2s var(--spring)}
.opt.on i{box-shadow:0 0 0 2px #efe6d2,0 0 0 4px #3a3128}
.opt.on{color:#3a3128;font-weight:600}
.opt:active i{transform:scale(.94)}
.opts.txt .opt{min-width:0;flex-direction:row;padding:9px 14px;border-radius:20px;box-shadow:inset 0 0 0 1px rgba(60,40,20,.25);font-size:14px}
.opts.txt .opt.on{background:#3a3128;color:#f3ead8;box-shadow:none}
.r-lined{background-image:linear-gradient(90deg,transparent 7px,rgba(200,80,70,.4) 7px 8px,transparent 8px),repeating-linear-gradient(transparent 0 7px,rgba(70,110,150,.4) 7px 8px);background-position:0 0,0 14px}
.r-grid{background-image:repeating-linear-gradient(transparent 0 7px,rgba(70,110,150,.4) 7px 8px),repeating-linear-gradient(90deg,transparent 0 7px,rgba(70,110,150,.4) 7px 8px)}
.r-dots{background-image:radial-gradient(circle,rgba(60,80,100,.55) 1px,transparent 1.3px);background-size:8px 8px}
.pnote{font:italic 400 13px/1.4 Fraunces,serif;color:#8a7c66;margin-top:10px}
.tog{display:flex;align-items:center;gap:12px;min-height:40px;font:400 16px Fraunces,serif;cursor:pointer}
.tog input{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:12px;background:#cdbfa5;position:relative;transition:background .2s;cursor:pointer;flex:none}
