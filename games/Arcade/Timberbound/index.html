        #menu{background:radial-gradient(ellipse 70% 80% at 50% 50%,rgba(2,8,5,.46),rgba(2,8,5,.1) 72%,rgba(2,8,5,.34));backdrop-filter:none}body.title-shot #ui,body.title-shot #stats,body.photo #ui,body.photo #stats{opacity:0;pointer-events:none}#photo-hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;padding:8px 14px;border-radius:8px;background:rgba(3,10,7,.55);color:rgba(230,255,235,.82);font:700 12px/1.4 ui-monospace,monospace;letter-spacing:.08em;pointer-events:none;opacity:0;transition:opacity .4s}body.photo #photo-hint{opacity:1;animation:photo-hint 4s forwards}@keyframes photo-hint{0%,70%{opacity:1}100%{opacity:.18}}#ui{transition:opacity .7s}#menu-card,#help-card{width:min(760px,calc(var(--ui-vw) - 36px));max-height:calc(var(--ui-vh) - 28px);overflow:auto;border-radius:8px;padding:36px;text-align:center}

        #menu h1{font-size:clamp(42px,calc(var(--ui-vw) * .08),84px);line-height:.87;letter-spacing:-.07em;margin-top:18px;text-shadow:0 10px 55px rgba(119,227,142,.2)}
        #menu h1 em{display:block;color:var(--lime);font-style:normal}

        .btn{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055);padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:850;font-size:15px;letter-spacing:.05em;transition:transform .12s,border-color .12s,background .12s}

        #shop{z-index:45;align-items:center}

        /* Mosswick had a voice for three playthroughs and nobody heard it: as a muted 15px
           paragraph under a 25px title it read as a description of the shop rather than as a
           person behind the counter. Give it a speaker's margin, a little more size, and a fade
           when the line changes, so the eye is told something was said. */
        #shop-voice{color:var(--ink);font-size:16px;font-style:italic;padding-left:13px;
            border-left:2px solid rgba(255,255,255,.18)}

ill:rgba(210,240,215,.55);font:800 10.5px ui-monospace,monospace;text-anchor:middle;letter-spacing:.06em;pointer-events:none;paint-order:stroke;stroke:rgba(2,6,8,.9);stroke-width:3px}.sn-glow{fill:var(--c);opacity:0}.sn.afford .sn-glow{animation:sn-pulse 2.2s ease-in-out infinite}@keyframes sn-pulse{0%,100%{opacity:.1}50%{opacity:.32}}.sn.owned .sn-core{fill:color-mix(in srgb,var(--c) 32%,#07130e);stroke:color-mix(in srgb,var(--c) 70%,transparent)}.sn.open .sn-core{stroke:var(--c);stroke-dasharray:4 4}.sn.open .sn-rank{fill:var(--c)}.sn.locked{opacity:.3}.sn.locked .sn-icon{filter:grayscale(1)}.sn.maxed .sn-ring{stroke:#ffe28a}.sn.maxed .sn-core{stroke:#ffe28a}.sn.sel .sn-core{stroke:#fff;stroke-width:3;stroke-dasharray:none}.sn.filtered{opacity:.07;pointer-events:none}.sn-next{fill:#07130e;stroke:var(--c);stroke-width:1.5}.sn-nexttext{fill:var(--c);font:900 9.5px ui-monospace,monospace;text-anchor:middle;letter-spacing:.08em}.se{stroke-linecap:round;fill:none}.se.dim{stroke:rgba(200,230,210,.09);stroke-width:2}.se.open{stroke:var(--c);stroke-opacity:.5;stroke-width:2.5;stroke-dasharray:6 7;animation:se-flow 1.6s linear infinite}.se.lit{stroke:var(--c);stroke-width:3.5;stroke-opacity:.9;filter:url(#sk-glow)}.se.filtered{opacity:.06}@keyframes se-flow{to{stroke-dashoffset:-26}}.sk-sector{font:900 15px ui-monospace,monospace;letter-spacing:.3em;text-anchor:middle;opacity:.55}.sk-hubtext{fill:#e9ffe9;font:900 11px ui-monospace,monospace;text-anchor:middle;letter-spacing:.14em}

        #runner-hint .key{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;background:rgba(201,255,112,.16);border:1px solid rgba(201,255,112,.45);color:var(--lime);font:1000 12px/1 ui-monospace,monospace}
        #runner-hint b{display:block;font:900 13px/1 ui-monospace,monospace;letter-spacing:.08em;color:var(--lime)}
        #runner-hint small{display:block;margin-top:3px;font:700 12px/1 ui-monospace,monospace;color:var(--muted)}
        body.touch-mode #runner-hint{display:none!important}
