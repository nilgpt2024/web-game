</head><body><header><span class="logo">tempo®</span><span>AN EXERCISE IN BEING HERE</span></header><main><div class="top"><h1>Every second.<br>A new beginning.</h1><p>Time doesn't stand still.<br>Neither do you.<br>A small reminder to inhabit the now.</p></div><div class="clock" role="timer" aria-label="Current time"><div class="dial"><div class="hand" id="hh"></div><span class="value" id="h">00</span><span class="unit">HOURS</span></div><div class="dial"><div class="hand" id="mh"></div><span class="value" id="m">00</span><span class="unit">MINUTES</span></div><div class="dial"><div class="hand" id="sh"></div><span class="value" id="s">00</span><span class="unit">SECONDS</span></div></div><div class="meta"><span id="date"></span><span id="zone">YOUR LOCAL TIME</span></div><div class="controls"><div class="mode"><button class="active" id="local">Local</button><button id="utc">UTC</button><button id="format">24-hour</button></div><span class="quote">“The present is a present.”</span></div></main><script>let universal=false,twelve=false;function tick(){let d=new Date(),h=universal?d.getUTCHours():d.getHours(),m=universal?d.getUTCMinutes():d.getMinutes(),s=universal?d.getUTCSeconds():d.getSeconds();document.querySelector('#h').textContent=String(twelve?(h%12||12):h).padStart(2,'0');document.querySelector('#m').textContent=String(m).padStart(2,'0');document.querySelector('#s').textContent=String(s).padStart(2,'0');[['hh',h%12*30+m/2],['mh',m*6],['sh',s*6]].forEach(([id,v])=>document.getElementById(id).style.setProperty('--angle',v+'deg'));document.querySelector('#date').textContent=d.toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric',...(universal?{timeZone:'UTC'}:{})}).toUpperCase();document.querySelector('#zone').textContent=(universal?'COORDINATED UNIVERSAL TIME':'YOUR LOCAL TIME')+(twelve?(h<12?' / AM':' / PM'):'')}for(const id of ['local','utc'])document.getElementById(id).onclick=()=>{universal=id==='utc';document.querySelector('#local').classList.toggle('active',!universal);document.querySelector('#utc').classList.toggle('active',universal);tick()};document.querySelector('#format').onclick=e=>{twelve=!twelve;e.target.textContent=twelve?'12-hour':'24-hour';tick()};tick();setInterval(tick,1000);</script></body></html>
