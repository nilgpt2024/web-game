</head><body><div class="orb"></div><header><span class="logo">word garden</span><span>LANGUAGE, LEFT TO BLOOM</span></header><section class="intro"><span style="font:9px Arial;letter-spacing:3px;color:#a08196">A TINY POETRY PLAYGROUND</span><h1>Let a little<br><em>meaning</em> grow.</h1><p>Pick a word. Follow a feeling. There is no wrong poem.</p></section><main class="desk"><div class="poem" id="poem" aria-label="Your poem"><span class="placeholder">Begin anywhere…</span></div><div class="bank" id="bank" aria-label="Available words"><button class="tile" style="--r:-3deg">the</button><button class="tile" style="--r:2deg">moon</button><button class="tile">holds</button><button class="tile" style="--r:-2deg">a</button><button class="tile" style="--r:3deg">quiet</button><button class="tile">ocean</button><button class="tile" style="--r:-1deg">inside</button><button class="tile">every</button><button class="tile" style="--r:2deg">small</button><button class="tile">dream</button><button class="tile" style="--r:-3deg">we</button><button class="tile">bloom</button><button class="tile" style="--r:2deg">slowly</button><button class="tile">beneath</button><button class="tile">blue</button><button class="tile" style="--r:-2deg">silence</button><button class="tile">and</button><button class="tile">light</button></div><div class="actions"><button class="action" id="clear">Begin again ↺</button><span class="hint" id="hint" aria-live="polite">CLICK A PLACED WORD TO RETURN IT</span><button class="action" id="save">Keep this poem ↓</button></div></main><script>const poem=document.querySelector('#poem'),bank=document.querySelector('#bank');function placeholder(){if(!poem.querySelector('button'))poem.innerHTML='<span class="placeholder">Begin anywhere…</span>'}document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(b.parentElement===bank){poem.querySelector('.placeholder')?.remove();poem.append(b)}else{bank.append(b);placeholder()}});document.querySelector('#clear').onclick=()=>{poem.querySelectorAll('button').forEach(b=>bank.append(b));placeholder();document.querySelector('#hint').textContent='A FRESH PATCH OF POSSIBILITY'};document.querySelector('#save').onclick=()=>{const words=[...poem.querySelectorAll('button')].map(x=>x.textContent).join(' ');if(!words){document.querySelector('#hint').textContent='PLANT A FEW WORDS FIRST';return}const url=URL.createObjectURL(new Blob([words+'\n\n— made in word garden'],{type:'text/plain'})),a=document.createElement('a');a.href=url;a.download='my-small-poem.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#hint').textContent='YOUR POEM IS READY TO KEEP'};</script></body></html>
