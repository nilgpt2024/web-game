</head><body><header><span class="logo">[ PIXEL ORCHARD ]</span><span>EST. 8-BIT</span></header><main class="layout"><section class="copy"><span class="badge">A TINY MEMORY GAME</span><h1>A GOOD<br>DAY TO<br><span>HARVEST.</span></h1><p>Turn over the seed packets.<br>Find their partners.<br>Grow a little attention.</p><div class="stats"><div class="stat"><b id="moves">00</b>MOVES</div><div class="stat"><b id="pairs">0 / 6</b>PAIRS</div></div><button class="reset" id="reset">PLANT AGAIN ↺</button></section><section class="board" id="board" aria-label="Memory matching game"></section><div class="message" id="message" aria-live="polite">SIX PAIRS ARE HIDING IN THE GARDEN.</div></main><footer><span>NO HIGH SCORES. JUST SMALL JOYS.</span><span>USE MOUSE, TOUCH, OR KEYBOARD.</span></footer><script>let first=null,locked=false,moves=0,pairs=0,round=0;const symbols=['✿','◆','♣','☀','♥','✦'];function start(){round++;first=null;locked=false;moves=0;pairs=0;document.querySelector('#moves').textContent='00';document.querySelector('#pairs').textContent='0 / 6';document.querySelector('#message').textContent='SIX PAIRS ARE HIDING IN THE GARDEN.';const deck=[...symbols,...symbols];for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}const board=document.querySelector('#board');board.replaceChildren();deck.forEach((symbol,i)=>{let b=document.createElement('button');b.className='tile';b.textContent='?';b.setAttribute('aria-label','Hidden seed packet '+(i+1));b.onclick=()=>{if(locked||b===first||b.classList.contains('matched'))return;b.textContent=symbol;b.classList.add('revealed');b.setAttribute('aria-label',symbol+' revealed');if(!first){first=b;return}moves++;document.querySelector('#moves').textContent=String(moves).padStart(2,'0');if(first.textContent===symbol){first.classList.add('matched');b.classList.add('matched');pairs++;document.querySelector('#pairs').textContent=pairs+' / 6';first=null;if(pairs===6)document.querySelector('#message').textContent='A BEAUTIFUL HARVEST. SIX PAIRS IN '+moves+' MOVES.'}else{locked=true;let a=first,r=round;setTimeout(()=>{if(r!==round)return;[a,b].forEach(x=>{x.textContent='?';x.classList.remove('revealed');x.setAttribute('aria-label','Hidden seed packet')});first=null;locked=false},800)}};board.append(b)})}document.querySelector('#reset').onclick=start;start();</script></body></html>
