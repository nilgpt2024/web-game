</head><body><header><span class="logo">window seat</span><span>THE PLEASURE OF STAYING IN</span></header><main class="layout"><section><div class="over">AN AFTERNOON, UNHURRIED</div><h1>Let the world<br>rush <em>by.</em></h1><p>The city softens behind the glass.<br>There is nowhere you need to be.<br>Let the rain do the talking.</p><div class="controls"><label for="rain">RAINFALL <span id="level">STEADY</span></label><input type="range" id="rain" min="10" max="100" value="50"><button id="pause">Pause the moment Ⅱ</button></div><div class="caption">A SILENT, PROCEDURAL RAIN STUDY</div></section><div class="window" role="img" aria-label="Rain falling over an arched window and blurred city skyline"><div class="city"><i style="--h:50%"></i><i style="--h:78%"></i><i style="--h:55%"></i><i style="--h:92%"></i><i style="--h:65%"></i><i style="--h:45%"></i></div><canvas id="rainfall"></canvas><div class="bar"></div><div class="bar cross"></div><div class="ledge"></div></div></main><footer><span>WEATHER FOR YOUR INNER WORLD.</span><span>NO FORECAST. JUST FEELING.</span></footer><script>const c=document.querySelector('canvas'),ctx=c.getContext('2d');let w,h,drops=[],amount=50,paused=matchMedia('(prefers-reduced-motion:reduce)').matches,last=0;function size(){let r=c.getBoundingClientRect();w=r.width;h=r.height;c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);drops=Array.from({length:130},()=>({x:Math.random()*w,y:Math.random()*h,s:1+Math.random()*3,l:10+Math.random()*35}));draw(0)}function draw(dt){ctx.clearRect(0,0,w,h);drops.slice(0,amount+20).forEach(d=>{if(!paused){d.y+=d.s*dt*.14;d.x-=dt*.008;if(d.y>h){d.y=-40;d.x=Math.random()*w}}ctx.strokeStyle='#d4e9ef55';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+2,d.y-d.l);ctx.stroke()})}function frame(t){let dt=Math.min(t-last,40);last=t;if(!paused)draw(dt);requestAnimationFrame(frame)}window.addEventListener('resize',size);document.querySelector('#rain').oninput=e=>{amount=+e.target.value;document.querySelector('#level').textContent=amount<35?'DRIZZLE':amount<70?'STEADY':'DOWNPOUR';draw(0)};const btn=document.querySelector('#pause');function label(){btn.textContent=paused?'Let it rain ▶':'Pause the moment Ⅱ'}btn.onclick=()=>{paused=!paused;label()};size();label();requestAnimationFrame(frame);</script></body></html>
