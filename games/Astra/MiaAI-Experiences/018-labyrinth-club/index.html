</head><body><header><span class="logo">LABYRINTH CLUB</span><span>GET A LITTLE LOST.</span></header><main class="layout"><section class="copy"><span class="small">A SMALL DETOUR FOR YOUR MIND</span><h1>There is<br><em>a way</em><br>through.</h1><p>Guide the coral dot to the golden star. A few wrong turns are part of the pleasure.</p><div class="status" id="status" aria-live="polite">00 STEPS / FOLLOW YOUR CURIOSITY</div><div class="controls" aria-label="Movement controls"><button data-d="0,-1" aria-label="Move up">↑</button><button data-d="-1,0" aria-label="Move left">←</button><button data-d="0,1" aria-label="Move down">↓</button><button data-d="1,0" aria-label="Move right">→</button></div><button class="reset" id="reset">START OVER ↺</button></section><div class="maze" id="maze" role="img" aria-label="Maze with player at the top-left and goal at the bottom-right"></div></main><footer class="foot"><span>ARROW KEYS OR ON-SCREEN CONTROLS</span><span>ONE PATH. MANY POSSIBILITIES.</span></footer><script>const map=['###########','#...#.....#','###.#.###.#','#...#...#.#','#.#####.#.#','#.....#.#.#','#.###.#.#.#','#.#...#...#','#.#.#####.#','#.........#','###########'];let x=1,y=1,steps=0,won=false;const maze=document.querySelector('#maze');map.forEach(row=>[...row].forEach(c=>{let d=document.createElement('div');d.className='cell'+(c==='#'?' wall':'');maze.append(d)}));function render(){[...maze.children].forEach((c,i)=>{c.classList.toggle('player',i===y*11+x);c.classList.toggle('goal',i===9*11+9)});maze.setAttribute('aria-label','Maze. Player column '+x+', row '+y+'. Goal column 9, row 9.');document.querySelector('#status').textContent=won?'FOUND IT. '+steps+' STEPS WELL WANDERED.':String(steps).padStart(2,'0')+' STEPS / FOLLOW YOUR CURIOSITY'}function move(dx,dy){if(won||map[y+dy]?.[x+dx]!==' .'.trim())return;x+=dx;y+=dy;steps++;won=x===9&&y===9;render()}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(...b.dataset.d.split(',').map(Number)));document.addEventListener('keydown',e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});document.querySelector('#reset').onclick=()=>{x=y=1;steps=0;won=false;render()};render();</script></body></html>
