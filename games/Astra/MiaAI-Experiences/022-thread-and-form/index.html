</head><body><header><span class="logo">thread &amp; form</span><span>OLD CRAFT / NEW CANVAS</span></header><main class="layout"><section><div class="loom"><canvas id="cloth" width="600" height="600" role="img" aria-label="Interactive woven textile pattern"></canvas></div><div class="caption" id="caption">PLAIN WEAVE / TERRACOTTA / 24 THREADS</div></section><section class="copy"><span class="eyebrow">A SMALL DIGITAL LOOM</span><h1>One thread.<br>Then<br><em>another.</em></h1><p>Over and under. A simple rhythm becomes a surface, a pattern, a language passed from hand to hand.</p><div class="options" aria-label="Choose thread palette"><button class="swatch active" style="--color:#af6044" data-i="0" aria-label="Terracotta palette"></button><button class="swatch" style="--color:#405f70" data-i="1" aria-label="Indigo palette"></button><button class="swatch" style="--color:#627251" data-i="2" aria-label="Moss palette"></button></div><div class="control"><label for="density">THREAD DENSITY <span id="count">24</span></label><input id="density" type="range" min="12" max="48" value="24" step="2"><button class="pattern" id="pattern">Try a twill weave ↗</button></div></section></main><footer><span>AN INTERACTIVE TEXTILE STUDY</span><span>EVERY CROSSING MATTERS.</span></footer><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),palettes=[['#af6044','#e2bc89','TERRACOTTA'],['#405f70','#c5d0ca','INDIGO'],['#627251','#d3c998','MOSS']];let p=0,n=24,twill=false;function draw(){let s=600/n;g.fillStyle='#6d604a';g.fillRect(0,0,600,600);for(let y=0;y<n;y++)for(let x=0;x<n;x++){let over=twill?(x+y)%4<2:(x+y)%2===0;g.fillStyle=palettes[p][over?0:1];g.fillRect(x*s+1,y*s+1,s-2,s-2);g.strokeStyle=over?'#ffffff28':'#00000014';g.lineWidth=1;for(let k=3;k<s-2;k+=4){g.beginPath();if(over){g.moveTo(x*s+k,y*s+2);g.lineTo(x*s+k,(y+1)*s-2)}else{g.moveTo(x*s+2,y*s+k);g.lineTo((x+1)*s-2,y*s+k)}g.stroke()}g.fillStyle='#0002';if(over)g.fillRect(x*s+1,(y+1)*s-3,s-2,2);else g.fillRect((x+1)*s-3,y*s+1,2,s-2)}document.querySelector('#caption').textContent=(twill?'TWILL':'PLAIN')+' WEAVE / '+palettes[p][2]+' / '+n+' THREADS'}document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{p=+b.dataset.i;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===b));draw()});document.querySelector('#density').oninput=e=>{n=+e.target.value;document.querySelector('#count').textContent=n;draw()};document.querySelector('#pattern').onclick=e=>{twill=!twill;e.target.textContent=twill?'Return to plain weave ↗':'Try a twill weave ↗';draw()};draw();</script></body></html>
