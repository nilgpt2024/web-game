</head><body><main><nav><span>FIELD NOTES / 026</span><span>COASTAL OBSERVATORY</span></nav><header><h1>Tidal<br><i>hours.</i></h1><p>A quiet study of the water’s breathing.<br>Follow one day along the edge of the sea.</p></header><div class="sea"><svg viewBox="0 0 1000 260" preserveAspectRatio="none" aria-label="Illustrative tidal height curve"><defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#62bcb1" stop-opacity=".35"/><stop offset="1" stop-color="#62bcb1" stop-opacity="0"/></linearGradient></defs><path class="under" d="M0 145 Q125 -20 250 145 T500 145 T750 145 T1000 145 L1000 260 H0Z"/><path class="line" d="M0 145 Q125 -20 250 145 T500 145 T750 145 T1000 145"/></svg><div class="marker" id="marker"></div><div class="readout"><span id="time">12:00</span><strong id="height">2.4 m</strong><span id="phase">RISING WATER</span></div></div><div class="controls"><label for="hour">EXPLORE THE DAY</label><input id="hour" type="range" min="0" max="24" step=".1" value="12"><button id="reset">NOW ↗</button></div><footer><span>48° 23′ N · 04° 29′ W<br>THE NORTH ATLANTIC</span><span>ILLUSTRATIVE TIDE STUDY<br>NOT FOR NAVIGATION</span><span>00:00 — 24:00</span></footer></main><script>const hour=document.getElementById('hour');function update(){let v=+hour.value;document.getElementById('marker').style.left=v/24*100+'%';document.getElementById('time').textContent=String(Math.floor(v)).padStart(2,'0')+':'+String(Math.floor(v%1*60)).padStart(2,'0');document.getElementById('height').textContent=(2.4+1.4*Math.sin(v/6*Math.PI)).toFixed(1)+' m';document.getElementById('phase').textContent=Math.cos(v/6*Math.PI)>0?'RISING WATER':'FALLING WATER'}hour.oninput=update;document.getElementById('reset').onclick=()=>{hour.value=12;update()};update();</script></body></html>
