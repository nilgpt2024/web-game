</head><body><main><nav><span>MICRO / MACRO</span><span>BOTANICAL ATLAS — 029</span></nav><h1>Small is<span>spectacular.</span></h1><div class="stage"><div class="intro"><p style="font:11px monospace;letter-spacing:2px">SPECIMEN 03 / HELIANTHUS</p><p>A universe of texture, hidden in a single grain. Explore the sculptural surface of an imagined sunflower pollen particle.</p><p id="note">Golden hour, at microscopic scale.</p></div><div class="micro"><svg id="pollen" viewBox="0 0 400 400" role="img" aria-label="Sculptural pollen grain"><defs><radialGradient id="g"><stop stop-color="#ffeab1"/><stop offset=".7" stop-color="#e99132"/><stop offset="1" stop-color="#9e4d23"/></radialGradient><pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="5" fill="#9c4b27"/><circle cx="10" cy="10" r="3" fill="#ffc564"/></pattern></defs><g id="spikes" fill="#e69740" stroke="#b7692d"></g><circle cx="200" cy="200" r="125" fill="url(#g)"/><circle cx="200" cy="200" r="112" fill="url(#dots)" opacity=".75"/><ellipse cx="162" cy="143" rx="49" ry="33" fill="#ffe5a6" opacity=".2"/></svg><span class="scale">├──────┤ 20 μm / ART STUDY</span></div></div><div class="control"><label for="zoom">MAGNIFICATION</label><input id="zoom" type="range" min="70" max="115" value="85"><span id="mag">850×</span><button id="rotate">ROTATE SPECIMEN ↻</button></div></main><script>const ns='http://www.w3.org/2000/svg';for(let i=0;i<24;i++){let p=document.createElementNS(ns,'path');p.setAttribute('d','M190 81 200 46 210 81Z');p.setAttribute('transform','rotate('+i*15+' 200 200)');document.getElementById('spikes').appendChild(p)}let r=0;document.getElementById('rotate').onclick=()=>{r+=45;document.getElementById('pollen').style.transform='rotate('+r+'deg)';document.getElementById('note').textContent='Specimen rotated to '+r%360+'° · Each ridge catches a different light.'};document.getElementById('zoom').oninput=e=>{document.getElementById('pollen').style.width=e.target.value+'%';document.getElementById('mag').textContent=e.target.value*10+'×'};</script></body></html>
