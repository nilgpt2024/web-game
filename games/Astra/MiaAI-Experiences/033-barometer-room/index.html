cument.getElementById('reading').textContent=v;document.getElementById('needle').style.transform='rotate('+((v-1010)*2.5)+'deg)';document.getElementById('forecast').textContent=v<995?'The pressure falls. Imagine restless skies, shifting winds, and rain at the window.':v>1025?'A higher pressure settles in. Imagine clear horizons and a slower movement of clouds.':'A quiet interval. The atmosphere rests between one weather story and the next.'}document.getElementById('p').oninput=update;update();</script></body></html>
