</head><body><main><canvas id="c" aria-label="Interactive sand drawing canvas"></canvas><nav><span>EPHEMERAL LANDSCAPES</span><span>STUDY 039</span></nav><div class="copy"><h1>Sand has<br><i>memory.</i></h1><p>Draw a line across the dunes.<br>Leave a small, temporary trace<br>in a landscape of wind.</p></div><span class="hint">TOUCH THE LANDSCAPE</span><div class="tools"><button id="clear">LET THE WIND ERASE ↗</button><label for="size">TRACE WIDTH</label><input id="size" type="range" min="2" max="16" value="6"></div></main><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let down=false;function landscape(){let w=innerWidth,h=innerHeight,d=devicePixelRatio;c.width=w*d;c.height=h*d;ctx.scale(d,d);ctx.fillStyle='#dba979';ctx.fillRect(0,0,w,h);for(let j=-20;j<70;j++){ctx.beginPath();for(let x=0;x<=w;x+=6){let y=j*19+Math.sin(x/w*4+j*.13)*65+Math.sin(x/w*8+j*.03)*25; x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=j%3===0?'#f3cca344':'#9a694422';ctx.lineWidth=j%3===0?3:1;ctx.stroke()}}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(e.clientX,e.clientY)};c.onpointermove=e=>{if(!down)return;ctx.lineWidth=+document.getElementById('size').value;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#97653d99';ctx.shadowColor='#f8d5ac';ctx.shadowBlur=2;ctx.shadowOffsetY=2;ctx.lineTo(e.clientX,e.clientY);ctx.stroke();ctx.beginPath();ctx.moveTo(e.clientX,e.clientY)};c.onpointerup=c.onpointercancel=()=>down=false;document.getElementById('clear').onclick=()=>{ctx.shadowBlur=0;ctx.shadowOffsetY=0;landscape()};addEventListener('resize',landscape);landscape();</script></body></html>
