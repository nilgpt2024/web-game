</head><body><main><section class="left"><div class="brand">COURTYARD STUDIES / 043</div><h1>The sun<br>keeps<br><i>time.</i></h1><p>No hands. No hurry.<br>Just a shadow moving over stone, writing the afternoon in silence.</p><div class="time" id="time">12:00</div><label for="hour">MOVE THROUGH THE DAY</label><input type="range" id="hour" min="6" max="18" step=".1" value="12"><p style="font:10px/1.8 monospace">A STYLIZED SUNDIAL STUDY<br>ILLUSTRATIVE SHADOW GEOMETRY</p></section><div class="court"><div class="circle"><svg viewBox="0 0 400 400" role="img" aria-label="Sundial with movable shadow"><g id="marks" fill="#9c7446" font-family="Georgia" font-size="17" text-anchor="middle"></g><g class="shadow" id="shadow"><path d="M200 200 186 67 220 74Z" fill="#785439" opacity=".27"/></g><path d="M200 200 202 121 223 214Z" fill="#b38a55"/><path d="M200 200 202 121 190 198Z" fill="#efd8af"/><circle cx="200" cy="200" r="4" fill="#a57c48"/><text x="200" y="304" text-anchor="middle" font-size="9" letter-spacing="4" fill="#9c7446">SOL OMNIBUS LUCET</text></svg></div><div class="caption">LIGHT FALLS EQUALLY ON EVERYTHING</div></div></main><script>const ns='http://www.w3.org/2000/svg';for(let i=0;i<12;i++){let t=document.createElementNS(ns,'text'),a=(i*30-90)*Math.PI/180;t.setAttribute('x',200+Math.cos(a)*153);t.setAttribute('y',205+Math.sin(a)*153);t.textContent=['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'][i];document.getElementById('marks').appendChild(t)}document.getElementById('hour').oninput=e=>{let h=+e.target.value;document.getElementById('time').textContent=String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round(h%1*60)).padStart(2,'0');document.getElementById('shadow').style.transform='rotate('+((h-12)*15)+'deg) scaleY('+(1+Math.abs(h-12)*.07)+')'};</script></body></html>
