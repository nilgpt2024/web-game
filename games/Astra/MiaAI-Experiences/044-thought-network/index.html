</head><body><main><canvas id="c" aria-label="Interactive imagined neural network"></canvas><nav><span>THE ANATOMY OF AN IDEA</span><span>NETWORK STUDY / 044</span></nav><div class="copy"><h1>A thought<br>takes<br><i>shape.</i></h1><p>A spark becomes a connection.<br>A connection becomes a possibility.<br>Touch the field to send a signal.</p></div><div class="panel"><button id="fire">IGNITE A THOUGHT ↗</button><span>AN ABSTRACT NETWORK · NOT A BRAIN MODEL</span><b id="count">00 SIGNALS SENT</b></div></main><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let nodes=[],pulses=[],count=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function size(){let w=c.clientWidth,h=c.clientHeight;c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;nodes=Array.from({length:65},(_,i)=>({x:w*(.34+((Math.sin(i*17.13)*.5+.5)*.63)),y:h*(.12+((Math.sin(i*19.73+2)*.5+.5)*.7))}))}function pulse(x,y){pulses.push({x,y,r:0});count++;document.getElementById('count').textContent=String(count).padStart(2,'0')+' SIGNALS SENT'}function draw(){ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,c.clientWidth,c.clientHeight);for(let i=0;i<nodes.length;i++){let a=nodes[i];for(let j=i+1;j<nodes.length;j++){let b=nodes[j],dist=Math.hypot(a.x-b.x,a.y-b.y);if(dist<140){ctx.strokeStyle='rgba(116,142,204,'+(.22*(1-dist/140))+')';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}let lit=pulses.some(p=>Math.abs(Math.hypot(a.x-p.x,a.y-p.y)-p.r)<40);ctx.fillStyle=lit?'#e2ecff':'#6d8bd5';ctx.shadowColor='#9ebaff';ctx.shadowBlur=lit?20:3;ctx.beginPath();ctx.arc(a.x,a.y,lit?4:2,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;pulses.forEach(p=>{p.r+=reduced?8:3;ctx.strokeStyle='rgba(155,183,248,'+Math.max(0,.22-p.r/3000)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke()});pulses=pulses.filter(p=>p.r<1200);requestAnimationFrame(draw)}c.onpointerdown=e=>pulse(e.clientX,e.clientY);document.getElementById('fire').onclick=()=>pulse(c.clientWidth*.7,c.clientHeight*.45);addEventListener('resize',size);size();draw();</script></body></html>
