</head><body><main><section class="intro"><span class="eyebrow">WIND CHAPEL / 046</span><h1>A place<br>for the<br><i>passing air.</i></h1><p>Five small bells. An invisible visitor.<br>Touch a chime to hear a soft note, and let the spaces between them linger.</p><div class="controls"><label for="wind">WIND</label><input id="wind" type="range" min="0" max="10" value="3"></div><div class="status" id="status">TOUCH A BELL TO BEGIN</div></section><div class="bells" aria-label="Playable wind chimes"><button class="chime" aria-label="Play C chime"><span class="tube"></span><span>C</span></button><button class="chime" aria-label="Play D chime"><span class="tube"></span><span>D</span></button><button class="chime" aria-label="Play E chime"><span class="tube"></span><span>E</span></button><button class="chime" aria-label="Play G chime"><span class="tube"></span><span>G</span></button><button class="chime" aria-label="Play A chime"><span class="tube"></span><span>A</span></button><span class="caption">A SMALL PENTATONIC SANCTUARY</span></div></main><script>let audio;document.querySelectorAll('.chime').forEach((b,i)=>b.onclick=()=>{try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=[523.25,587.33,659.25,783.99,880][i];gain.gain.setValueAtTime(.001,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.18,audio.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+2.4);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+2.5);document.getElementById('status').textContent=['C','D','E','G','A'][i]+' / A NOTE IN THE AIR';b.animate([{filter:'brightness(1.25)'},{filter:'brightness(1)'}],700)}catch(e){document.getElementById('status').textContent='AUDIO UNAVAILABLE IN THIS BROWSER'}});document.getElementById('wind').oninput=e=>document.querySelectorAll('.chime').forEach(b=>{b.style.animationDuration
