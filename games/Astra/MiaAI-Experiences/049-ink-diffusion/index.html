</head><body><main><canvas id="c" aria-label="Interactive blooming ink artwork"></canvas><nav><span>CHANCE &amp; PIGMENT</span><span>DIFFUSION STUDY / 049</span></nav><div class="copy"><h1>Where<br><i>ink</i> goes.</h1><p>A drop. A bloom. An accident.<br>Touch the paper and let the pigment<br>find its own way outward.</p></div><div class="toolbar"><button class="swatch" style="background:#283b60" aria-label="Indigo ink" aria-pressed="true" data-color="40,59,96"></button><button class="swatch" style="background:#865262" aria-label="Rose ink" aria-pressed="false" data-color="134,82,98"></button><button class="swatch" style="background:#53736b" aria-label="Jade ink" aria-pressed="false" data-color="83,115,107"></button><span class="instruction">CLICK OR TOUCH TO BLOOM</span><button class="clear" id="clear">FRESH PAPER ↗</button></div></main><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let drops=[],color='40,59,96';const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;let oldWidth=0,oldHeight=0;function resize(){const w=c.clientWidth,h=c.clientHeight;if(oldWidth&&oldHeight)drops.forEach(d=>{d.x=d.x/oldWidth*w;d.y=d.y/oldHeight*h});oldWidth=w;oldHeight=h;c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio)}function add(x,y){drops.push({x,y,r:reduced?140:4,age:0,color,seed:Math.random()*10});if(drops.length>24)drops.shift()}function frame(){ctx.clearRect(0,0,c.clientWidth,c.clientHeight);for(let d of drops){d.age++;d.r=Math.min(140,d.r+(reduced?0:.45));for(let k=0;k<5;k++){ctx.beginPath();for(let a=0;a<Math.PI*2+.07;a+=.06){let r=d.r*(.72+k*.09)*(1+.13*Math.sin(a*7+d.seed)+.06*Math.cos(a*13+d.seed));let x=d.x+Math.cos(a)*r,y=d.y+Math.sin(a)*r;a?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.fillStyle='rgba('+d.color+','+(.08-k*.007)+')';ctx.fill()}let g=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r*.6);g.addColorStop(0,'rgba('+d.color+',.25)');g.addColorStop(1,'rgba('+d.color+',0)');ctx.fillStyle=g;ctx.fillRect(d.x-d.r,d.y-d.r,d.r*2,d.r*2)}requestAnimationFrame(frame)}c.onpointerdown=e=>add(e.clientX,e.clientY);document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('.swatch').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.getElementById('clear').onclick=()=>drops=[];addEventListener('resize',resize);resize();add(innerWidth*.7,innerHeight*.47);add(innerWidth*.77,innerHeight*.63);drops.forEach((d,i)=>d.r=120-i*25);frame();</script></body></html>
