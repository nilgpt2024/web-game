</head><body><header><span>KOMOREBI</span><span>京都 · EST. 1924</span></header><main><section><div class="tag">A LITTLE LESS. A LITTLE SLOWER.</div><h1>The art of<br><em>being here.</em></h1><p>Shade-grown leaves. Warm water. Three quiet minutes that belong entirely to you.</p><button id="start">BEGIN THE RITUAL ↗</button><div class="time" id="time" aria-live="polite">SENCHA / 80°C / 3 MINUTES</div><div class="line"></div></section><div class="scene" aria-label="Illustrated ceramic bowl of green tea"><div class="steam">∿</div><div class="cup"></div><div class="stone"></div></div></main><script>let timer=null,left=180,deadline=0;const b=document.querySelector('#start'),t=document.querySelector('#time');function paint(){t.textContent=String(Math.floor(left/60)).padStart(2,'0')+' : '+String(left%60).padStart(2,'0')+' — BREATHE SLOWLY'}b.onclick=()=>{if(timer){left=Math.max(0,Math.ceil((deadline-Date.now())/1000));clearInterval(timer);timer=null;b.textContent='RESUME THE RITUAL ↗';paint();return}if(left===0)left=180;deadline=Date.now()+left*1000;b.textContent='PAUSE THE RITUAL';paint();timer=setInterval(()=>{left=Math.max(0,Math.ceil((deadline-Date.now())/1000));paint();if(left===0){clearInterval(timer);timer=null;t.textContent='YOUR TEA IS READY. ENJOY THE MOMENT.';b.textContent='BREW AGAIN ↗'}},200)};</script></body></html>
