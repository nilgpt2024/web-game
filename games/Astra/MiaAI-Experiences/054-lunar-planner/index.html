ne-journal')||''}catch{}j.oninput=()=>{try{localStorage.setItem('selene-journal',j.value);document.querySelector('#status').textContent='Saved in this browser.'}catch{document.querySelector('#status').textContent='Storage unavailable. Your words remain here until you close this page.'}};document.querySelectorAll('.phases button').forEach(button=>{button.setAttribute('aria-pressed',button.classList.contains('active'));button.addEventListener('click',()=>document.querySelectorAll('.phases button').forEach(item=>item.setAttribute('aria-pressed',item.classList.contains('active'))))});</script></body></html>
