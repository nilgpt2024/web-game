</head><body><main class="shell"><div class="top"><span>NOCTURNE / AUDIO CO.</span><span>EST. 1978</span></div><h1>Midnight frequency.</h1><div class="subtitle">A little warmth on the other side of the dial.</div><div class="console"><div class="speaker" aria-label="Vintage concentric speaker"></div><section><div class="display"><div class="freq"><span id="freq">88.4</span><small style="font-size:14px"> FM</small></div><div class="station" id="station">AMBER ROOM / SOFT DRONE</div><div class="scale"></div></div><label for="tune">TUNE THE NIGHT</label><input id="tune" type="range" min="88" max="108" step=".1" value="88.4"><div class="controls"><button id="play" aria-label="Start synthesized tone">▶</button><div><label for="volume">VOLUME</label><input id="volume" type="range" min="0" max=".15" step=".01" value=".04"></div></div></section></div><div class="status" id="status">SYNTHESIZED SOUND · NO BROADCAST CONNECTION · TAP PLAY</div></main><script>let ctx,osc,gain,on=false;const q=s=>document.querySelector(s);q('#play').onclick=()=>{if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)();osc=ctx.createOscillator();gain=ctx.createGain();osc.type='sine';osc.connect(gain);gain.connect(ctx.destination);gain.gain.value=0;osc.start()}catch{q('#status').textContent='Audio is unavailable in this browser.';return}}ctx.resume();on=!on;gain.gain.setTargetAtTime(on?+q('#volume').value:0,ctx.currentTime,.15);osc.frequency.value=110+(+q('#tune').value-88)*12;q('#play').textContent=on?'Ⅱ':'▶';q('#play').setAttribute('aria-label',on?'Pause tone':'Start synthesized tone');q('#status').textContent=on?'ON AIR · A SOFT LOCALLY SYNTHESIZED TONE':'PAUSED · THE NIGHT IS STILL HERE'};q('#tune').oninput=e=>{let f=+e.target.value;q('#freq').textContent=f.toFixed(1);q('#station').textContent=f<95?'AMBER ROOM / SOFT DRONE':f<102?'VELVET HOUR / WARM SIGNAL':'AFTERGLOW / HIGH ORBIT';if(osc)osc.frequency.setTargetAtTime(110+(f-88)*12,ctx.currentTime,.1)};q('#volume').oninput=e=>{if(gain&&on)gain.gain.setTargetAtTime(+e.target.value,ctx.currentTime,.1)};</script></body></html>
