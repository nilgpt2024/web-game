<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>禅石 Still / A Small Garden - AI生成交互体验 | game.suipce.com</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e3d7;color:#56584c;font-family:Georgia,serif}header{padding:28px 5%;display:flex;justify-content:space-between;font:11px Arial;letter-spacing:3px}.title{text-align:center;margin:30px 15px}h1{font-weight:normal;font-size:clamp(50px,7vw,80px);margin:20px}p{font-size:14px;color:#898779}.garden{position:relative;width:min(1000px,90vw);height:390px;margin:35px auto;background:#d7ceba;border:14px solid #b9aa8c;box-shadow:0 20px 40px #81776125,inset 0 0 30px #a8987370;border-radius:4px;overflow:hidden;touch-action:none}.sand{position:absolute;inset:-50%;background:repeating-radial-gradient(ellipse at 48% 50%,transparent 0 12px,#b3a68d80 13px 14px,#e6decc80 15px 16px);transform:rotate(-12deg);pointer-events:none}.stone{position:absolute;width:110px;height:75px;border:0;border-radius:47% 53% 40% 60%;background:radial-gradient(ellipse at 35% 25%,#8b8a7b,#585c53 65%,#444b40);box-shadow:12px 15px 15px #6d61484a,inset -8px -7px 10px #35403140;cursor:grab;touch-action:none;color:#fff0;font-size:10px}.stone:focus-visible{outline:3px solid #3a6646}.stone:nth-of-type(2){width:75px;height:56px;background:radial-gradient(ellipse at 30% 20%,#b1ada0,#767e6e)}.stone:nth-of-type(3){width:135px;height:93px}.footer{display:flex;justify-content:space-between;width:min(1000px,90vw);margin:auto;font:10px Arial;letter-spacing:2px;align-items:center}#reset{border:1px solid #aaa18b;background:transparent;color:#5d6353;padding:12px 18px;cursor:pointer}.moss{position:absolute;width:95px;height:50px;right:18%;bottom:18%;border-radius:50%;background:radial-gradient(#7c8554,#929266);filter:blur(1px);box-shadow:0 0 15px #7e855533}@media(max-width:600px){.garden{height:350px}.stone{transform:scale(.8)}.footer{font-size:8px}}</style>  <meta name="description" content="禅石：AI生成的交互式艺术体验。浏览器直接打开，移动端适配，无需下载。">

</head><body><header><span>STILL.</span><span>THE PRACTICE OF DOING LESS</span></header><main><div class="title"><p>枯山水 / A SMALL DRY LANDSCAPE</p><h1>Nothing to finish.</h1><p>Arrange a stone. Change your mind. Take your time.</p></div><div class="garden" id="garden"><div class="sand"></div><div class="moss"></div><button class="stone" aria-label="Move first stone with arrow keys"></button><button class="stone" aria-label="Move second stone with arrow keys"></button><button class="stone" aria-label="Move third stone with arrow keys"></button></div><div class="footer"><span>DRAG STONES · OR FOCUS + ARROW KEYS</span><button id="reset">RESTORE THE GARDEN ↺</button></div></main><script>const g=document.querySelector('#garden'),stones=[...document.querySelectorAll('.stone')];function place(s,x,y){s.style.left=Math.max(0,Math.min(g.clientWidth-s.offsetWidth,x))+'px';s.style.top=Math.max(0,Math.min(g.clientHeight-s.offsetHeight,y))+'px'}function reset(){stones.forEach((s,i)=>place(s,g.clientWidth*[.2,.45,.65][i],g.clientHeight*[.32,.58,.22][i]))}stones.forEach(s=>{let dx,dy;s.onpointerdown=e=>{s.setPointerCapture(e.pointerId);dx=e.clientX-s.offsetLeft;dy=e.clientY-s.offsetTop;s.style.cursor='grabbing'};s.onpointermove=e=>{if(s.hasPointerCapture(e.pointerId))place(s,e.clientX-dx,e.clientY-dy)};s.onpointerup=()=>s.style.cursor='grab';s.onkeydown=e=>{let d={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[e.key];if(d){e.preventDefault();place(s,s.offsetLeft+d[0],s.offsetTop+d[1])}}});document.querySelector('#reset').onclick=reset;window.onresize=reset;reset();</script></body></html>
