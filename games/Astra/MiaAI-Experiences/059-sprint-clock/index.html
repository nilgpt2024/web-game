</head><body><header><span>SPLIT®</span><span>EVERY SECOND IS A START.</span></header><main><div class="lead"><h1>MAKE IT<br>COUNT.</h1><p>A precision stopwatch for whatever you're chasing. Your next personal best starts here.</p></div><div class="clock" aria-label="Elapsed time"><span id="time">00:00</span><small id="ms">.00</small></div><div class="actions"><button id="start">START ↗</button><button class="secondary" id="lap" disabled>LAP +</button><button class="secondary" id="reset">RESET ↺</button></div><div class="bottom"><div class="note"><div class="arrow">↗</div>NO DISTRACTIONS. JUST MOMENTUM.<br>SPACE TO START / PAUSE · L TO LAP</div><section class="laps" id="laps" aria-live="polite"><div class="lap"><span>YOUR SPLITS</span><span>READY WHEN YOU ARE</span></div></section></div></main><script>let running=false,started=0,elapsed=0,n=0;const q=s=>document.querySelector(s);function value(){return elapsed+(running?performance.now()-started:0)}function fmt(t){return String(Math.floor(t/60000)).padStart(2,'0')+':'+String(Math.floor(t/1000)%60).padStart(2,'0')+'.'+String(Math.floor(t/10)%100).padStart(2,'0')}function render(){let s=fmt(value());q('#time').textContent=s.slice(0,-3);q('#ms').textContent=s.slice(-3);requestAnimationFrame(render)}q('#start').onclick=()=>{if(running)elapsed+=performance.now()-started;else started=performance.now();running=!running;q('#start').textContent=running?'PAUSE Ⅱ':'START ↗';q('#lap').disabled=!running};q('#lap').onclick=()=>{if(!running)return;n++;let d=document.createElement('div');d.className='lap';let a=document.createElement('span'),b=document.createElement('span');a.textContent='SPLIT '+String(n).padStart(2,'0');b.textContent=fmt(value());d.append(a,b);q('#laps').append(d)};q('#reset').onclick=()=>{running=false;elapsed=0;n=0;q('#start').textContent='START ↗';q('#lap').disabled=true;q('#laps').replaceChildren()};document.onkeydown=e=>{if(e.target.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();q('#start').click()}if(e.key.toLowerCase()==='l')q('#lap').click()};render();</script></body></html>
