xt x="495" y="285">Gardens</text><text x="195" y="395">Southbank</text><text x="490" y="465">Ocean</text><text x="190" y="465">Orchard</text><text x="560" y="190">Atelier</text></svg><div class="map-label">NOT TO SCALE / FOLLOW YOUR CURIOSITY</div></section></main><script>const info={all:'CITY NETWORK|Explore a line to discover its character.|Illustrative map · no live service data',river:'RIVER LINE / 6 STOPS|From pine-scented hills to the open ocean.|A route for daydreamers and sea air.',sun:'SUN LINE / 5 STOPS|Museums, orchards, and a brighter morning.|A route for slow weekends.',rose:'ROSE LINE / 4 STOPS|From Southbank cafés to the atelier quarter.|A route for makers and wanderers.'};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('.active').classList.remove('active');b.classList.add('active');document.querySelectorAll('.route').forEach(p=>p.style.opacity=b.dataset.line==='all'||p.id===b.dataset.line?1:.12);const d=document.querySelector('#detail');d.replaceChildren();info[b.dataset.line].split('|').forEach(s=>{d.append(document.createTextNode(s),document.createElement('br'))})});document.querySelectorAll('[data-line]').forEach(button=>{button.setAttribute('aria-pressed',button.classList.contains('active'));button.addEventListener('click',()=>document.querySelectorAll('[data-line]').forEach(item=>item.setAttribute('aria-pressed',item.classList.contains('active'))))});</script></body></html>
