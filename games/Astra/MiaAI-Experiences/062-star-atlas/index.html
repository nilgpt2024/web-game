</head><body><canvas id="sky" aria-label="Interactive star field. Click to place connected stars." tabindex="0"></canvas><header><span>ASTER / PERSONAL STAR ATLAS</span><span>YOUR OWN SMALL INFINITY</span></header><main class="intro"><p>THE SKY HAS ROOM FOR ANOTHER STORY</p><h1>Draw your<br><em>own north.</em></h1><p>Click anywhere in the sky to place a star. Your constellation unfolds one connection at a time. Press Enter for a surprise star.</p></main><footer class="bottom"><div><span id="count">00</span>STARS IN YOUR CONSTELLATION</div><button id="clear">A NEW SKY ↺</button></footer><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let w,h,stars=[],points=[];function resize(){let oldw=w,oldh=h;w=innerWidth;h=innerHeight;if(oldw&&oldh)points=points.map(p=>[p[0]/oldw*w,p[1]/oldh*h]);let d=devicePixelRatio||1;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);stars=Array.from({length:180},()=>[Math.random()*w,Math.random()*h,Math.random()*1.3,Math.random()]);draw()}function draw(){x.clearRect(0,0,w,h);let g=x.createRadialGradient(w*.7,h*.5,0,w*.7,h*.5,w*.6);g.addColorStop(0,'#18334a');g.addColorStop(1,'#070f1d');x.fillStyle=g;x.fillRect(0,0,w,h);stars.forEach(s=>{x.fillStyle='rgba(180,213,239,'+(s[3]*.6+.15)+')';x.beginPath();x.arc(s[0],s[1],s[2],0,7);x.fill()});x.strokeStyle='#8dbfd975';x.lineWidth=1;x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();points.forEach((p,i)=>{x.shadowBlur=20;x.shadowColor='#b8e7ff';x.fillStyle='#e5f6ff';x.beginPath();x.arc(p[0],p[1],3,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#668da5';x.font='10px monospace';x.fillText(String(i+1).padStart(2,'0'),p[0]+10,p[1]-10)});document.querySelector('#count').textContent=String(points.length).padStart(2,'0')}c.onclick=e=>{points.push([e.clientX,e.clientY]);draw()};c.onkeydown=e=>{if(e.key==='Enter'){points.push([w*(.4+Math.random()*.5),h*(.2+Math.random()*.6)]);draw()}};document.querySelector('#clear').onclick=()=>{points=[];draw()};window.onresize=resize;resize();points=[[.62,.29],[.73,.38],[.69,.54],[.82,.65],[.59,.72],[.52,.53],[.62,.29]].map(p=>[p[0]*w,p[1]*h]);draw();</script></body></html>
