</head><body><header><span>RESONANCE® / WAVE STUDIO</span><span>VISUAL EXPERIMENT 063</span></header><main><div class="headline"><h1>See what<br><em>you feel.</em></h1><p>A study in oscillation. Shape a silent wave and watch small changes become beautiful complexity.</p></div><div class="scope"><span>LIVE WAVEFORM / SILENT VISUALIZATION</span><canvas id="wave" aria-label="Animated layered sine wave"></canvas></div><div class="controls"><div><label for="freq">FREQUENCY <span id="fv">3.0</span></label><input id="freq" type="range" min="1" max="10" step=".1" value="3"></div><div><label for="amp">AMPLITUDE <span id="av">60</span></label><input id="amp" type="range" min="10" max="100" value="60"></div><button id="pause">FREEZE WAVE Ⅱ</button></div><div class="foot">SINE + HARMONICS / AN INSTRUMENT FOR YOUR EYES</div></main><script>let c=document.querySelector('canvas'),ctx=c.getContext('2d'),t=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;function frame(){let d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!==w*d||c.height!==h*d){c.width=w*d;c.height=h*d}ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);ctx.strokeStyle='#70548b22';ctx.lineWidth=1;for(let y=30;y<h;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}let f=+document.querySelector('#freq').value,a=+document.querySelector('#amp').value;['#df9dbd','#9e91e6','#8fcae0'].forEach((col,k)=>{ctx.beginPath();ctx.strokeStyle=col;ctx.shadowBlur=15;ctx.shadowColor=col;ctx.lineWidth=2;for(let x=0;x<=w;x+=2){let envelope=Math.sin(x/w*Math.PI),y=h/2+Math.sin(x/w*Math.PI*2*f+t+k*.65)*a*envelope*(1-k*.15);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()});ctx.shadowBlur=0;if(!paused)t+=.025;requestAnimationFrame(frame)}document.querySelectorAll('input').forEach(e=>e.oninput=()=>{document.querySelector('#fv').textContent=(+document.querySelector('#freq').value).toFixed(1);document.querySelector('#av').textContent=document.querySelector('#amp').value});const b=document.querySelector('#pause');function label(){b.textContent=paused?'RESUME WAVE ▶':'FREEZE WAVE Ⅱ'}b.onclick=()=>{paused=!paused;label()};label();frame();</script></body></html>
