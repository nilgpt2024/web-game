</head><body><header><span>BLOOM / A BOTANICAL LAB</span><span>NATURE, WITH A LITTLE MATH.</span></header><main class="layout"><section><div class="art"><svg viewBox="0 0 500 500" aria-label="Interactive radial flower"><defs><linearGradient id="petal"><stop stop-color="#f1c0a4"/><stop offset="1" stop-color="#b65e7b" stop-opacity=".6"/></linearGradient></defs><g id="flower"></g><circle cx="250" cy="250" r="22" fill="#8c5965"/><circle cx="250" cy="250" r="12" fill="#e9bb8e"/></svg></div><div class="caption">SPECIMEN B–065 / YOUR OWN VARIETY</div></section><section><p>EVERY FLOWER IS A FORMULA</p><h1>Let curiosity<br><em>unfold.</em></h1><p>No two blooms need to be alike. Shape a botanical impossibility, one petal at a time.</p><div class="controls"><label for="petals">PETALS <span id="pv">12</span></label><input id="petals" type="range" min="5" max="24" value="12"><label for="length">REACH <span id="lv">150</span></label><input id="length" type="range" min="80" max="190" value="150"><button id="surprise">A DIFFERENT BLOOM ↗</button></div></section></main><script>const ns='http://www.w3.org/2000/svg',q=s=>document.querySelector(s);function draw(){let n=+q('#petals').value,l=+q('#length').value;q('#pv').textContent=n;q('#lv').textContent=l;q('#flower').replaceChildren();for(let i=0;i<n;i++){let e=document.createElementNS(ns,'ellipse');e.setAttribute('cx',250);e.setAttribute('cy',250-l/2);e.setAttribute('rx',35);e.setAttribute('ry',l/2);e.setAttribute('fill','url(#petal)');e.setAttribute('stroke','#b46f7a50');e.setAttribute('transform','rotate('+(i*360/n)+' 250 250)');q('#flower').append(e)}}document.querySelectorAll('input').forEach(e=>e.oninput=draw);q('#surprise').onclick=()=>{q('#petals').value=5+Math.floor(Math.random()*20);q('#length').value=80+Math.floor(Math.random()*111);draw()};draw();</script></body></html>
