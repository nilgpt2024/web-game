<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>骑士巡游 Knight / A Study in Movement - AI生成交互体验 | game.suipce.com</title><style>*{box-sizing:border-box}body{margin:0;background:#ece6d9;color:#343b35;font-family:Georgia,serif}header{padding:25px 5%;display:flex;justify-content:space-between;font:10px Arial;letter-spacing:3px;border-bottom:1px solid #bac0ae}.layout{max-width:1100px;margin:50px auto;padding:25px;display:grid;grid-template-columns:1fr 1fr;gap:65px;align-items:center}h1{font-size:clamp(55px,7vw,88px);line-height:1;font-weight:normal;margin:20px 0}h1 em{color:#7c8c70}p{max-width:300px;font:14px/1.8 Arial;color:#82907d}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));aspect-ratio:1;box-shadow:15px 20px 40px #63695525;border:12px solid #495744}.cell{min-width:0;padding:0;border:0;background:#e8e1c9;display:grid;place-items:center;font:clamp(20px,4vw,45px) Georgia;cursor:pointer;color:#283c2c;aspect-ratio:1;position:relative}.cell.dark{background:#8b9b78}.cell.visited:after{content:'';width:8px;height:8px;border-radius:50%;background:#46583950}.cell.possible{box-shadow:inset 0 0 0 3px #d7ab5a}.cell.possible:before{content:'';width:13px;height:13px;border-radius:50%;background:#b88936}.cell:focus-visible{outline:3px solid #fff;z-index:1}.stats{display:flex;gap:35px;margin:30px 0;border-top:1px solid #bac0ae;padding-top:25px;font:10px Arial;letter-spacing:2px}.stats strong{display:block;font:40px Georgia;margin-bottom:8px}#reset{border:1px solid #819077;background:transparent;color:#465640;padding:14px 22px;cursor:pointer}#message{font:12px Arial;margin-top:20px;color:#6c7d60;min-height:35px}@media(max-width:650px){.layout{grid-template-columns:1fr;gap:25px;margin:15px auto}.board{grid-row:1;min-width:0}.layout>section{min-width:0}.cell{font-size:34px}h1{font-size:55px}}</style>  <meta name="description" content="骑士巡游：AI生成的交互式艺术体验。浏览器直接打开，移动端适配，无需下载。">

</head><body><header><span>KNIGHT / A STUDY IN MOVEMENT</span><span>ONE PIECE. SIXTY-FOUR POSSIBILITIES.</span></header><main class="layout"><section><p>THINK A LITTLE DIFFERENTLY</p><h1>The beauty<br>of a <em>detour.</em></h1><p>A knight never takes the straight path. Visit as many squares as you can, without returning to one you've seen.</p><div class="stats"><div><strong id="visited">1</strong>SQUARES VISITED</div><div><strong id="options">2</strong>NEXT MOVES</div></div><button id="reset">START ANOTHER JOURNEY ↺</button><div id="message" aria-live="polite">Choose a gold-marked square to move.</div></section><div class="board" id="board" aria-label="Knight movement puzzle"></div></main><script>let pos=0,seen=new Set([0]);const board=document.querySelector('#board');function valid(i){let dx=Math.abs(i%8-pos%8),dy=Math.abs(Math.floor(i/8)-Math.floor(pos/8));return dx*dy===2&&!seen.has(i)}function draw(){board.replaceChildren();let count=0;for(let i=0;i<64;i++){let b=document.createElement('button');b.className='cell'+((i%8+Math.floor(i/8))%2?' dark':'')+(seen.has(i)&&i!==pos?' visited':'')+(valid(i)?' possible':'');b.setAttribute('aria-label',String.fromCharCode(65+i%8)+(8-Math.floor(i/8))+(i===pos?' knight':valid(i)?' available move':seen.has(i)?' visited':''));if(i===pos)b.textContent='♞';if(valid(i))count++;b.onclick=e=>{if(valid(i)){pos=i;seen.add(i);draw();if(e.detail===0)board.children[pos].focus()}else document.querySelector('#message').textContent='Move in an L: two squares one way, one across.'};board.append(b)}document.querySelector('#visited').textContent=seen.size;document.querySelector('#options').textContent=count;document.querySelector('#message').textContent=seen.size===64?'A complete tour. Beautifully done.':count?'Choose a gold-marked square to move.':'Journey complete: '+seen.size+' squares. Try another path.'}document.querySelector('#reset').onclick=()=>{pos=0;seen=new Set([0]);draw()};draw();</script></body></html>
