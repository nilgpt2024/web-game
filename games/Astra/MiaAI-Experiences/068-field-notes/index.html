</head><body><div class="notebook"><aside><div class="eyebrow">VOLUME NO. 068</div><h1>Fieldnotes.</h1><p>For the things you notice.<br>And the things you nearly miss.</p><nav class="tabs"><button class="active" data-page="0">01 / Small ideas</button><button data-page="1">02 / Observations</button><button data-page="2">03 / Someday</button></nav><div class="seal">FN.</div></aside><main><div class="date"><span>A PRIVATE LITTLE NOTEBOOK</span><span id="page">PAGE 01</span></div><input id="title" aria-label="Note title" value="A thought worth keeping"><textarea id="note" aria-label="Note content" placeholder="It started with a small observation…"></textarea><footer><span id="saved">SAVED LOCALLY WHEN AVAILABLE</span><span id="words">0 WORDS</span></footer></main></div><script>let current=0,pages=[{title:'A thought worth keeping',text:''},{title:'What I noticed today',text:''},{title:'A little list of someday',text:''}];try{let p=JSON.parse(localStorage.getItem('fieldnotes-068'));if(Array.isArray(p)&&p.length===3&&p.every(v=>typeof v.title==='string'&&typeof v.text==='string'))pages=p}catch{}const q=s=>document.querySelector(s);function render(){q('#title').value=pages[current].title;q('#note').value=pages[current].text;q('#page').textContent='PAGE 0'+(current+1);count()}function count(){let t=q('#note').value.trim();q('#words').textContent=(t?t.split(/\s+/).length:0)+' WORDS'}function save(){pages[current]={title:q('#title').value,text:q('#note').value};count();try{localStorage.setItem('fieldnotes-068',JSON.stringify(pages));q('#saved').textContent='SAVED IN THIS BROWSER'}catch{q('#saved').textContent='SESSION ONLY · STORAGE UNAVAILABLE'}}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=+b.dataset.page;document.querySelector('.active').classList.remove('active');b.classList.add('active');render()});q('#title').oninput=save;q('#note').oninput=save;render();document.querySelectorAll('[data-page]').forEach(button=>{button.setAttribute('aria-pressed',button.classList.contains('active'));button.addEventListener('click',()=>document.querySelectorAll('[data-page]').forEach(item=>item.setAttribute('aria-pressed',item.classList.contains('active'))))});</script></body></html>
