</head><body><header><span>ROOM / A LITTLE SPACE TO FOCUS</span><span>THE WORLD CAN WAIT.</span></header><main class="layout"><div class="window" aria-label="Illustrated sunset through an arched window"><div class="sun"></div><div class="hill"></div><div class="hill two"></div><div class="cross"></div></div><section><div class="eyebrow">SETTLE IN. YOU'RE HERE NOW.</div><h1>One thing.<br><em>All your attention.</em></h1><input id="task" aria-label="Your focus intention" placeholder="What deserves your next 25 minutes?"><div class="clock" id="clock">25:00</div><button id="start">BEGIN SESSION ↗</button><button class="ghost" id="reset">RESET</button><div class="status" id="status" aria-live="polite">A quiet 25-minute focus session.<br>No accounts. No distractions. Just a little room.</div></section></main><script>let remaining=1500,running=false,end=0;const q=s=>document.querySelector(s);function paint(){q('#clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}q('#start').onclick=()=>{if(running){remaining=Math.max(0,Math.ceil((end-Date.now())/1000));running=false;q('#start').textContent='RESUME SESSION ↗';q('#status').textContent='Paused. Take the space you need.'}else{if(!remaining)remaining=1500;end=Date.now()+remaining*1000;running=true;q('#start').textContent='PAUSE SESSION';q('#status').textContent=q('#task').value?'Now focusing on: '+q('#task').value:'Your quiet session is underway.'}};q('#reset').onclick=()=>{running=false;remaining=1500;paint();q('#start').textContent='BEGIN SESSION ↗';q('#status').textContent='A fresh start. Ready when you are.'};setInterval(()=>{if(!running)return;remaining=Math.max(0,Math.ceil((end-Date.now())/1000));paint();if(!remaining){running=false;q('#start').textContent='ANOTHER SESSION ↗';q('#status').textContent='Session complete. Step away and enjoy a short break.'}},200);</script></body></html>
