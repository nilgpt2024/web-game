<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>像素拼布 Patchwork / Pixel Quilt - AI生成交互体验 | game.suipce.com</title><style>*{box-sizing:border-box}body{margin:0;background:#f2e6d2;color:#3d4b51;font-family:Arial,sans-serif}header{padding:25px 5%;display:flex;justify-content:space-between;font:10px monospace;letter-spacing:2px}.layout{max-width:1100px;margin:25px auto;padding:30px;display:grid;grid-template-columns:1fr 1.2fr;gap:70px;align-items:center}h1{font:normal clamp(55px,7vw,88px) Georgia;line-height:.95;letter-spacing:-3px;margin:25px 0}h1 em{color:#ba6049}p{font-size:13px;line-height:1.8;color:#8c8a77;max-width:300px}.palette{display:flex;gap:10px;margin:30px 0}.color{width:35px;height:35px;border:3px solid transparent;border-radius:50%;background:var(--c);cursor:pointer;box-shadow:0 0 0 1px #b5ac96}.color.active{border-color:#fff;box-shadow:0 0 0 2px #3d4b51}.quilt{display:grid;grid-template-columns:repeat(8,1fr);border:13px solid #e1d2b5;box-shadow:15px 20px 40px #83704e22;gap:2px;background:#e1d2b5;touch-action:none}.patch{aspect-ratio:1;border:0;cursor:crosshair;position:relative}.patch:after{content:'';position:absolute;inset:5px;border:1px dashed #ffffff45;pointer-events:none}.patch:focus-visible{outline:3px solid #fff;z-index:1}.actions{display:flex;gap:10px}.actions button{padding:12px 17px;background:transparent;border:1px solid #aaa58e;color:#536057;cursor:pointer;font:10px monospace}.caption{text-align:center;font:10px monospace;letter-spacing:2px;margin-top:20px;color:#8d8c77}@media(max-width:650px){.layout{grid-template-columns:1fr;gap:25px;padding:25px}h1{font-size:60px}.quilt{border-width:9px}}</style>  <meta name="description" content="像素拼布：AI生成的交互式艺术体验。浏览器直接打开，移动端适配，无需下载。">

</head><body><header><span>PATCHWORK / LITTLE PIECES, TOGETHER</span><span>A DIGITAL CRAFT TABLE</span></header><main class="layout"><section><p>MAKE SOMETHING WITH YOUR HANDS</p><h1>A square<br>of <em>possibility.</em></h1><p>Choose a thread of color. Leave a little mark. Build a pattern that feels like you.</p><div class="palette"><button class="color active" style="--c:#ba6049" data-color="#ba6049" aria-label="Terracotta"></button><button class="color" style="--c:#50757a" data-color="#50757a" aria-label="Teal"></button><button class="color" style="--c:#d9ab54" data-color="#d9ab54" aria-label="Gold"></button><button class="color" style="--c:#84956b" data-color="#84956b" aria-label="Sage"></button><button class="color" style="--c:#ede0c5" data-color="#ede0c5" aria-label="Cream"></button></div><div class="actions"><button id="clear">FRESH CLOTH ↺</button><button id="undo">UNDO LAST STITCH</button></div><p id="status" aria-live="polite">Tap squares to stitch. Every mark belongs.</p></section><section><div class="quilt" id="quilt" aria-label="Eight by eight color quilt"></div><div class="caption">64 PATCHES / INFINITE ARRANGEMENTS</div></section></main><script>let selected='#ba6049',history=[];const colors=['#ba6049','#50757a','#d9ab54','#84956b','#ede0c5'],quilt=document.querySelector('#quilt');for(let i=0;i<64;i++){let b=document.createElement('button');b.className='patch';b.style.background=colors[(Math.floor(i/8)+i%8)%5];b.setAttribute('aria-label','Patch row '+(Math.floor(i/8)+1)+', column '+(i%8+1));b.onclick=()=>{history.push([b,b.style.background]);b.style.background=selected;document.querySelector('#status').textContent='A little color, a little more you.'};quilt.append(b)}document.querySelectorAll('.color').forEach(b=>b.onclick=()=>{document.querySelector('.color.active').classList.remove('active');b.classList.add('active');selected=b.dataset.color});document.querySelector('#clear').onclick=()=>{history.push([...quilt.children].map(b=>[b,b.style.background]));quilt.childNodes.forEach(b=>b.style.background='#ede0c5');document.querySelector('#status').textContent='A fresh cloth. Your next pattern awaits.'};document.querySelector('#undo').onclick=()=>{let h=history.pop();if(!h)return;if(Array.isArray(h[0]))h.forEach(([b,c])=>b.style.background=c);else h[0].style.background=h[1];document.querySelector('#status').textContent='Last change undone.'};document.querySelectorAll('.color').forEach(button=>{button.setAttribute('aria-pressed',button.classList.contains('active'));button.addEventListener('click',()=>document.querySelectorAll('.color').forEach(item=>item.setAttribute('aria-pressed',item.classList.contains('active'))))});</script></body></html>
