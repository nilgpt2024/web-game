 style="background:#c77442" data-color="#c77442" aria-label="Terracotta" aria-pressed="false"></button></div><div class="control"><label for="light">DAYLIGHT <span id="level">100%</span></label><input id="light" type="range" min="40" max="150" value="100"></div><p class="hint" id="paint" role="status">Amber selected · Choose a pane</p></section></main><script>let color='#e2b85f';document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelector('#paint').textContent=b.getAttribute('aria-label')+' selected · Choose a pane'});document.querySelectorAll('.pane').forEach(p=>{function paint(){p.setAttribute('fill',color);document.querySelector('#paint').textContent='A new color, a different light.'}p.onclick=paint;p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();paint()}}});document.querySelector('#light').oninput=e=>{document.documentElement.style.setProperty('--light',e.target.value/100);document.querySelector('#level').textContent=e.target.value+'%'};</script></body></html>
