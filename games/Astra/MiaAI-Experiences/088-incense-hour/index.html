</head><body><header><span class="logo">KŌ 香</span><span>AN HOUR WITHOUT EDGES</span></header><main><section class="altar"><canvas id="smoke" role="img" aria-label="Fine incense smoke drifting above a ceramic holder"></canvas><div class="title"><span style="font:8px Arial;letter-spacing:3px;color:#cea487">A SMALL RITUAL OF AIR</span><h1>Watch a<br>moment<br><em>disappear.</em></h1><p>No fragrance. No flame.<br>Just the shape of letting go.</p></div><div class="vertical" aria-hidden="true">静かな時間</div><div class="tray"></div><div class="stick"></div><div class="ash"></div></section><section class="controls"><div class="control"><label for="breeze">THE PASSING AIR <span id="wind">STILL</span></label><input id="breeze" type="range" min="-50" max="50" value="0"></div><button id="pause">HOLD THE MOMENT Ⅱ</button><span class="note">“What leaves a trace need not leave a mark.”</span></section></main><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let w,h,t=0,wind=0,paused=matchMedia('(prefers-reduced-motion:reduce)').matches,last=0;function size(){let r=c.getBoundingClientRect();w=r.width;h=r.height;let d=Math.min(devicePixelRatio,2);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0);draw()}function draw(){g.clearRect(0,0,w,h);const x=w/2+36,y=h-(w<650?97:112)-207;for(let k=0;k<20;k++){g.beginPath();for(let j=0;j<90;j++){let rise=j*3.4,spread=j/90,px=x+Math.sin(j*.085+t+k*.05)*spread*30+wind*spread*2+k*.4*spread,py=y-rise; j?g.lineTo(px,py):g.moveTo(px,py)}g.strokeStyle='rgba(246,212,188,'+(.025+k*.001)+')';g.lineWidth=.8;g.stroke()}}function frame(now){if(!paused){t+=Math.min(now-last,40)*.0007;draw()}last=now;requestAnimationFrame(frame)}document.querySelector('#breeze').oninput=e=>{wind=+e.target.value;document.querySelector('#wind').textContent=wind< -8?'WESTWARD':wind>8?'EASTWARD':'STILL';draw()};const b=document.querySelector('#pause');function label(){b.textContent=paused?'LET IT DRIFT ▶':'HOLD THE MOMENT Ⅱ'}b.onclick=()=>{paused=!paused;label()};addEventListener('resize',size);size();label();requestAnimationFrame(frame);</script></body></html>
