</head><body><header><span class="brand">SIDE B.</span><span>A LISTENING ROOM</span></header><main><section class="intro"><h1>Let the evening spin.</h1><p>Original synthesized tones.<br>Three small loops for a slower hour.</p></section><div class="deck"><div class="record"><div class="label">SIDE B<br>33⅓ RPM</div></div><div class="arm"></div><div class="deck-brand">ANALOG / 089</div></div><section class="player"><div class="track"><h2 id="title">Amber Hour</h2><p id="artist">01 / WARM SINE STUDY</p></div><div class="actions"><button id="prev" aria-label="Previous sound">‹</button><button id="play" aria-label="Play synthesized sound" aria-pressed="false">▶</button><button id="next" aria-label="Next sound">›</button></div><label class="progress">OUTPUT / <span id="volumeText">20%</span><input id="volume" aria-label="Volume" type="range" min="0" max="50" value="20"></label></section></main><script>let ctx,gain,osc=[],playing=false,index=0;const tracks=[['Amber Hour','WARM SINE STUDY',[130.81,164.81,196]],['Blue Window','SOFT FIFTH STUDY',[146.83,220,293.66]],['Last Light','LOW OCTAVE STUDY',[110,165,220]]];function stop(){osc.forEach(o=>o.stop());osc=[]}function sound(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();gain=ctx.createGain();gain.connect(ctx.destination)}ctx.resume();gain.gain.value=+document.querySelector('#volume').value/500;stop();tracks[index][2].forEach(f=>{let o=ctx.createOscillator();o.frequency.value=f;o.type='sine';o.connect(gain);o.start();osc.push(o)})}function change(d){index=(index+d+3)%3;document.querySelector('#title').textContent=tracks[index][0];document.querySelector('#artist').textContent='0'+(index+1)+' / '+tracks[index][1];if(playing)sound()}document.querySelector('#play').onclick=function(){playing=!playing;document.body.classList.toggle('playing',playing);this.textContent=playing?'Ⅱ':'▶';this.setAttribute('aria-pressed',playing);this.setAttribute('aria-label',playing?'Pause sound':'Play synthesized sound');if(playing)sound();else stop()};document.querySelector('#prev').onclick=()=>change(-1);document.querySelector('#next').onclick=()=>change(1);document.querySelector('#volume').oninput=e=>{document.querySelector('#volumeText').textContent=e.target.value+'%';if(gain)gain.gain.setTargetAtTime(+e.target.value/500,ctx.currentTime,.1)};</script></body></html>
