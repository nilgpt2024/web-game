</head><body><canvas id="canvas" aria-label="Flowing ribbon animation that follows the pointer"></canvas><main class="overlay"><header class="top"><span>RIBBON / MOVEMENT STUDY</span><span>094 · DIGITAL CHOREOGRAPHY</span></header><h1>Leave<br>a little<br>motion.</h1><p class="copy">A line remembers where you have been.<br>Move across the stage, and let the ribbon follow your gesture.</p><footer class="bottom"><div class="controls"><button class="active" data-color="280">LILAC</button><button data-color="22">EMBER</button><button data-color="175">TIDAL</button><button id="pause">PAUSE</button><button id="clear">CLEAR</button></div><div class="note"><span class="dot"></span>POINTER + TOUCH / LIVE CANVAS</div></footer></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let w,h,t=4,hue=280,paused=matchMedia('(prefers-reduced-motion:reduce)').matches,mouse=null,points=[],last=0;function paint(){x.clearRect(0,0,w,h);for(let j=0;j<9;j++){x.beginPath();points.forEach((p,i)=>{let xx=p.x+Math.sin(i*.08+t+j*.2)*j*3,yy=p.y+Math.cos(i*.08+t+j*.2)*j*3;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.strokeStyle='hsla('+(hue+j*2)+',55%,'+(60+j*2)+'%,'+(.16+j*.045)+')';x.lineWidth=1.5;x.stroke()}}function size(){const d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);points=Array.from({length:100},(_,i)=>{const q=t-(99-i)*.04;return{x:w*.64+Math.sin(q)*w*.2,y:h*.5+Math.sin(q*1.7)*h*.28}});paint()}c.onpointermove=e=>mouse={x:e.clientX,y:e.clientY};c.onpointerleave=()=>mouse=null;function frame(now){if(!paused){t+=Math.min(now-last,40)*.00072;points.push(mouse||{x:w*.64+Math.sin(t)*w*.2,y:h*.5+Math.sin(t*1.7)*h*.28});if(points.length>100)points.shift();paint()}last=now;requestAnimationFrame(frame)}document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{hue=+b.dataset.color;document.querySelectorAll('[data-color]').forEach(z=>z.classList.toggle('active',z===b));paint()});const pause=document.querySelector('#pause');function label(){pause.textContent=paused?'PLAY':'PAUSE';pause.setAttribute('aria-pressed',paused)}pause.onclick=()=>{paused=!paused;label()};document.querySelector('#clear').onclick=()=>{points=[];paint()};addEventListener('resize',size);size();label();requestAnimationFrame(frame);</script></body></html>
