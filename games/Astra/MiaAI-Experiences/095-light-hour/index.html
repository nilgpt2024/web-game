<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光之时辰 Light Hour — A shadow study - AI生成交互体验 | suipce.com</title><style>*{box-sizing:border-box}body{margin:0;background:#e6d3aa;color:#5d4a32;font-family:Arial,sans-serif;transition:background .4s}.top{padding:28px 6%;display:flex;justify-content:space-between;font-size:9px;letter-spacing:3px}.stage{height:380px;position:relative;margin:20px 6%;overflow:hidden;background:linear-gradient(90deg,#d7bf93,#f1deb4);border-radius:2px;box-shadow:inset 0 0 70px #96774a11}.windowlight{position:absolute;width:460px;height:500px;left:20%;top:-100px;background:linear-gradient(90deg,transparent 0 47%,#b8a17766 47% 51%,transparent 51%),linear-gradient(0deg,transparent 0 47%,#b8a17766 47% 51%,transparent 51%),#fff7ce77;transform:skew(-30deg) rotate(10deg);filter:blur(2px)}.ball{position:absolute;width:130px;height:130px;border-radius:50%;left:43%;bottom:100px;background:radial-gradient(circle at var(--light,30%) 25%,#fff5d3,#d5b97f 65%,#aa8750);box-shadow:inset -4px -5px 15px #8d6d3522}.shadow{position:absolute;left:calc(43% + 40px);bottom:86px;width:230px;height:55px;border-radius:50%;background:#75603f55;filter:blur(8px);transform-origin:0 50%;transform:rotate(var(--angle,8deg)) scaleX(var(--length,1));transition:transform .1s}.cube{position:absolute;left:24%;bottom:90px;width:60px;height:95px;background:linear-gradient(90deg,#e6c990 0 70%,#bc9d60 70%);box-shadow:60px 10px 20px #8c724d33}.line{position:absolute;bottom:55px;left:8%;right:8%;height:1px;background:#ac8e5b44}.caption{position:absolute;left:25px;top:25px;font:9px monospace;letter-spacing:2px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10%;padding:20px 9% 40px}h1{font:clamp(45px,6vw,75px)/1 Georgia;letter-spacing:-3px;font-weight:400;margin:0 0 18px}p{font-size:12px;line-height:1.8;color:#977b55;max-width:320px}.control{align-self:center}label{display:flex;justify-content:space-between;font-size:9px;letter-spacing:2px;margin-bottom:20px}input{width:100%;accent-color:#987742}.hours{display:flex;justify-content:space-between;font:10px monospace;color:#997d55;margin-top:15px}.status{font:italic 14px Georgia;margin-top:30px;color:#876c46}@media(max-width:650px){.stage{height:300px}.bottom{grid-template-columns:1fr;gap:25px}.ball{width:100px;height:100px}.cube{left:18%}.windowlight{left:0}h1{letter-spacing:-2px}}</style>  <meta name="description" content="光之时辰：AI生成的交互式艺术体验。浏览器直接打开，移动端适配，无需下载。">

</head><body><header class="top"><span>LIGHT / HOUR</span><span>STILL LIFE NO. 095</span></header><main><section class="stage" role="img" aria-label="Sunlit sphere and block with adjustable cast shadows"><div class="windowlight"></div><span class="caption">A ROOM, TWO OBJECTS, THE PASSING SUN.</span><div class="line"></div><div class="shadow"></div><div class="cube"></div><div class="ball"></div></section><section class="bottom"><div><h1>Time is<br>made of light.</h1><p>Watch a simple room change its character. The objects stay; everything around them quietly moves.</p></div><div class="control"><label for="hour">MOVE THE SUN <span id="time">10:00</span></label><input id="hour" type="range" min="6" max="18" step="0.25" value="10"><div class="hours"><span>06:00</span><span>12:00</span><span>18:00</span></div><div class="status" id="mood" role="status">Morning / the room begins to warm.</div></div></section></main><script>const s=document.querySelector('#hour');function update(){let v=+s.value,p=(v-6)/12;document.querySelector('#time').textContent=String(Math.floor(v)).padStart(2,'0')+':'+String(Math.round(v%1*60)).padStart(2,'0');document.documentElement.style.setProperty('--angle',(-35+p*70)+'deg');document.documentElement.style.setProperty('--length',.35+Math.abs(p-.5)*2.4);document.documentElement.style.setProperty('--light',(15+p*70)+'%');document.querySelector('.windowlight').style.transform=`translateX(${(p-.5)*200}px) skew(${30-p*60}deg) rotate(10deg)`;document.querySelector('#mood').textContent=v<11?'Morning / the room begins to warm.':v<15?'Midday / light rests almost overhead.':'Evening / the shadows grow long.';document.body.style.background=`hsl(${40-p*9} 48% ${82-Math.abs(p-.5)*9}%)`}s.oninput=update;update();</script></body></html>
