</head><body><canvas aria-label="Animated layered organic wave field"></canvas><main class="overlay"><header class="top"><span class="brand">ORGANICA</span><span>THE HUNDREDTH STUDY</span></header><section class="heading"><span style="font-size:9px;letter-spacing:4px;color:#9fc6a8">NOTHING IN NATURE STANDS STILL.</span><h1>A field<br>of feeling.</h1><p>Currents overlap. Colors breathe.<br>Shape a living landscape of waves, somewhere between water and light.</p></section><span class="caption">100 / THE ORGANIC WAVE LABORATORY</span><section class="controls" aria-label="Wave settings"><div class="control"><label for="amplitude">AMPLITUDE <span id="ampVal">55</span></label><input id="amplitude" type="range" min="10" max="100" value="55"></div><div class="control"><label for="speed">FLOW <span id="speedVal">35</span></label><input id="speed" type="range" min="5" max="80" value="35"></div><div class="control"><label for="palette">ECOSYSTEM</label><select id="palette"><option value="0">Tidal garden</option><option value="1">Coral dusk</option><option value="2">Electric meadow</option></select></div><button id="pause" aria-label="Pause waves" aria-pressed="false">Ⅱ</button></section><footer class="foot"><span>LIVE PROCEDURAL CANVAS / INFINITE VARIATIONS</span><span>AN ENDING THAT KEEPS MOVING.</span></footer></main><script>const c=document.querySelector('canvas'),ctx=c.getContext('2d');let w,h,t=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;const sets=[[['#0f5a64','#5caa86','#bddaa0'],'#082b32'],[['#592d59','#c97876','#f2bb86'],'#281f35'],[['#264c64','#4cac98','#cef076'],'#132c36']];function resize(){let d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0);draw()}function draw(){const set=sets[document.querySelector('#palette').value],a=+document.querySelector('#amplitude').value;ctx.fillStyle=set[1];ctx.fillRect(0,0,w,h);for(let j=0;j<18;j++){let g=ctx.createLinearGradient(0,h*.2,w,h);g.addColorStop(0,set[0][0]);g.addColorStop(.55,set[0][1]);g.addColorStop(1,set[0][2]);ctx.beginPath();for(let x=-10;x<=w+10;x+=6){const y=h*.55+j*11+Math.sin(x/w*5+t+j*.13)*a+Math.cos(x/w*8-t*.7+j*.18)*a*.55+(x/w-.5)*-h*.25;x===-10?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.globalAlpha=.075+j*.018;ctx.fillStyle=g;ctx.fill();ctx.globalAlpha=.3;ctx.strokeStyle=set[0][j%3];ctx.lineWidth=.7;ctx.stroke()}ctx.globalAlpha=1}function animate(){if(!paused){t+=+document.querySelector('#speed').value*.0006;draw()}requestAnimationFrame(animate)}resize();animate();addEventListener('resize',resize);['amplitude','speed'].forEach(id=>document.getElementById(id).oninput=e=>{document.getElementById(id==='amplitude'?'ampVal':'speedVal').textContent=e.target.value;draw()});document.querySelector('#palette').onchange=draw;const b=document.querySelector('#pause');function label(){b.textContent=paused?'▶':'Ⅱ';b.setAttribute('aria-label',paused?'Play waves':'Pause waves');b.setAttribute('aria-pressed',paused)}b.onclick=()=>{paused=!paused;label()};label();</script></body></html>
