    /* ---------------- tiny math ---------------- */
    const TAU = Math.PI * 2;

    /* ---------------- audio (all procedural) ---------------- */
    let AC = null, master = null, noiseBuf = null, muted = false;
    const _sLast = {};

    function audio() {
        if (muted) return null;
        if (!AC) {
            try {
                AC = new (window.AudioContext || window.webkitAudioContext)();
                master = AC.createGain();
                master.gain.value = 0.85;
                master.connect(AC.destination);
                const n = AC.sampleRate * 0.35 | 0;
                noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
                const d = noiseBuf.getChannelData(0);
                for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
            } catch (e) {
                muted = true;
                return null;
            }
        }
        if (AC.state === 'suspended') AC.resume();
        return AC;
    }

    function knock(freq, dur, vol, q) {
        const ac = audio();
        if (!ac) return;
        const src = ac.createBufferSource();
        src.buffer = noiseBuf;
        const f = ac.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.value = freq;
        f.Q.value = q || 1.2;
        const g = ac.createGain();
        const t = ac.currentTime;
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        src.connect(f);
        f.connect(g);
        g.connect(master);
        src.start(t);
        src.stop(t + dur + 0.02);
    }

    function blip(freq, dur, vol, type) {
        const ac = audio();
        if (!ac) return;
        const o = ac.createOscillator();
        o.type = type || 'sine';
        o.frequency.value = freq;
        const g = ac.createGain();
        const t = ac.currentTime;
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g);
        g.connect(master);
        o.start(t);
        o.stop(t + dur + 0.02);
    }

    function sfx(kind, a) {
        const now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
        if (_sLast[kind] && now - _sLast[kind] < 28) return;
        _sLast[kind] = now;
        switch (kind) {
            case 'clack': {
                const v = clamp(a / 900, 0.04, 1);
                knock(2100 + v * 1300, 0.05, 0.5 * v, 1.6);
                blip(3400, 0.02, 0.10 * v, 'triangle');
                break;
            }
            case 'rail': {
                const v = clamp(a / 900, 0.05, 1);
                knock(210, 0.08, 0.5 * v, 0.8);
                break;
            }
            case 'pocket':
                knock(165, 0.10, 0.5, 0.9);
                setTimeout(() => knock(130, 0.14, 0.4, 0.8), 65);
                setTimeout(() => knock(2600, 0.03, 0.12, 2), 40);
                break;
            case 'cue':
                knock(1500, 0.035, 0.30, 2.2);
                break;
            case 'place':
                knock(900, 0.05, 0.18, 1.5);
                break;
            case 'bad':
                blip(180, 0.12, 0.14, 'square');
                break;
            case 'win':
                [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, 0.34, 0.16, 'triangle'), i * 110));
                break;
            case 'lose':
                [330, 262, 208].forEach((f, i) => setTimeout(() => blip(f, 0.3, 0.13, 'sine'), i * 130));
                break;
        }
    }
