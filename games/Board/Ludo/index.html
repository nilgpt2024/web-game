@keyframes live { 0%,100% { opacity: .25 } 50% { opacity: .9 } }

@keyframes shake { 20%{transform:translate(-1.5%,0.5%)} 40%{transform:translate(1.3%,-0.6%)} 60%{transform:translate(-0.8%,0.3%)} 80%{transform:translate(0.4%,0)} }

}
.ov.show .card { transform: none; }
.card h2 { font-family: var(--serif); font-weight: 800; font-size: 52px; line-height: .95; margin: 2px 0 6px; letter-spacing: -.01em; font-variation-settings: 'SOFT' 100, 'opsz' 144; }
.card .sub { font-size: 15px; font-weight: 600; color: #5e4a39; margin: 0 0 20px; }
.motif { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
.motif span { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }

  display: block; width: 100%; height: 54px; border: 0; border-radius: 16px; margin-top: 10px; cursor: pointer;
  font: 650 18px var(--serif); letter-spacing: .01em; color: #fff8ea; background: var(--c0);

.seg { display: flex; background: rgba(59,42,32,.09); border-radius: 14px; padding: 4px; margin: 6px 0; }

.seg button.sel { background: var(--ink); color: #fff4dc; box-shadow: 0 2px 6px rgba(59,42,32,.18); }
.lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: #8c755e; margin: 14px 0 2px; text-align: left; }

.places li b { font-family: var(--serif); width: 22px; font-size: 17px; }

<script id="core">
// Ludo, DOM-free. Positions are per token: -1 waiting in the yard, 0..50 on the shared track counted from the
// owner's start square, 51..55 the owner's home lane, 56 home. Seats are 0..3 clockwise; seat s starts on track
// cell 13*s. Every random number comes from the state's own seed, so a saved game carries on identically.
const LUDO = (() => {
  const HOME = 56, LANE = 51, TRACK = 52;
  const SAFE = [0, 8, 13, 21, 26, 34, 39, 47];

  // The 52 track cells on a 15x15 grid, starting at seat 0's start square (yard top-left), clockwise.
  const rot = ([c, r], k) => { for (let i = 0; i < k; i++) [c, r] = [14 - r, c]; return [c, r]; };
  const TRACK_XY = (() => {
    const q = [[1, 6], [2, 6], [3, 6], [4, 6], [5, 6], [6, 5], [6, 4], [6, 3], [6, 2], [6, 1], [6, 0], [7, 0], [8, 0]];
    return [0, 1, 2, 3].flatMap(k => q.map(p => rot(p, k)));
  })();
  const YARD = [[1.5, 1.5], [3.5, 1.5], [1.5, 3.5], [3.5, 3.5]];

  // Grid cell (possibly fractional) of seat s's token t at position pos.
  function xy(s, pos, t = 0) {
    if (pos < 0) return rot(YARD[t], s);
    if (pos < LANE) return TRACK_XY[(pos + 13 * s) % TRACK];
    if (pos < HOME) return rot([1 + pos - LANE, 7], s);
    return rot([6.2, 6.35 + t * 0.43], s);
  }
  const cell = (s, pos) => pos >= 0 && pos < LANE ? (pos + 13 * s) % TRACK : -1;   // absolute track cell, -1 off-track

  // mulberry32 over a 32-bit state kept in the game state.
  function rand(g) {
    let t = (g.rng = (g.rng + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // seats: array of four entries, each 'human' | 'bot' | null (not playing).
  function newGame(seats, seed = (Math.random() * 2 ** 32) | 0) {
    const g = {seats: seats.slice(), tok: seats.map(() => [-1, -1, -1, -1]), turn: 0, die: 0, sixes: 0,
      phase: 'roll', rng: seed | 0, winner: -1, places: [], captures: [0, 0, 0, 0], rolls: 0};
    g.turn = seats.findIndex(Boolean);
    return g;
  }

  const active = g => g.seats.map((s, i) => s && g.places.indexOf(i) < 0 ? i : -1).filter(i => i >= 0);
  function nextSeat(g, from) {
    for (let k = 1; k <= 4; k++) { const s = (from + k) % 4; if (g.seats[s] && g.places.indexOf(s) < 0) return s; }
    return from;
  }

  function target(g, s, t, d) {
    const p = g.tok[s][t];
    if (p === HOME) return null;
    if (p < 0) return d === 6 ? 0 : null;
    return p + d <= HOME ? p + d : null;
  }
  function legal(g, d = g.die) {
    const out = [];
    for (let t = 0; t < 4; t++) if (target(g, g.turn, t, d) !== null) out.push(t);
    return out;
  }

  // Who would be sent home if seat s landed on position pos.
  function victims(g, s, pos) {
    const c = cell(s, pos);
    if (c < 0 || SAFE.indexOf(c) >= 0) return [];
    const v = [];
    g.seats.forEach((on, o) => { if (on && o !== s) g.tok[o].forEach((q, t) => { if (cell(o, q) === c) v.push([o, t]); }); });
    return v;
  }

  // Roll the die. Returns {die, moves, pass, reason}. pass = the turn is over without a move.
  function roll(g) {
    if (g.phase !== 'roll') throw new Error('not rolling');
    const d = 1 + Math.floor(rand(g) * 6);
    g.die = d; g.rolls++;
    if (d === 6) g.sixes++; else g.sixes = 0;
    if (g.sixes === 3) { const by = g.turn; endTurn(g, false); return {die: d, moves: [], pass: true, reason: 'three', seat: by}; }
    const m = legal(g, d);
    if (!m.length) { const by = g.turn; endTurn(g, d === 6); return {die: d, moves: [], pass: true, reason: 'blocked', seat: by}; }
    g.phase = 'move';
    return {die: d, moves: m, pass: false, seat: g.turn};
  }

  function endTurn(g, again) {
    g.phase = 'roll';
    if (!again) { g.sixes = 0; g.turn = nextSeat(g, g.turn); }
  }

  // Move token t of the seat to play. Returns the events the page animates.
  function move(g, t) {
    if (g.phase !== 'move') throw new Error('not moving');
    const s = g.turn, from = g.tok[s][t], to = target(g, s, t, g.die);
    if (to === null) throw new Error('illegal move');
    const path = [];
    if (from < 0) path.push(0); else for (let p = from + 1; p <= to; p++) path.push(p);
    const caught = victims(g, s, to);
    caught.forEach(([o, k]) => { g.tok[o][k] = -1; });
    g.captures[s] += caught.length;
    g.tok[s][t] = to;
    const home = to === HOME;
    const won = g.tok[s].every(p => p === HOME);
    if (won) {
      // The first seat home wins; the rest are ranked by how far their tokens got.
      g.winner = s;
      const far = o => g.tok[o].reduce((a, p) => a + p + 1, 0);
      g.places = [s].concat(active(g).filter(o => o !== s).sort((a, b) => far(b) - far(a)));
      g.phase = 'over';
    } else endTurn(g, g.die === 6 || caught.length > 0 || home);
    return {seat: s, token: t, from, to, path, caught, home, won, bonus: g.phase !== 'over' && g.turn === s};
  }

  // A computer player. Scores every legal token and picks the best; ties go to the token furthest along.
  function threat(g, s, pos) {
    // How many opponent tokens sit 1..6 behind this cell (and could land on it next roll).
    const c = cell(s, pos);
    if (c < 0 || SAFE.indexOf(c) >= 0) return 0;
    let n = 0;
    g.seats.forEach((on, o) => {
      if (!on || o === s) return;
      g.tok[o].forEach(q => {
        if (q < 0) { if ((13 * o) % TRACK === c) n += 0.4; return; }
        if (q >= LANE) return;
        const oc = cell(o, q);
        const gap = (c - oc + TRACK) % TRACK;
        // An opponent can only reach c if it lies on their own track before their lane.
        if (gap >= 1 && gap <= 6 && q + gap < LANE) n++;
      });
    });
    return n;
  }
  function score(g, t) {
    const s = g.turn, from = g.tok[s][t], to = target(g, s, t, g.die);
    let v = 0;
    const caught = victims(g, s, to);
    caught.forEach(([o, k]) => { v += 40 + g.tok[o][k]; });
    if (to === HOME) v += 30;
    if (from < 0) v += 25;
    if (to >= LANE && from < LANE) v += 18;
    const was = from >= 0 && from < LANE ? threat(g, s, from) : 0;
    const now = to < LANE ? threat(g, s, to) : 0;
    v += was * (8 + from / 4);
    v -= now * (10 + to / 4);
    if (SAFE.indexOf(cell(s, to)) >= 0) v += 6;
    v += to / 20;
    return v;
  }
  function bot(g) {
    const m = legal(g);
    let best = m[0], bv = -Infinity;
    for (const t of m) { const v = score(g, t); if (v > bv) { bv = v; best = t; } }
