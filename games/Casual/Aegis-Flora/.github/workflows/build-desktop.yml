name: Build Desktop Releases (Windows & macOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run game + release verification tests
        run: |
          for t in tests/*.test.js; do
            echo "--- $t"
            node "$t" || exit 1
          done

  build:
    name: Build (${{ matrix.os }})
    needs: test
    # Only run expensive macOS (10x) and Windows (2x) packaging runners for explicit releases or manual trigger
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            build_script: npm run build:win
            artifact_name: Aegis-Florae-1.1.0-Windows-x64
            artifact_path: |
              desktop/dist/*.exe
              desktop/dist/*.zip
          - os: macos-latest
            build_script: npm run build:mac
            artifact_name: Aegis-Florae-1.1.0-macOS-DMG
            artifact_path: desktop/dist/*.dmg

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install Desktop Dependencies (clean)
        if: hashFiles('desktop/package-lock.json') != ''
        working-directory: ./desktop
        run: npm ci

      - name: Install Desktop Dependencies (fallback, no lockfile)
        if: hashFiles('desktop/package-lock.json') == ''
        working-directory: ./desktop
        run: npm install

      - name: Verify production icons exist
        working-directory: ./desktop
        run: npm run check-icons

      - name: Build macOS Distribution (DMG, arm64 + x64)
        if: matrix.os == 'macos-latest'
        working-directory: ./desktop
        env:
          # Code signing + notarization are applied only when these secrets
          # are configured. Unsigned local/CI builds still succeed without them.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.build_script }}

      - name: Build Windows Distribution (NSIS Installer & Steam Depot ZIP)
        if: matrix.os == 'windows-latest'
        working-directory: ./desktop
        run: ${{ matrix.build_script }}

      # Store installers only for explicit releases/manual builds, not every push or PR.
      - name: Upload Release Artifacts
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Rename to canonical release asset names
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-assets
          rm -f *.blockmap
          exes=(*-win-x64.exe)
          zips=(*-win-x64.zip)
          arms=(*-mac-arm64.dmg)
          x64s=(*-mac-x64.dmg)
          [ ${#exes[@]} -eq 1 ] || { echo "expected 1 win exe, found ${#exes[@]}"; exit 1; }
          [ ${#zips[@]} -eq 1 ] || { echo "expected 1 win zip, found ${#zips[@]}"; exit 1; }
          [ ${#arms[@]} -eq 1 ] || { echo "expected 1 mac arm64 dmg, found ${#arms[@]}"; exit 1; }
          [ ${#x64s[@]} -eq 1 ] || { echo "expected 1 mac x64 dmg, found ${#x64s[@]}"; exit 1; }
          mv "${exes[0]}" "AegisFlorae-1.1.0-Windows-x64-Setup.exe"
          mv "${zips[0]}" "AegisFlorae-1.1.0-Windows-x64-Portable.zip"
          mv "${arms[0]}" "AegisFlorae-1.1.0-macOS-arm64.dmg"
          mv "${x64s[0]}" "AegisFlorae-1.1.0-macOS-x64.dmg"
          ls -la

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
