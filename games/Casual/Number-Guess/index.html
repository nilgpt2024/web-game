// A heist is a run of safes. Each safe hides one number in 0..n-1 and brings a few picks with it;
// every guess spends a pick and the dial answers higher or lower. Picks left over when a safe opens
// stay in the roll for the next one. The roll running dry before the safe opens ends the heist.
const TumblerCore = (() => {
    // how many numbers each safe holds; from the seventh on, every safe is 0-999
    const SIZES = [10, 30, 60, 100, 200, 500, 1000];
    const size = k => SIZES[Math.min(k, SIZES.length - 1)];
    // the most guesses halving can need: with this many picks a careful player always opens the safe
    const sure = n => Math.ceil(Math.log2(n + 1));
    // the picks a safe brings: enough to be sure for the first four, then one short (so a careful
    // player needs a spare or some luck), two short from the tenth, three from the fifteenth
    const allowance = k => sure(size(k)) - (k >= 4) - (k >= 9) - (k >= 14);

    function hash(str) {
        let h = 1779033703 ^ str.length;
        for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
        h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
        return (h ^ h >>> 16) >>> 0;
    }
    function rand(a) { // mulberry32, one draw
        a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    // the combination of safe k in heist `seed`: depends on nothing else, so a save needs no PRNG state
    const secret = (seed, k) => Math.floor(rand(hash(seed + '#' + k)) * size(k));

    function openSafe(s) {
        const n = size(s.k), pay = allowance(s.k);
        s.n = n; s.lo = 0; s.hi = n - 1; s.tries = []; s.pay = pay; s.bank += pay;
        return {type: 'safe', k: s.k, n, pay};
    }
    function start(seed) {
        const s = {v: 1, seed: String(seed), k: 0, bank: 0, n: 0, lo: 0, hi: 0, pay: 0, tries: [], log: [], over: false};
        openSafe(s);
        return s;
    }
    // one guess. Returns what happened, in order: 'low'/'high' (the number is higher/lower than x),
    // or 'open' then 'safe' (the next one), and 'bust' when the last pick goes without opening it.
    function guess(s, x) {
        if (s.over) return [{type: 'over'}];
        x = Math.round(x);
        if (!(x >= s.lo && x <= s.hi)) return [{type: 'ruled', x}];
        const c = secret(s.seed, s.k);
        s.bank--;
        if (x === c) {
            s.tries.push({x, d: 0});
            const used = s.tries.length;
            s.log.push({n: s.n, used, pay: s.pay});
            const ev = [{type: 'open', k: s.k, x, used, spare: s.bank}];
            s.k++;
            ev.push(openSafe(s));
            return ev;
        }
        const d = x < c ? 1 : -1; // 1: the number is higher
        s.tries.push({x, d});
        if (d > 0) s.lo = x + 1; else s.hi = x - 1;
        const ev = [{type: d > 0 ? 'low' : 'high', x, lo: s.lo, hi: s.hi}];
        if (s.bank <= 0) {
            s.over = true;
            s.log.push({n: s.n, used: s.tries.length, pay: s.pay, bust: true});
            ev.push({type: 'bust', k: s.k, secret: c});
        }
        return ev;
    }
    // what a careful player is certain of: with b picks, any range of up to 2^b - 1 numbers opens
    const certain = s => s.hi - s.lo + 1 <= Math.pow(2, s.bank) - 1;
    const valid = s => s && s.v === 1 && typeof s.seed === 'string' && Number.isInteger(s.k) && Number.isInteger(s.bank)
        && s.lo >= 0 && s.hi < size(s.k) && s.lo <= s.hi + (s.over ? 1 : 0) && Array.isArray(s.tries) && Array.isArray(s.log);
    // the line a finished heist shares: one square per safe, no numbers given away
    function share(s, title) {
        const sq = s.log.map(e => e.bust ? '🟥' : e.used < e.pay ? '🟩' : '🟨').join('');
        const opened = s.log.filter(e => !e.bust).length;
        return `${title}\n${sq}\n${opened} safe${opened === 1 ? '' : 's'} opened`;
    }
    return {SIZES, size, sure, allowance, secret, hash, start, guess, certain, valid, share};
})();
