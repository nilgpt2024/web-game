// Prickle Patch - the rules. No DOM, no clock of its own: the page calls step(dt) and tap(hole).
// One round is one evening: ROUND seconds of sun. Hedgehogs come up out of nine burrows; boop them
// before they tuck in and drop away. Wasps come up too; touching one is a sting, and costs sun.
const PrickleCore = (() => {
    const ROUND = 45;          // seconds of evening
    const STING_COST = 4;      // a sting burns this much sun
    const APPLE_GIFT = 2;      // an apple gives this much back
    const PIPS = 5, MAX_MULT = 5;
    const RISE = 0.14, TUCK = 0.16, SINK = 0.2, DROP = 0.26, FLEE = 0.42, GRACE = 0.1;
    const RANKS = [[0, 'Seedling'], [3000, 'Weeder'], [8000, 'Gardener'], [16000, 'Head Gardener'], [28000, 'Hedgehog Whisperer']];
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

    function rng(seed) {
        let a = seed >>> 0 || 1;
        return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    // how far into the evening: the sun's own position, so a sting brings night on faster and an
    // apple holds it back
    const dusk = s => clamp(1 - s.left / ROUND, 0, 1);

    function create(opt = {}) {
        return {
            seed: opt.seed >>> 0 || 1, rand: rng(opt.seed || 1), tutorial: !!opt.tutorial,
            t: 0, left: ROUND, over: false,
            score: 0, streak: 0, bestStreak: 0, mult: 1, pips: 0,
            boops: 0, misses: 0, stings: 0, apples: 0, spawned: 0, wasps: 0,
            holes: new Array(9).fill(null), nextId: 1,
            nextSpawn: opt.tutorial ? 0.05 : 0.3, lastApple: 0, recent: [], firstWasp: false
        };
    }

    // ---- the tempo of the evening, d = 0 at golden hour, 1 at dark
    const tempo = {
        warn: d => lerp(0.3, 0.17, d),                 // how long a burrow heaves before something comes up
        hogUp: d => lerp(1.25, 0.62, d),                // how long a hedgehog waits to be booped
        waspUp: d => lerp(1.7, 1.1, d),                 // how long a wasp hangs about
        gap: d => lerp(0.95, 0.4, Math.pow(d, 0.9)),    // time between arrivals
        cap: d => Math.min(4, 2 + Math.floor(d * 2.5)), // most burrows busy at once
        wasp: d => lerp(0.15, 0.3, d)                   // chance an arrival is a wasp
    };

    function busy(s) { return s.holes.filter(Boolean).length; }
    function pickHole(s) {
        const free = [];
        for (let i = 0; i < 9; i++) if (!s.holes[i]) free.push(i);
        if (!free.length) return -1;
        const fresh = free.filter(i => !s.recent.includes(i));
        const from = fresh.length ? fresh : free;
        return from[Math.floor(s.rand() * from.length)];
    }
    function spawn(s, ev) {
        const d = dusk(s), tut = s.tutorial && s.t < 12;
        const cap = tut ? 1 : tempo.cap(d);
        if (busy(s) >= cap) { s.nextSpawn = s.t + 0.12; return; }
        let kind = 'hog';
        if (tut) {
            // the first round teaches one thing at a time: three hedgehogs, then a wasp, alone
            if (s.spawned >= 3 && !s.firstWasp) kind = 'wasp';
        } else if (s.t > 6 && s.rand() < tempo.wasp(d) && !(d < 0.4 && s.holes.some(e => e && e.kind === 'wasp'))) kind = 'wasp';
        if (!s.tutorial && s.t > 6 && !s.firstWasp) kind = 'wasp';
        const hole = pickHole(s); if (hole < 0) { s.nextSpawn = s.t + 0.12; return; }
        const apple = kind === 'hog' && s.t > 10 && s.t - s.lastApple > 11 + s.rand() * 4;
        if (apple) s.lastApple = s.t;
        if (kind === 'wasp') { s.firstWasp = true; s.wasps++; }
        const warn = tempo.warn(d), up = kind === 'wasp' ? tempo.waspUp(d) : tut ? 1.7 : tempo.hogUp(d);
        const e = {id: s.nextId++, kind, apple, hole, phase: 'warn', t0: s.t, warn, up, upAt: 0};
        s.holes[hole] = e; s.spawned++;
        s.recent.push(hole); if (s.recent.length > 2) s.recent.shift();
        ev.push({type: 'warn', hole, kind, apple, id: e.id});
        s.nextSpawn = s.t + (tut ? 1.15 : tempo.gap(d) * (0.8 + s.rand() * 0.4));
    }
    function breakStreak(s, hard) {
        s.streak = 0; s.pips = 0;
        s.mult = hard ? 1 : Math.max(1, s.mult - 1);
    }
    // advance the evening by dt seconds; returns what happened, for the page to draw and play
    function step(s, dt) {
        const ev = [];
        if (s.over) { advance(s, dt, ev); return ev; }
        s.t += dt; s.left -= dt;
        if (s.left <= 0) {
            s.left = 0; s.over = true;
            for (const e of s.holes) if (e && e.phase !== 'sink' && e.phase !== 'drop' && e.phase !== 'flee') { e.phase = 'sink'; e.t0 = s.t; }
            ev.push({type: 'end'});
            return ev;
        }
        if (s.t >= s.nextSpawn) spawn(s, ev);
        advance(s, 0, ev);
        return ev;
    }
    function advance(s, dt, ev) {
        if (s.over) s.t += dt;
        for (let i = 0; i < 9; i++) {
            const e = s.holes[i]; if (!e) continue;
            const age = s.t - e.t0;
            if (e.phase === 'warn' && age >= e.warn) { e.phase = 'rise'; e.t0 += e.warn; ev.push({type: 'rise', hole: i, kind: e.kind, apple: e.apple}); }
            else if (e.phase === 'rise' && age >= RISE) { e.phase = 'up'; e.t0 += RISE; e.upAt = e.t0; }
            else if (e.phase === 'up' && age >= e.up) {
                e.phase = e.kind === 'hog' ? 'tuck' : 'sink'; e.t0 += e.up; e.tucked = e.kind === 'hog';
                if (e.kind === 'hog') { s.misses++; breakStreak(s, false); ev.push({type: 'escape', hole: i, apple: e.apple}); }
                else ev.push({type: 'leave', hole: i});
            }
            else if (e.phase === 'tuck' && age >= TUCK) { e.phase = 'sink'; e.t0 += TUCK; }
            else if ((e.phase === 'sink' && age >= SINK) || (e.phase === 'drop' && age >= DROP) || (e.phase === 'flee' && age >= FLEE)) s.holes[i] = null;
        }
    }
    // a touch on burrow i. Returns the events it caused.
    function tap(s, i) {
        const ev = [];
        if (s.over || i < 0 || i > 8) return ev;
        const e = s.holes[i];
        if (!e || e.phase === 'warn' || e.phase === 'sink' || e.phase === 'drop' || e.phase === 'flee' || (e.phase === 'tuck' && s.t - e.t0 > GRACE)) {
            // thumping bare earth: nothing is hurt, but the hedgehogs hear it - the pips empty
            const had = s.pips; if (s.mult < MAX_MULT) s.pips = 0;
            ev.push({type: 'dud', hole: i, lost: had - s.pips}); return ev;
        }
        if (e.kind === 'wasp') {
            s.stings++; s.left = Math.max(0, s.left - STING_COST); breakStreak(s, true);
            e.phase = 'flee'; e.t0 = s.t;
            ev.push({type: 'sting', hole: i, cost: STING_COST});
            return ev;
        }
        if (e.phase === 'tuck') { s.misses--; } // booped in the very last moment: the miss is taken back
        // a quick boop is worth more: full bonus inside a quarter second of the face appearing
        const react = e.phase === 'rise' ? 0 : s.t - e.upAt;
        const quick = Math.round(50 * clamp(1 - (react - 0.25) / 0.5, 0, 1));
        const base = e.apple ? 250 : 100, pts = base * s.mult + quick;
        s.score += pts; s.boops++; s.streak++; s.bestStreak = Math.max(s.bestStreak, s.streak);
        let up = false;
        if (s.mult < MAX_MULT) { s.pips++; if (s.pips >= PIPS) { s.pips = 0; s.mult++; up = true; } } else s.pips = PIPS;
        e.phase = 'drop'; e.t0 = s.t;
        ev.push({type: 'boop', hole: i, pts, quick, apple: e.apple, mult: s.mult, streak: s.streak});
        if (up) ev.push({type: 'mult', mult: s.mult});
        if (e.apple) { s.apples++; const before = s.left; s.left = Math.min(ROUND, s.left + APPLE_GIFT); ev.push({type: 'apple', hole: i, gift: s.left - before}); }
        return ev;
    }
    function rank(score) { let r = RANKS[0]; for (const k of RANKS) if (score >= k[0]) r = k; return r[1]; }
    function nextRank(score) { for (const k of RANKS) if (score < k[0]) return k; return null; }
    return {ROUND, STING_COST, APPLE_GIFT, PIPS, MAX_MULT, RISE, TUCK, SINK, DROP, FLEE, GRACE, RANKS, tempo, dusk, create, step, tap, rank, nextRank, rng};
})();
</script>
