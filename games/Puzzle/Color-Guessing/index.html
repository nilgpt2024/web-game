<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--grain),radial-gradient(120% 100% at 50% 30%,#7d7d7c,#6f6f6e) var(--booth);color:var(--ink);font-family:Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

.strip .row:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--paper)}

.strip .row span.l{left:10px}.strip .row span.r{right:10px}

.sheet .strip .row{transform:none}

.top{display:flex;align-items:center;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--rule)}
.brand{white-space:nowrap;font:800 16px 'Barlow Semi Condensed';letter-spacing:.08em;text-transform:uppercase}

.snd{width:36px;height:36px;margin-right:-8px;display:grid;place-items:center;color:var(--ink2)}

.play{}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);font:600 15px Barlow;padding:10px 16px;border-radius:3px;opacity:0;transition:opacity .25s,transform .25s var(--ease);pointer-events:none;z-index:9}

@media (prefers-reduced-motion:reduce){

// Six Digits - the rules, with no DOM: colour maths, the score, the daily sheet, the notes under
// each bar and the record. test/color_guessing_game.mjs runs this block in Node.
const SixCore = (() => {
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const round1 = x => Math.round(x * 10) / 10;

  function hexToRgb(hex) { const n = parseInt(String(hex).replace('#', ''), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function rgbToHex(rgb) { return '#' + rgb.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('').toUpperCase(); }
  function hslToRgb(h, s, l) {
    h = ((h % 360) + 360) % 360;
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }
  function rgbToHsl(rgb) {
    const [r, g, b] = rgb.map(v => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
    if (d === 0) return [0, 0, l];
    const s = d / (1 - Math.abs(2 * l - 1));
    let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
    return [h, Math.min(1, s), l];
  }
  // sRGB (D65) -> CIELAB (D65)
  function rgbToLab(rgb) {
    const lin = v => (v /= 255) <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    const [R, G, B] = rgb.map(lin);
    const X = (0.4124564 * R + 0.3575761 * G + 0.1804375 * B) / 0.95047;
    const Y = 0.2126729 * R + 0.7151522 * G + 0.0721750 * B;
    const Z = (0.0193339 * R + 0.1191920 * G + 0.9503041 * B) / 1.08883;
    const f = t => t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116;
    const fx = f(X), fy = f(Y), fz = f(Z);
    return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
  }
  // CIEDE2000, as Sharma, Wu & Dalal (2005) write it out
  function deltaE2000([L1, a1, b1], [L2, a2, b2]) {
    const rad = Math.PI / 180, deg = 180 / Math.PI, p7 = Math.pow(25, 7);
    const Cb = (Math.hypot(a1, b1) + Math.hypot(a2, b2)) / 2;
    const G = 0.5 * (1 - Math.sqrt(Math.pow(Cb, 7) / (Math.pow(Cb, 7) + p7)));

  function distance(hexA, hexB) { return deltaE2000(rgbToLab(hexToRgb(hexA)), rgbToLab(hexToRgb(hexB))); }

  // Ten for a match the eye cannot split (dE under one), five at a difference anyone sees (dE 10),

    const dh = hueDiff(yh, th);

  }

    return 'Six Digits No. ' + no + ' — ' + total(e).toFixed(1) + '/50\n' + e.r.map(x => x.s.toFixed(1)).join(' · ') + '\n' + url;
  }

  return {hexToRgb, rgbToHex, hslToRgb, rgbToHsl, rgbToLab, deltaE2000, distance, score, notes, family, hueDiff, chroma,

})();
