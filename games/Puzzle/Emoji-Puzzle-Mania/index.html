// The rules of Peel & Seek, with no DOM, so test/emoji_puzzle_mania.mjs can run them in Node.
// A run is a seeded stream of sheets; every board, target and tilt comes from the seed, so the
// same seed and the same taps at the same moments always give the same run. Time is passed in
// (milliseconds, any clock) rather than read, so a test can play a whole run in a loop.
const Peel = (() => {
