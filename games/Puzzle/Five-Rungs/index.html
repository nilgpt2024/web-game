/* =========================================================================
   Five Rungs — five daily puzzles generated from the UTC date.
   Nothing is fetched and nothing is stored anywhere but this browser.
   Every puzzle below is produced by a seeded generator and then handed to a
   solver; a seed whose puzzle is unsolvable or has more than one answer is
   thrown away and the counter moves on. What you see has been proved.

/* ---------- deterministic RNG (xmur3 seed -> sfc32 stream) ---------- */
function xmur3(str){
  let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){
    h=Math.imul(h^str.charCodeAt(i),3432918353);
    h=(h<<13)|(h>>>19);
  }
  return function(){
    h=Math.imul(h^(h>>>16),2246822507);
    h=Math.imul(h^(h>>>13),3266489909);
    h^=h>>>16;return h>>>0;
  };
}
function sfc32(a,b,c,d){
  return function(){
    a|=0;b|=0;c|=0;d|=0;
    const t=(((a+b)|0)+d)|0;
    d=(d+1)|0;a=b^(b>>>9);b=(c+(c<<3))|0;c=(c<<21)|(c>>>11);c=(c+t)|0;
    return (t>>>0)/4294967296;
  };
}
function rngFor(label){
  const s=xmur3(label);
  return sfc32(s(),s(),s(),s());
}
function ri(rnd,n){return Math.floor(rnd()*n);}
function shuffle(rnd,a){for(let i=a.length-1;i>0;i--){const j=ri(rnd,i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- the day ---------- */
const EPOCH=Date.UTC(2026,0,1);
function todayUTC(){
  const n=new Date();
  return new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()));
}
function iso(d){return d.toISOString().slice(0,10);}
function dayNumber(dateStr){
  const[y,m,dd]=dateStr.split('-').map(Number);
  return Math.round((Date.UTC(y,m-1,dd)-EPOCH)/86400000);
}
function dateFromNumber(n){return iso(new Date(EPOCH+n*86400000));}
function msToUtcMidnight(){
  const n=new Date();
  return Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1)-n.getTime();
}
function fmtCountdown(ms){
  const s=Math.max(0,Math.floor(ms/1000));

/* ---------- storage that survives being switched off ---------- */
const Store=(function(){
  let live=true,mem={};
  try{
    const k='__fr_probe';
    window.localStorage.setItem(k,'1');
    window.localStorage.removeItem(k);
  }catch(e){live=false;}
  function get(k){
    if(live){try{return window.localStorage.getItem(k);}catch(e){live=false;}}
    return k in mem?mem[k]:null;
  }
  function set(k,v){
    if(live){try{window.localStorage.setItem(k,v);return;}catch(e){live=false;}}
    mem[k]=v;
  }
  return{
    get available(){return live;},
    readJSON(k,dflt){
      const raw=get(k);
      if(raw===null)return dflt;
      try{const v=JSON.parse(raw);return v===null||v===undefined?dflt:v;}catch(e){return dflt;}
    },
    writeJSON(k,v){try{set(k,JSON.stringify(v));}catch(e){}}
  };
})();

const SKEY='fiveRungs.v1';
function loadState(){
  const s=Store.readJSON(SKEY,{});
  if(typeof s!=='object'||!s)return{};
  return s;
}
function saveState(s){Store.writeJSON(SKEY,s);}
let STATE=loadState();

/* per-puzzle record for one day: {st:'open'|'won'|'lost', marks:[...], t:seconds, extra} */
function recFor(pid,date){
  const d=STATE[date];
  if(d&&d[pid])return d[pid];
  return null;
}
function putRec(pid,date,rec){
  if(!STATE[date])STATE[date]={};
  STATE[date][pid]=rec;
  /* keep the file small: 400 days is plenty of history */
  const keys=Object.keys(STATE).sort();
  while(keys.length>400)delete STATE[keys.shift()];
  saveState(STATE);
}

/* streaks and stats are derived, never stored separately, so they cannot drift */
function statsFor(pid,uptoDate){
  const upto=dayNumber(uptoDate);
  let played=0,won=0,streak=0,best=0,run=0;
  const days=Object.keys(STATE).sort();
  let prev=null;
  for(const d of days){
    const n=dayNumber(d);
    if(n>upto)continue;
    const r=STATE[d][pid];
    if(!r||r.st==='open')continue;
    played++;
    if(r.st==='won'){
      won++;
      run=(prev!==null&&n===prev+1)?run+1:1;
      if(run>best)best=run;
      prev=n;
    }else{run=0;prev=null;}
  }
  /* the current streak only counts if it reaches the day being looked at,
     or the day before it (today may still be unfinished) */
  streak=0;
  for(let n=upto;n>=upto-400;n--){
    const r=STATE[dateFromNumber(n)];
    const rec=r&&r[pid];
    if(rec&&rec.st==='won')streak++;
    else if(n===upto&&(!rec||rec.st==='open'))continue;
    else break;
  }
  return{played:played,won:won,streak:streak,best:best};
}

function copyText(text,btn){

    const old=btn.textContent;

    setTimeout(function(){btn.textContent=old;},1600);
  };
  let p=null;
  try{
    if(navigator.clipboard&&window.isSecureContext)p=navigator.clipboard.writeText(text);
  }catch(e){p=null;}
  if(p&&p.then){p.then(function(){done(true);},function(){fallback(text);done(false);});}
  else{fallback(text);done(false);}
}
function fallback(text){
  /* the textarea is always on the page next to the button, so a refused
     clipboard leaves a selected box the player can copy by hand */
  const ta=document.getElementById('shareBox');
  if(!ta)return;
  ta.value=text;ta.classList.remove('hidden');
  try{ta.focus();ta.setSelectionRange(0,text.length);}catch(e){}

/* =========================================================================
   LANTERNS — region logic
   An 8x8 board cut into 8 irregular regions. Light exactly one lantern in
   every row, every column and every region; no two lanterns may touch, not
   even at a corner.

   A random cut almost never yields a unique puzzle, so the generator carves
   towards one: it grows regions, asks the solver for a second answer, and
   moves one cell of the board across a region border to destroy it. It
   repeats until the solver can only find the intended answer.
   ========================================================================= */
const LN_N=8;

/* returns up to `limit` solutions plus the nodes the search visited */
function lanternSolve(region,N,limit){
  const colUsed=new Array(N).fill(false),regUsed=new Array(N).fill(false);
  const sols=[];let nodes=0;
  const pick=new Array(N).fill(-1);
  (function rec(r){
    if(sols.length>=limit)return;
    if(r===N){sols.push(pick.slice());return;}
    for(let c=0;c<N;c++){
      nodes++;
      if(colUsed[c])continue;
      if(r>0&&Math.abs(pick[r-1]-c)<=1)continue;
      const g=region[r*N+c];
      if(regUsed[g])continue;
      colUsed[c]=true;regUsed[g]=true;pick[r]=c;
      rec(r+1);
      colUsed[c]=false;regUsed[g]=false;pick[r]=-1;
      if(sols.length>=limit)return;
    }
  })(0);
  return{sols:sols,nodes:nodes};
}

function lnConnected(region,N,g,skip){
  let start=-1,total=0;
  for(let i=0;i<N*N;i++)if(region[i]===g&&i!==skip){if(start<0)start=i;total++;}
  if(start<0)return false;
  const seen=new Set([start]),st=[start];
  while(st.length){
    const i=st.pop(),r=(i/N)|0,c=i%N;
    const nb=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
    for(const[nr,nc]of nb){
      if(nr<0||nc<0||nr>=N||nc>=N)continue;
      const j=nr*N+nc;
      if(j===skip||region[j]!==g||seen.has(j))continue;
      seen.add(j);st.push(j);
    }
  }
  return seen.size===total;
}


/* A solver that only makes deductions a person can make, and reports how many
   rounds of them the puzzle needs. If this cannot finish the board, the board
   needs guessing and is thrown away. */
function lanternDeduce(region,N){
  const UNK=0,LIT=1,OUT=2;
  const st=new Uint8Array(N*N);
  const units=[];
  for(let r=0;r<N;r++){const u=[];for(let c=0;c<N;c++)u.push(r*N+c);units.push(u);}
  for(let c=0;c<N;c++){const u=[];for(let r=0;r<N;r++)u.push(r*N+c);units.push(u);}
  for(let g=0;g<N;g++){const u=[];for(let i=0;i<N*N;i++)if(region[i]===g)u.push(i);units.push(u);}
  let lit=0,bad=false;
  function light(i){
    if(st[i]===LIT)return;
    if(st[i]===OUT){bad=true;return;}
    st[i]=LIT;lit++;
    const r=(i/N)|0,c=i%N;
    for(let k=0;k<N;k++){
      if(k!==c&&st[r*N+k]===UNK)st[r*N+k]=OUT;
      if(k!==r&&st[k*N+c]===UNK)st[k*N+c]=OUT;
    }
    for(let j=0;j<N*N;j++)if(j!==i&&region[j]===region[i]&&st[j]===UNK)st[j]=OUT;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nc<0||nr>=N||nc>=N||(dr===0&&dc===0))continue;
      const j=nr*N+nc;
      if(st[j]===LIT)bad=true;
      else if(st[j]===UNK)st[j]=OUT;
    }
  }
  let rounds=0,confines=0;
  while(!bad&&lit<N&&rounds<80){
    rounds++;
    let changed=false;
    /* a unit with one square left must use it */
    for(const u of units){
      if(u.some(function(i){return st[i]===LIT;}))continue;
      const cand=u.filter(function(i){return st[i]===UNK;});
      if(cand.length===0){bad=true;break;}
      if(cand.length===1){light(cand[0]);changed=true;}
    }
    if(bad||lit>=N)break;
    if(changed)continue;
    /* every square a unit has left sits inside one row, column or region, so
       that other unit's lantern is this one's and the rest of it goes dark */
    for(const u of units){
      if(u.some(function(i){return st[i]===LIT;}))continue;
      const cand=u.filter(function(i){return st[i]===UNK;});
      if(cand.length<2)continue;
      const sameRow=cand.every(function(i){return ((i/N)|0)===((cand[0]/N)|0);});
      const sameCol=cand.every(function(i){return (i%N)===(cand[0]%N);});
      const sameReg=cand.every(function(i){return region[i]===region[cand[0]];});
      const kill=[];
      if(sameRow){const r=(cand[0]/N)|0;for(let c=0;c<N;c++){const j=r*N+c;if(st[j]===UNK&&cand.indexOf(j)<0)kill.push(j);}}
      if(sameCol){const c=cand[0]%N;for(let r=0;r<N;r++){const j=r*N+c;if(st[j]===UNK&&cand.indexOf(j)<0)kill.push(j);}}
      if(sameReg){const g=region[cand[0]];for(let j=0;j<N*N;j++)if(region[j]===g&&st[j]===UNK&&cand.indexOf(j)<0)kill.push(j);}
      if(kill.length){for(const j of kill)st[j]=OUT;changed=true;confines++;break;}
    }
    if(!changed)break;
  }
  const sol=[];
  if(!bad&&lit===N){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(st[r*N+c]===LIT)sol[r]=c;}
  return{solved:!bad&&lit===N,rounds:rounds,confines:confines,sol:sol,st:st};
}
