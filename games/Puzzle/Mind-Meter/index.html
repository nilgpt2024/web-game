        * {
            box-sizing: border-box
        }

        html, body {

            color: var(--text)
        }

            transition: background-color .2s, color .2s
        }

        :focus-visible {
            outline: none;
            box-shadow: var(--focus);
            border-radius: 6px
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0
        }

        .nav-bar {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border)
        }

        .text-nav, .text-nav:hover {
            color: var(--text)
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: background-color .15s, border-color .15s
        }

        .theme-toggle:hover {
            background: var(--bg-hover);
            border-color: var(--border-strong)
        }

        .theme-toggle-icon {
            width: 1.25rem;
            height: 1.25rem
        }

        html[data-sound="off"] .sound-icon-on{display:none}
        html:not([data-sound="off"]) .sound-icon-off{display:none}

        html[data-theme="dark"] .theme-icon-light, html:not([data-theme]) .theme-icon-light {
            display: none
        }

        html[data-theme="light"] .theme-icon-dark {
            display: none
        }

        @media (prefers-color-scheme: light) {
            html:not([data-theme]) .theme-icon-dark {
                display: none
            }

            html:not([data-theme]) .theme-icon-light {
                display: inline-block
            }
        }

        .page-title {
            color: var(--text)
        }

        .page-subtitle {
            color: var(--text-muted)
        }

        .footer-text {
            color: var(--text-footer)
        }

        .footer-link {
            color: var(--link)
        }

        .footer-link:hover {
            color: var(--primary-hover)
        }

        .hb-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            transition: opacity .3s;
            backdrop-filter: blur(4px)
        }

        .hb-modal-overlay.active {
            opacity: 1
        }

        .hb-modal {
            background: var(--bg-card);
            color: var(--text);

            max-width: 500px;
            width: 90%;
            margin: 20px;
            box-shadow: var(--shadow-lg);
