<script>
"use strict";
/* ============================================================================
   Nine Holes — procedural minigolf.

   The generator proposes holes and a judge rejects most of them. A hole is only
   played if (a) a hole-in-one exists at all, (b) aiming straight at the cup does
   not ace it across more than two power settings, and (c) no more than four
   distinct aiming lines ace it. Roughly half of candidates survive; the median
   hole is accepted on the second try.

   The cup's capture speed is the constant that makes that filter work. A
   forgiving cup swallows anything, so on an open hole every power drops and the
   judge throws it out as a barn door — which quietly bans open holes and leaves
   a game of nothing but blind doglegs. Measured over 2,400 candidates: at
   capture 9 only 3% of accepted holes let you see the cup; at capture 4 it is
   31%, matching the share the generator actually produces, and barn-door
   rejections fall from 27% to 4%.
   ========================================================================== */

/* ---------- constants (cells and cells/second) ---------- */
const FAIR=0, WALL=1, SAND=2, WATER=3;
const SLOPE_N=4, SLOPE_E=5, SLOPE_S=6, SLOPE_W=7;
const SLOPE_VEC={4:[0,-1],5:[1,0],6:[0,1],7:[-1,0]};
const SLOPE_ACC   = 15.0;   // must exceed FRICT_FAIR or a ball would rest on a slope
const BUMPER_R    = 0.62;
const BUMPER_REST = 1.10;   // bumpers give energy back, so they carry the ball
const BALL_R      = 0.36;
const FRICT_FAIR  = 9.0;
const FRICT_SAND  = 34.0;
const STOP_SPEED  = 0.35;
const CUP_R       = 0.42;
const CUP_CAPTURE = 4.0;    // verified: see header
const RESTITUTION = 0.72;
const MAX_POWER   = 32.0;
const DT          = 1/120;
const HOLES       = 9;

/* ---------- seeded rng ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

/* ---------- course ---------- */
class Course{
  constructor(w,h,cells,tee,cup){this.w=w;this.h=h;this.cells=cells;this.tee=tee;this.cup=cup}
  at(cx,cy){ if(cx<0||cy<0||cx>=this.w||cy>=this.h) return WALL; return this.cells[cy][cx]; }
  /* disc-vs-tile overlap */
  solid(x,y){
    const x0=Math.floor(x-BALL_R), x1=Math.floor(x+BALL_R);
    const y0=Math.floor(y-BALL_R), y1=Math.floor(y+BALL_R);
    for(let cy=y0;cy<=y1;cy++) for(let cx=x0;cx<=x1;cx++){
      if(this.at(cx,cy)===WALL){
        const nx=Math.max(cx,Math.min(x,cx+1)), ny=Math.max(cy,Math.min(y,cy+1));
        const dx=nx-x, dy=ny-y;
        if(dx*dx+dy*dy < BALL_R*BALL_R) return true;
      }
    }
    return false;
  }
  terrain(x,y){ const t=this.at(Math.floor(x),Math.floor(y)); return t===WALL?FAIR:t; }
  /* nearest overlapping bumper, or null */
  bumper(x,y){
    if(!this.bumps) return null;
    for(const b of this.bumps){
      const dx=x-b.x, dy=y-b.y, rr=BUMPER_R+BALL_R;
      if(dx*dx+dy*dy < rr*rr) return b;
    }
    return null;
  }
  blocksSight(x,y){
    if(this.solid(x,y)) return true;
    if(!this.bumps) return false;
    for(const b of this.bumps){
      const dx=x-b.x, dy=y-b.y;
      if(dx*dx+dy*dy < BUMPER_R*BUMPER_R) return true;
    }
    return false;
  }
  clearLine(a,b){
    const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])*8)+1;
    for(let k=0;k<=n;k++){
      const x=a[0]+(b[0]-a[0])*k/n, y=a[1]+(b[1]-a[1])*k/n;
      if(this.blocksSight(x,y)) return false;
      if(this.terrain(x,y)===WATER) return false;
    }
    return true;
  }
}

/* ---------- the one integrator ----------
   Both the judge and the live game run this, so a hole the judge calls aceable
   plays exactly the way it was judged. Returns '' while rolling, or one of
   'stop' / 'water' / 'holed'. `ev` collects things worth a sound or a puff. */
function advance(b, c, ev){
  const terr=c.terrain(b.x,b.y);
  if(terr===WATER) return 'water';
  const slope=SLOPE_VEC[terr];
  if(slope){ b.vx+=slope[0]*SLOPE_ACC*DT; b.vy+=slope[1]*SLOPE_ACC*DT; }

  let sp=Math.hypot(b.vx,b.vy);
  if(sp>0){
    const f = terr===SAND?FRICT_SAND:FRICT_FAIR;
    if(terr===SAND && ev) ev.sand=true;
    const ns=Math.max(0,sp-f*DT);
    b.vx=b.vx/sp*ns; b.vy=b.vy/sp*ns; sp=ns;
  }
  if(sp<STOP_SPEED){
    /* a slope keeps the ball rolling unless it is wedged against something */
    if(!slope) return 'stop';
    if(c.solid(b.x+slope[0]*0.45, b.y+slope[1]*0.45)) return 'stop';
  }

  const nx=b.x+b.vx*DT;
  if(c.solid(nx,b.y)){ b.vx=-b.vx*RESTITUTION; if(ev) ev.bounce=Math.max(ev.bounce||0,Math.abs(b.vx)); }
  else b.x=nx;
  const ny=b.y+b.vy*DT;
  if(c.solid(b.x,ny)){ b.vy=-b.vy*RESTITUTION; if(ev) ev.bounce=Math.max(ev.bounce||0,Math.abs(b.vy)); }
  else b.y=ny;

  const bump=c.bumper(b.x,b.y);
  if(bump){
    let nxv=b.x-bump.x, nyv=b.y-bump.y;
    let d=Math.hypot(nxv,nyv) || 1e-6;
    nxv/=d; nyv/=d;
    const pen=(BUMPER_R+BALL_R)-d;
    b.x+=nxv*pen; b.y+=nyv*pen;                 // separate first, so it cannot stick
    const dot=b.vx*nxv+b.vy*nyv;
    if(dot<0){
      b.vx=(b.vx-2*dot*nxv)*BUMPER_REST;
      b.vy=(b.vy-2*dot*nyv)*BUMPER_REST;
      if(ev) ev.bump=true;
    }
  }

  const dx=b.x-c.cup[0], dy=b.y-c.cup[1];
  if(dx*dx+dy*dy<CUP_R*CUP_R){
    if(Math.hypot(b.vx,b.vy)<CUP_CAPTURE) return 'holed';
    if(ev) ev.lip=true;
  }
  return '';
}

/* ---------- headless simulation, used by the judge ---------- */
function simulate(c, px, py, ang, power){
  const b={x:px, y:py, vx:Math.cos(ang)*power, vy:Math.sin(ang)*power};
  for(let t=0; t<10; t+=DT){
    const r=advance(b,c,null);
    if(r==='holed') return {x:b.x,y:b.y,holed:true,water:false};
    if(r==='water') return {x:b.x,y:b.y,holed:false,water:true};
    if(r==='stop') break;
  }
  if(c.terrain(b.x,b.y)===WATER) return {x:b.x,y:b.y,holed:false,water:true};
  return {x:b.x,y:b.y,holed:false,water:false};
}

/* ---------- generator ---------- */
function carve(cells,w,h,x,y,rad){
  const r2=rad*rad;
  for(let cy=Math.floor(y-rad)-1;cy<=Math.floor(y+rad)+1;cy++)
    for(let cx=Math.floor(x-rad)-1;cx<=Math.floor(x+rad)+1;cx++){
      /* never carve the outermost ring: every hole keeps a rail all the way round */
      if(cx<1||cy<1||cx>=w-1||cy>=h-1) continue;
      const dx=cx+0.5-x, dy=cy+0.5-y;
      if(dx*dx+dy*dy<=r2) cells[cy][cx]=FAIR;
    }
}

/* shape: 0 straight, 1 gentle, 2 dogleg, 3 double dogleg
   `portrait` runs the hole bottom-to-top instead of left-to-right. */
function buildCourse(rnd, difficulty, portrait){
  const W = portrait?16:26, H = portrait?26:16;
  const cells=[]; for(let y=0;y<H;y++){ cells.push(new Array(W).fill(WALL)); }

  const weights = [[34,34,26,6],[24,32,32,12],[14,28,38,20]][difficulty];
  let roll=rnd()*100, shape=0, acc=0;
  for(let i=0;i<4;i++){ acc+=weights[i]; if(roll<acc){shape=i;break} shape=i; }
  const segs=[1,1,2,3][shape], bend=[0,.30,.85,1][shape];

  /* major axis = length of the hole, minor axis = how far it wanders */
  const major = portrait?H:W, minor = portrait?W:H;
  let a = 2.6;                               // along major
  let b = minor*0.3 + rnd()*minor*0.4;       // along minor
  const pts=[[a,b]];
  for(let i=0;i<segs;i++){
    const na = a + (major-5.0-a)/(segs-i) * (0.85+rnd()*0.30);
    let nb = b + (rnd()*2-1)*bend*minor*0.42;
    nb = Math.min(minor-3.0, Math.max(3.0, nb));
    pts.push([na,nb]); a=na; b=nb;
  }
  const toXY = p => portrait ? [p[1], H-p[0]] : [p[0], p[1]];
  const tee = toXY(pts[0]);
  const cup = toXY([Math.min(major-3.0, pts[pts.length-1][0]), pts[pts.length-1][1]]);

  for(let i=0;i<pts.length-1;i++){
    const A=toXY(pts[i]), B=toXY(pts[i+1]);
    const rad=(1.9-difficulty*0.24)+rnd()*1.05;   // corridors tighten as the round goes on
    const n=Math.ceil(Math.hypot(B[0]-A[0],B[1]-A[1])*4)+1;
    for(let k=0;k<=n;k++) carve(cells,W,H, A[0]+(B[0]-A[0])*k/n, A[1]+(B[1]-A[1])*k/n, rad);
  }
  carve(cells,W,H,cup[0],cup[1],2.2);            // always a fair apron round the cup

  let c_bumps=[];
  const fair=[];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(cells[y][x]===FAIR) fair.push([x,y]);
  if(!fair.length) return null;
  const far=(x,y,dt,dc)=> Math.hypot(x+0.5-tee[0],y+0.5-tee[1])>dt &&
                          Math.hypot(x+0.5-cup[0],y+0.5-cup[1])>dc;

  const nIsl = 1 + difficulty + Math.floor(rnd()*(2+difficulty));
  for(let i=0;i<nIsl;i++){
    const [x,y]=fair[Math.floor(rnd()*fair.length)];
    if(!far(x,y,3.5,2.8)) continue;
    const bw=1+Math.floor(rnd()*3), bh=1+Math.floor(rnd()*3);
    for(let dy=0;dy<bh;dy++) for(let dx=0;dx<bw;dx++){
      if(y+dy<H && x+dx<W && far(x+dx,y+dy,3.0,2.4)) cells[y+dy][x+dx]=WALL;
    }
  }
  /* slopes: a patch that pushes the ball sideways, so a straight corridor stops
     being a straight shot. Placed across the hole rather than along it. */
  c_bumps = [];
  const nSlope = difficulty===0 ? (rnd()<0.25?1:0) : (rnd()<0.80?1+Math.floor(rnd()*difficulty):0);
  for(let i=0;i<nSlope;i++){
    const [x,y]=fair[Math.floor(rnd()*fair.length)];
    if(!far(x,y,4.5,3.2)) continue;
    const dir=[SLOPE_N,SLOPE_E,SLOPE_S,SLOPE_W][Math.floor(rnd()*4)];
    const bw=2+Math.floor(rnd()*3), bh=2+Math.floor(rnd()*3);
    for(let dy=0;dy<bh;dy++) for(let dx=0;dx<bw;dx++){
      if(y+dy<H && x+dx<W && cells[y+dy][x+dx]===FAIR && far(x+dx,y+dy,4.0,2.8))
        cells[y+dy][x+dx]=dir;
    }
  }
  /* bumpers: round and lively, they give energy back and open up carom lines */
  const nBump = difficulty===0 ? (rnd()<0.3?1:0) : 1+Math.floor(rnd()*(difficulty+1.2));
  for(let i=0;i<nBump;i++){
    const [x,y]=fair[Math.floor(rnd()*fair.length)];
    if(!far(x,y,4.0,3.0)) continue;
    if(cells[y][x]!==FAIR) continue;
    c_bumps.push({x:x+0.5, y:y+0.5});
  }

  for(const [kind,maxN] of [[SAND,1+difficulty],[WATER,difficulty]]){
    const n=Math.floor(rnd()*(maxN+1));
    for(let i=0;i<n;i++){
      const [x,y]=fair[Math.floor(rnd()*fair.length)];
      if(!far(x,y,4.0,3.0)) continue;
      const bw=1+Math.floor(rnd()*4), bh=1+Math.floor(rnd()*3);
      for(let dy=0;dy<bh;dy++) for(let dx=0;dx<bw;dx++){
        if(y+dy<H && x+dx<W && cells[y+dy][x+dx]===FAIR && far(x+dx,y+dy,3.5,2.6))
          cells[y+dy][x+dx]=kind;
      }
    }
  }
  if(cells[Math.floor(tee[1])][Math.floor(tee[0])]!==FAIR) return null;
  if(cells[Math.floor(cup[1])][Math.floor(cup[0])]!==FAIR) return null;

  /* Obstacles and hazards can wall off little pockets of green the ball can never
     reach. They are not playable, they are noise — and a pocket a cell across also
     collects the whole of the edge shading and renders as a black blob. Flood from
     the tee and turn anything unreachable back into rail. If the cup itself is cut
     off, the hole is not a hole. */
  const seen=new Array(W*H).fill(false);
  const stack=[[Math.floor(tee[0]),Math.floor(tee[1])]];
  seen[stack[0][1]*W+stack[0][0]]=true;
  while(stack.length){
    const [px,py]=stack.pop();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=px+dx, ny=py+dy;
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      const k=ny*W+nx;
      if(seen[k] || cells[ny][nx]===WALL) continue;
      seen[k]=true; stack.push([nx,ny]);
    }
  }
  if(!seen[Math.floor(cup[1])*W+Math.floor(cup[0])]) return null;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++)
    if(cells[y][x]!==WALL && !seen[y*W+x]) cells[y][x]=WALL;
  const c=new Course(W,H,cells,tee,cup);
  c.shape=shape; c.bumps=c_bumps;
  /* a bumper sitting on the tee or in the cup would be unplayable */
  c.bumps=c.bumps.filter(b=>Math.hypot(b.x-tee[0],b.y-tee[1])>2.4 &&
                            Math.hypot(b.x-cup[0],b.y-cup[1])>2.0);
  return c;
}

/* ---------- the judge ---------- */
const JUDGE_ANGLES=128, JUDGE_POWERS=[8,11,14,17,20,23,26,29,32];
const MAX_ACE_LINES=4, MAX_STRAIGHT_WINDOW=2;

function teeSweep(c){
  const hits=[];
  for(let i=0;i<JUDGE_ANGLES;i++){
    const a=2*Math.PI*i/JUDGE_ANGLES;
    for(const p of JUDGE_POWERS) if(simulate(c,c.tee[0],c.tee[1],a,p).holed) hits.push(i);
  }
  return hits;
}
function straightWindow(c){
  const a=Math.atan2(c.cup[1]-c.tee[1], c.cup[0]-c.tee[0]);
  let n=0;
  for(let p=6;p<34;p++) if(simulate(c,c.tee[0],c.tee[1],a,p).holed) n++;
  return n;
}
function aceLines(hits){
  if(!hits.length) return 0;
  const a=[...new Set(hits)].sort((x,y)=>x-y);
  let g=1;
  for(let i=1;i<a.length;i++) if(a[i]-a[i-1]>2) g++;
  if(a.length>1 && (a[0]+JUDGE_ANGLES-a[a.length-1])<=2 && g>1) g--;
  return g;
}
/* The coarse sweep only proves an ace exists somewhere near an angle. Measured over
   234 accepted holes, 10% had a widest ace window under one degree — true in
   principle, impossible in practice, which would make the game's promise hollow.
   So refine around each cluster and demand a window a person can actually hit. */
const MIN_ACE_WINDOW_DEG = 1.25;
function aceWindowDeg(c, hits){
  const step=0.25*Math.PI/180, sorted=[...new Set(hits)].sort((a,b)=>a-b);
  const reps=[]; let run=[sorted[0]];
  for(let i=1;i<sorted.length;i++){
    if(sorted[i]-sorted[i-1]<=2) run.push(sorted[i]);
    else { reps.push(run[Math.floor(run.length/2)]); run=[sorted[i]] }
  }
  reps.push(run[Math.floor(run.length/2)]);
  let best=0;
  for(const idx of reps){
    const a0=2*Math.PI*idx/JUDGE_ANGLES;
    let cur=0;
    for(let a=a0-2*Math.PI/180; a<=a0+2*Math.PI/180; a+=step){
      let hit=false;
      for(const pw of JUDGE_POWERS) if(simulate(c,c.tee[0],c.tee[1],a,pw).holed){hit=true;break}
      if(hit){ cur+=0.25; if(cur>best) best=cur } else cur=0;
    }
  }
  return best;
}
function judge(c){
  const hits=teeSweep(c);
  if(!hits.length) return null;
  if(straightWindow(c)>MAX_STRAIGHT_WINDOW) return null;
  const lines=aceLines(hits);
  if(lines>MAX_ACE_LINES) return null;
  const win=aceWindowDeg(c,hits);
  if(win<MIN_ACE_WINDOW_DEG) return null;
  c.aceLines=lines; c.aceShots=hits.length; c.aceWindow=win;
  return c;
}
function makeHole(rnd, difficulty, portrait){
  for(let k=0;k<80;k++){
    const c=buildCourse(rnd,difficulty,portrait);
    if(!c) continue;
    if(judge(c)) return c;
  }
  /* Should not happen — acceptance is ~48% — but never hand back nothing. */
  for(let k=0;k<200;k++){
    const c=buildCourse(rnd,0,portrait);
    if(c && teeSweep(c).length){ c.aceLines=9; c.aceShots=1; return c; }
  }
  return null;
}
/* Par used to be a guess from the hole's shape. Since every hole is aceable by
   construction, the optimum is always 1, so par cannot come from the optimum —
   it has to come from how a reasonable player actually fares. This plays the
   hole several times with a player who sweeps for the shot that ends nearest
   the cup and then misses it, and takes the median. The error was picked by
   measurement, not taste: swept over 90 holes, 1.5 degrees gives 59% par 2 and
   32% par 3 with mean par rising 2.43 / 2.50 / 2.67 across the three difficulty
   tiers. Wider errors pile up par 4s and 5s, which is not minigolf; narrower
   ones make every hole a par 2 and difficulty stops showing at all. */
function parFor(c){
  const trials=[], SWEEP=48, POWS=[9,13,17,21,25,29];
  for(let t=0;t<5;t++){
    let x=c.tee[0], y=c.tee[1], strokes=0, rest=[x,y];
    while(strokes<9){
      let best=null;
      for(let i=0;i<SWEEP;i++){
        const a=2*Math.PI*i/SWEEP;
        for(const pw of POWS){
          const r=simulate(c,x,y,a,pw);
          if(r.water) continue;
          const d=r.holed?-1:Math.hypot(r.x-c.cup[0],r.y-c.cup[1]);
          if(!best||d<best.d) best={a,pw,d};
        }
      }
      if(!best) break;
      /* execution error: about 3 degrees of aim and a tenth of the weight.
         Deterministic per (trial, stroke) so a hole's par never changes. */
      const h=(t*7919+strokes*104729)%10007;
      const jitter=((h%1000)/1000-0.5)*1.5*Math.PI/180;
      const pwErr=1+((Math.floor(h/1000)%1000)/1000-0.5)*0.14;
      const r=simulate(c,x,y,best.a+jitter,best.pw*pwErr);
      strokes++;
      if(r.holed){ trials.push(strokes); break }
      if(r.water){ strokes++; x=rest[0]; y=rest[1] } else { x=r.x; y=r.y; rest=[x,y] }
      if(strokes>=9){ trials.push(9); break }
    }
    if(trials.length<=t) trials.push(9);
  }
  trials.sort((a,b)=>a-b);
  return Math.max(2, Math.min(4, trials[Math.floor(trials.length/2)]));
}

/* ============================ audio ============================ */
let actx=null;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)() }catch(e){} } return actx }
function blip(freq,dur,type,gain,slideTo){
  const a=ac(); if(!a) return;
  if(a.state==='suspended') a.resume();
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,a.currentTime);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime+dur);
  g.gain.setValueAtTime(0,a.currentTime);
  g.gain.linearRampToValueAtTime(gain||0.16, a.currentTime+0.008);
  g.gain.exponentialRampToValueAtTime(0.0008, a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}
function noise(dur,gain,filt){
  const a=ac(); if(!a) return;
  const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=a.createBufferSource(); s.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filt||1400;
  const g=a.createGain(); g.gain.value=gain||0.12;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const snd={
  putt:p=>blip(190+p*7,0.09,'triangle',0.10+p*0.004),
  bounce:v=>noise(0.05,Math.min(0.14,0.02+v*0.006),900+v*40),
  sand:()=>noise(0.16,0.07,700),
  water:()=>{blip(500,0.22,'sine',0.10,150); noise(0.22,0.07,500)},
  cup:()=>{blip(520,0.10,'sine',0.13); setTimeout(()=>blip(780,0.22,'sine',0.13),80)},
  ace:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,0.30,'triangle',0.14),i*95))},
  card:()=>blip(330,0.12,'sine',0.09,440)
};

/* ============================ game ============================ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const stage=document.getElementById('stage'), tipEl=document.getElementById('tip');
const el=id=>document.getElementById(id);

const G={
  seed:'', rnd:null, holes:[], idx:0, scores:[], pars:[], spin:[1,0,0,0,1,0,0,0,1],
  course:null, ball:{x:0,y:0,vx:0,vy:0}, rest:[0,0],
  strokes:0, moving:false, holed:false, aiming:false,
  aimFrom:null, aimTo:null, portrait:false, view:null,
  trail:[], parts:[], shake:0, tPrev:0, acc:0, settleT:0, best:null
};

function isPortrait(){ return stage.clientHeight > stage.clientWidth*1.08 }

/* Building a round is a second of work, so it happens behind a card rather than
   a frozen screen. The three tiers vary how much furniture a hole gets; the order
   you actually play them in comes from the measured par, so the round ramps because
   the holes were measured, not because a tier said they should. */
function newRound(seed){
  G.seed = seed;
  G.rnd = mulberry32(hashStr(seed));
  G.portrait = isPortrait();
  G.holes=[]; G.pars=[]; G.scores=[]; G.idx=0; G.course=null;
  try{ G.best = JSON.parse(localStorage.getItem('nineholes.best')||'null') }catch(e){ G.best=null }
  try{ history.replaceState(null,'', location.pathname+'?seed='+encodeURIComponent(seed)) }catch(e){}

  G.building=true;
  const panelEl = panel('<h2>Building the course</h2>'+
    '<p>Nine holes, each one checked for a hole-in-one before it is let through.</p>'+
    '<div id="bar" style="height:6px;background:#24331f;border-radius:99px;overflow:hidden">'+
    '<div id="fill" style="height:100%;width:0;background:var(--accent);transition:width .2s"></div></div>');
  const built=[];
  let i=0;
  const tick=()=>{
    if(i<HOLES){
      const diff = i<3?0 : i<6?1 : 2;
      const c = makeHole(G.rnd, diff, G.portrait);
      built.push({c, par:parFor(c)});
      i++;
      const f=panelEl.querySelector('#fill'); if(f) f.style.width=Math.round(100*i/HOLES)+'%';
      requestAnimationFrame(()=>setTimeout(tick,0));
      return;
    }
    built.sort((a,b)=>a.par-b.par);        // gentlest first, by measurement
    G.holes=built.map(b=>b.c); G.pars=built.map(b=>b.par);
    G.building=false; closePanel(); loadHole(0);
  };
  requestAnimationFrame(()=>setTimeout(tick,0));
}

function loadHole(i){
  G.idx=i; G.course=G.holes[i];
  G.ball.x=G.course.tee[0]; G.ball.y=G.course.tee[1]; G.ball.vx=0; G.ball.vy=0;
  G.rest=[G.ball.x,G.ball.y];
  G.strokes=0; G.moving=false; G.holed=false; G.trail=[]; G.parts=[]; G.kb=null; G.bgKey=null;
  spinReset(); G.spinFrom=null;
  layout(); updateHUD();
}

function updateHUD(){
  if(!G.pars.length) return;
  el('hnum').textContent=G.idx+1;
  el('hpar').textContent=G.pars[G.idx];
  el('hstr').textContent=G.strokes;
  let d=0; for(let i=0;i<G.scores.length;i++) d += G.scores[i]-G.pars[i];
  el('htot').textContent = d===0?'E':(d>0?'+'+d:''+d);
  el('htot').className='b '+(d<0?'u':d>0?'o':'e');
}

/* ---------- view transform ---------- */
function layout(){
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  const w=stage.clientWidth, h=stage.clientHeight;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const c=G.course; if(!c) return;
  if(!c.bbox){                       /* playable extent, so the hole fills the screen */
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(let y=0;y<c.h;y++) for(let x=0;x<c.w;x++) if(c.cells[y][x]!==WALL){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    }
    c.bbox=[x0-1.15, y0-1.15, x1+2.15, y1+2.15];
  }
  const [bx0,by0,bx1,by1]=c.bbox;
  const bw=bx1-bx0, bh=by1-by0, pad=14;
  const s=Math.min((w-pad*2)/bw, (h-pad*2)/bh);
  G.view={ s, ox:(w-bw*s)/2 - bx0*s, oy:(h-bh*s)/2 - by0*s, w, h };
}
const vx = x => G.view.ox + x*G.view.s;
const vy = y => G.view.oy + y*G.view.s;
const ux = px => (px-G.view.ox)/G.view.s;
const uy = py => (py-G.view.oy)/G.view.s;

/* ---------- input ---------- */
function pointerPos(e){
  const r=cv.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return [t.clientX-r.left, t.clientY-r.top];
}
function down(e){
  if(G.moving||G.holed||document.querySelector('.panel')) return;
  const [px,py]=pointerPos(e);
  const bx=vx(G.ball.x), by=vy(G.ball.y);
  if(Math.hypot(px-bx,py-by) > Math.max(46, G.view.s*2.4)) return;
  G.aiming=true; G.kb=null; G.aimFrom=[bx,by]; G.aimTo=[px,py];
  ac(); e.preventDefault();
}
function move(e){
  if(!G.aiming) return;
  G.aimTo=pointerPos(e); e.preventDefault();
}
function up(e){
  if(!G.aiming) return;
  G.aiming=false;
  const dx=G.aimFrom[0]-G.aimTo[0], dy=G.aimFrom[1]-G.aimTo[1];
  const len=Math.hypot(dx,dy);
  if(len<10){ return; }
  const maxDrag=Math.min(170, Math.min(G.view.w,G.view.h)*0.42);
  const power=Math.min(1, len/maxDrag)*MAX_POWER;
  if(power<3) return;
  const ang=Math.atan2(dy,dx);
  G.ball.vx=Math.cos(ang)*power; G.ball.vy=Math.sin(ang)*power;
  G.moving=true; G.strokes++; G.rollT=0; G.trail=[];
  snd.putt(power/MAX_POWER*10);
  updateHUD(); hideTip(); e.preventDefault();
}
cv.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});
window.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',up,{passive:false});

/* Fine aim. The ace window is a couple of degrees wide, which a drag can just about
   hit and a keyboard can hit reliably; arrows also make the game playable one-handed. */
function kbStart(){
  if(G.kb) return;
  G.kb={ang: Math.atan2(G.course.cup[1]-G.ball.y, G.course.cup[0]-G.ball.x), pow:16};
}
window.addEventListener('keydown',e=>{
  if(G.moving||G.holed||document.querySelector('.panel')) return;
  const fine=e.shiftKey?0.1:0.6;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    kbStart(); G.kb.ang += (e.key==='ArrowLeft'?-1:1)*fine*Math.PI/180; e.preventDefault();
  } else if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    kbStart(); G.kb.pow=Math.max(4,Math.min(MAX_POWER, G.kb.pow+(e.key==='ArrowUp'?1:-1)*(e.shiftKey?0.25:1)));
    e.preventDefault();
  } else if(e.key===' '||e.key==='Enter'){
    if(!G.kb) return;
    ac();
    G.ball.vx=Math.cos(G.kb.ang)*G.kb.pow; G.ball.vy=Math.sin(G.kb.ang)*G.kb.pow;
    G.moving=true; G.strokes++
