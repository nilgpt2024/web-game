    <style>:root {
        --bg: #0a0a0f;
        --bg-light: #12121a;
        --bg-card: #16161f;
        --border: #2a2a3a;
        --text: #c8c8d4;
        --text-dim: #5a5a6e;
        --text-bright: #eeeef4;
        --green: #4ade80;
        --red: #f87171;
        --gold: #fbbf24;
        --gold-dim: #92710a;
        --cyan: #22d3ee;
        --orange: #fb923c;
        --purple: #a78bfa;
        --nuke: #e879f9;
        --danger: #dc2626;
        --hp-bar: #22c55e;
        --hp-bg: #1a1a2a;
        --freeze: #7dd3fc;
        --split: #bef264
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Courier New', Courier, monospace;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        user-select: none;
        -webkit-user-select: none;
        transition: background-color 2s ease
    }

    #combat-screen {
        display: none;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        position: relative
    }

    #stats-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        background: var(--bg-light);
        border-bottom: 1px solid var(--border);
        z-index: 10;
        height: 48px;
        flex-shrink: 0;
        flex-wrap: wrap;
        gap: 4px
    }

    .stat {
        font-size: 13px;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 6px
    }

    .stat-label {
        color: var(--text-dim)
    }

    .stat-value {
        color: var(--text-bright);
        font-weight: bold;
        display: inline-block
    }

    .stat-gold .stat-value {
        color: var(--gold)
    }

    .stat-streak .stat-value {
        color: var(--cyan);
        transition: text-shadow 0.3s
    }

    .stat-streak .stat-value.streak-fire {
        text-shadow: 0 0 8px rgba(251, 191, 36, 0.6), 0 0 16px rgba(251, 191, 36, 0.3);
        color: var(--gold)
    }

    .stat-streak .stat-value.streak-inferno {
        text-shadow: 0 0 12px rgba(248, 113, 113, 0.7), 0 0 24px rgba(251, 146, 60, 0.5), 0 0 36px rgba(251, 191, 36, 0.3);
        color: var(--red);
        animation: infernoFlicker 0.4s ease-in-out infinite alternate
    }

    @keyframes infernoFlicker {
        0% {
            text-shadow: 0 0 12px rgba(248, 113, 113, 0.7), 0 0 24px rgba(251, 146, 60, 0.5)
        }
        100% {
            text-shadow: 0 0 16px rgba(248, 113, 113, 0.9), 0 0 30px rgba(251, 146, 60, 0.7), 0 0 40px rgba(251, 191, 36, 0.4)
        }
    }

    .stat-gold .stat-value.gold-flash {
        animation: goldPulse 0.35s ease
    }

    @keyframes goldPulse {
        0% {
            transform: scale(1)
        }
        40% {
            transform: scale(1.25);
            color: #fff
        }
        100% {
            transform: scale(1);
            color: var(--gold)
        }
    }

    #hp-container {
        display: flex;
        align-items: center;
        gap: 8px
    }

    #hp-bar-outer {
        width: 120px;
        height: 16px;
        background: var(--hp-bg);
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden
    }

    #hp-bar-inner {
        height: 100%;
        background: var(--hp-bar);
        transition: width 0.3s ease
    }

    #hp-text {
        font-size: 13px;
        color: var(--text-bright);
        min-width: 50px
    }

    #hp-container.hp-shake {
        animation: hpShake 0.3s ease
    }

    @keyframes hpShake {
        0%, 100% {
            transform: translateX(0)
        }
        20% {
            transform: translateX(-4px)
        }
        40% {
            transform: translateX(4px)
        }
        60% {
            transform: translateX(-3px)
        }
        80% {
            transform: translateX(2px)
        }
    }

    #game-area {
        flex: 1;
        position: relative;
        overflow: hidden
    }

    #danger-zone {
        position: absolute;
        bottom: 60px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--danger);
        opacity: 0.6;
        z-index: 5;
        transition: opacity 0.5s, height 0.5s
    }

    #danger-label {
        position: absolute;
        bottom: 64px;
        right: 16px;
        font-size: 10px;
        color: var(--danger);
        opacity: 0.5;
        letter-spacing: 2px;
        z-index: 5
    }

    #input-display {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: var(--bg-light);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        letter-spacing: 4px;
        z-index: 10
    }

    #input-display .typed {
        color: var(--green)
    }

    #input-display .typed-auto {
        color: var(--cyan)
    }

    #input-display .pending {
        color: var(--text-dim)
    }

    #input-display .cursor {
        display: inline-block;
        width: 2px;
        height: 24px;
        background: var(--text-bright);
        animation: blink 0.8s step-end infinite;
        vertical-align: middle;
        margin-left: 1px
    }

    @keyframes blink {
        50% {
            opacity: 0
        }
    }

    #wpm-display {
        position: absolute;
        bottom: 62px;
        left: 16px;
        font-size: 11px;
        color: var(--text-dim);
        letter-spacing: 1px;
        z-index: 10;
        opacity: 0.6
    }

    #keybind-hint {
        position: absolute;
        bottom: 74px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        color: var(--text-dim);
        letter-spacing: 1px;
        z-index: 10;
        opacity: 0;
        animation: hintFade 8s ease forwards;
        white-space: nowrap
    }

    @keyframes hintFade {
        0% {
            opacity: 0
        }
        8% {
            opacity: 0.7
        }
        75% {
            opacity: 0.7
        }
        100% {
            opacity: 0
        }
    }

    .word-entity {
        position: absolute;
        font-size: 18px;
        letter-spacing: 2px;
        padding: 4px 10px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        white-space: nowrap;
        transition: border-color 0.15s, box-shadow 0.15s;
        z-index: 2;
        pointer-events: none;
        animation: wordSpawn 0.18s ease-out
    }

    .word-entity.targeted {
        border-color: var(--green);
        box-shadow: 0 0 8px rgba(74, 222, 128, 0.2)
    }

    .word-entity.auto-targeted {
        border-color: var(--cyan);
        box-shadow: 0 0 6px rgba(34, 211, 238, 0.15)
    }

    .word-entity .char-typed {
        color: var(--green)
    }

    .word-entity .char-auto {
        color: var(--cyan)
    }

    .word-entity .char-pending {
        color: var(--text)
    }

    .word-entity.bomb {
        border-color: var(--orange);
        box-shadow: 0 0 10px rgba(251, 146, 60, 0.25);
        animation: wordSpawn 0.18s ease-out, bombPulse 1.2s ease-in-out 0.18s infinite
    }

    .word-entity.nuke {
        border-color: var(--nuke);
        box-shadow: 0 0 12px rgba(232, 121, 249, 0.3);
        animation: wordSpawn 0.18s ease-out, nukePulse 0.9s ease-in-out 0.18s infinite
    }

    .word-entity.freeze {
        border-color: var(--freeze);
        box-shadow: 0 0 10px rgba(125, 211, 252, 0.25);
        animation: wordSpawn 0.18s ease-out, freezePulse 1.5s ease-in-out 0.18s infinite
    }

    .word-entity.split {
        border-color: var(--split);
        border-style: dashed;
        box-shadow: 0 0 8px rgba(190, 242, 100, 0.2);
        animation: wordSpawn 0.18s ease-out
    }

    .word-entity.fast-word {
        border-style: double;
        border-width: 3px
    }

    .word-entity.frozen-state {
        border-color: var(--freeze) !important;
        box-shadow: 0 0 12px rgba(125, 211, 252, 0.35) !important
    }

    .word-progress {
        position: absolute;
        bottom: -3px;
        left: 0;
        height: 2px;
        background: var(--green);
        transition: width 0.08s ease;
        border-radius: 0 0 1px 1px
    }

    .word-entity.bomb .word-progress {
        background: var(--orange)
    }

    .word-entity.nuke .word-progress {
        background: var(--nuke)
    }

    .word-entity.freeze .word-progress {
        background: var(--freeze)
    }

    .word-entity.split .word-progress {
        background: var(--split)
    }

    @keyframes wordSpawn {
        from {
            opacity: 0;
            transform: translateY(-10px)
        }
        to {
            opacity: 1;
            transform: translateY(0)
        }
    }

    @keyframes bombPulse {
        0%, 100% {
            box-shadow: 0 0 6px rgba(251, 146, 60, 0.2)
        }
        50% {
            box-shadow: 0 0 14px rgba(251, 146, 60, 0.45)
        }
    }

    @keyframes nukePulse {
        0%, 100% {
            box-shadow: 0 0 8px rgba(232, 121, 249, 0.25)
        }
        50% {
            box-shadow: 0 0 18px rgba(232, 121, 249, 0.5)
        }
    }

    @keyframes freezePulse {
        0%, 100% {
            box-shadow: 0 0 6px rgba(125, 211, 252, 0.2)
        }
        50% {
            box-shadow: 0 0 14px rgba(125, 211, 252, 0.4)
        }
    }

    .word-entity.destroying {
        animation: wordDestroy 0.35s ease-out forwards
    }

    @keyframes wordDestroy {
        0% {
            transform: scale(1);
            opacity: 1
        }
        50% {
            transform: scale(1.2);
            opacity: 0.6
        }
        100% {
            transform: scale(0.3);
            opacity: 0
        }
    }

    .word-entity.fell {
        animation: wordFell 0.3s ease forwards
    }

    @keyframes wordFell {
        to {
            opacity: 0;
            transform: translateY(20px)
        }
    }

    .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        pointer-events: none;
        z-index: 20;
        animation: particleFly 0.45s ease-out forwards
    }

    @keyframes particleFly {
        0% {
            opacity: 1;
            transform: translate(0, 0) scale(1)
        }
        100% {
            opacity: 0;
            transform: translate(var(--px), var(--py)) scale(0.2)
        }
    }

    .bomb-shockwave {
        position: absolute;
        border-radius: 50%;
        border: 2px solid var(--orange);
        pointer-events: none;
        z-index: 20;
        animation: shockwave 0.5s ease-out forwards
    }

    @keyframes shockwave {
        0% {
            width: 0;
            height: 0;
            opacity: 1
        }
        100% {
            width: 300px;
            height: 300px;
            opacity: 0;
            margin-left: -150px;
            margin-top: -150px
        }
    }

    .nuke-flash {
        position: fixed;
        inset: 0;
        background: var(--nuke);
        opacity: 0;
        z-index: 100;
        pointer-events: none;
        animation: nukeFlash 0.6s ease-out forwards
    }

    @keyframes nukeFlash {
        0% {
            opacity: 0.5
        }
        100% {
            opacity: 0
        }
    }

    .freeze-flash {
        position: fixed;
        inset: 0;
        background: var(--freeze);
        opacity: 0;
        z-index: 100;
        pointer-events: none;
        animation: freezeFlash 0.5s ease-out forwards
    }

    @keyframes freezeFlash {
        0% {
            opacity: 0.25
        }
        100% {
            opacity: 0
        }
    }

    .gold-popup {
        position: absolute;
        color: var(--gold);
        font-size: 14px;
        font-weight: bold;
        pointer-events: none;
        z-index: 15;
        animation: goldFloat 0.8s ease-out forwards
    }

    @keyframes goldFloat {
        0% {
            opacity: 1;
            transform: translateY(0)
        }
        100% {
            opacity: 0;
            transform: translateY(-40px)
        }
    }

    .combo-popup {
        position: absolute;
        left: 50%;
        top: 40%;
        transform: translateX(-50%);
        font-size: 28px;
        font-weight: bold;
        pointer-events: none;
        z-index: 25;
        letter-spacing: 4px;
        animation: comboFloat 1s ease-out forwards
    }

    @keyframes comboFloat {
        0% {
            opacity: 0;
            transform: translateX(-50%) scale(0.5)
        }
        15% {
            opacity: 1;
            transform: translateX(-50%) scale(1.1)
        }
        30% {
            transform: translateX(-50%) scale(1)
        }
        100% {
            opacity: 0;
            transform: translateX(-50%) translateY(-60px)
        }
    }

    .crit-flash {
        position: absolute;
        font-size: 16px;
        color: var(--gold);
        font-weight: bold;
        pointer-events: none;
        z-index: 25;
        letter-spacing: 3px;
        animation: critPop 0.6s ease-out forwards
    }

    @keyframes critPop {
        0% {
            opacity: 0;
            transform: scale(0.3)
        }
        20% {
            opacity: 1;
            transform: scale(1.3)
        }
        40% {
            transform: scale(1)
        }
        100% {
            opacity: 0;
            transform: translateY(-30px)
        }
    }

    .damage-flash {
        position: fixed;
        inset: 0;
        background: var(--red);
        opacity: 0;
        z-index: 50;
        pointer-events: none;
        animation: dmgFlash 0.3s ease-out forwards
    }

    @keyframes dmgFlash {
        0% {
            opacity: 0.15
        }
        100% {
            opacity: 0
        }
    }

    #input-display.shake {
        animation: inputShake 0.25s ease
    }

    @keyframes inputShake {
        0%, 100% {
            transform: translateX(0)
        }
        20% {
            transform: translateX(-4px)
        }
        40% {
            transform: translateX(4px)
        }
        60% {
            transform: translateX(-3px)
        }
        80% {
            transform: translateX(3px)
        }
    }

    #round-over {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 15, 0.92);
        z-index: 200;
        flex-direction: column;

        gap: 24px
    }

    #round-over h1 {

    }

    #round-over .new-record {

    }

    #round-summary {
        display: flex;

    }

    #round-summary .sum-item {
        text-align: center
    }

    #round-summary .sum-value {
        font-size: 24px;
        color: var(--text-bright);
        display: block;
        margin-bottom: 4px
    }

    #round-summary .sum-label {
        color: var(--text-dim);

    }

    .sum-value.record {
        color: var(--gold) !important
    }

    #round-gold {
        font-size: 22px;
        color: var(--gold);
        margin-top: 8px
    }

    #round-buttons {
        display: flex;
        gap: 16px;

    }

    .btn {

    #shop-screen {
        display: none;
        flex-direction: column;
        height: 100vh;

    }

    #shop-header {

    }

    #shop-header h1 {

    }

    }

    .upgrade-preview {

    .upgrade-buy {

    @keyframes buyFlash {

    #prestige-card {

    }

    @keyframes prestigePulse {
        0%, 100% {
            box-shadow: 0 0 8px rgba(167, 139, 250, 0.15)
        }
        50% {
